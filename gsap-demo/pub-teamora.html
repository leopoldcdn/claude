<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pub Teamora</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2) format('woff2'); }

  :root { --bg: #f4f5fb; --surface-2: #eef0f8; --line: #e0e3ef; --fg: #151935; --muted: #5f6589; --faint: #8d92b0;

    --shadow: 0 1px 2px rgba(21, 25, 53, .06), 0 10px 30px rgba(21, 25, 53, .08); --shadow-lg: 0 30px 80px rgba(21, 25, 53, .18); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { background: #e6e3de; font-family: 'Inter', sans-serif; color: var(--fg); }
  .h { opacity: 0; }
  svg { flex: none; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: linear-gradient(180deg, #c9cedd 0%, #e9ebf2 60%, #f4f5f9 100%); }
  .abs { position: absolute; }

  /* ================= Hook : a computer desktop, full screen ================= */
  #studio { position: absolute; inset: 0; z-index: 2; background: linear-gradient(140deg, #dfe4ee 0%, #eceef4 50%, #e4e0ea 100%); transform-origin: 960px 540px; }

  #d-dock { position: absolute; left: 50%; bottom: 18px; width: 560px; margin-left: -280px; height: 84px; border-radius: 26px; background: #ffffff8c; display: flex; gap: 18px; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(21, 25, 53, .08); }
  #d-dock i { width: 58px; height: 58px; border-radius: 16px; }
  .stoast { position: absolute; right: 24px; width: 470px; height: 86px; border-radius: 18px; background: #fff; box-shadow: 0 14px 34px rgba(21, 25, 53, .16); display: flex; align-items: center; gap: 16px; padding: 0 20px; font-size: 21px; font-weight: 700; opacity: 0; }
  .stoast span { width: 46px; height: 46px; border-radius: 12px; flex: none; }
  .stoast small { display: block; font-size: 16px; color: #8d92b0; font-weight: 500; }
  #d-red { position: absolute; inset: 0; background: radial-gradient(circle, #e11d4800 45%, #e11d4840 100%); opacity: 0; }

  #h-logo { position: absolute; width: 180px; height: 180px; opacity: 0; color: #fff; }

  .node .ck svg { width: 18px; height: 18px; }
  .zoomer { position: absolute; left: -48px; top: -48px; width: 96px; height: 96px; border-radius: 50%; opacity: 0; }
  /* Requests flooding in */
  .rq { position: absolute; left: 0; top: 0; background: #fff; border-radius: 16px; box-shadow: 0 20px 44px rgba(40, 35, 30, .22); display: flex; align-items: center; gap: 13px; padding: 15px 20px; font-size: 20px; font-weight: 700; white-space: nowrap; opacity: 0; color: var(--fg); }
  .rq svg { width: 28px; height: 28px; }

  #puddle { width: 320px; height: 320px; margin: -160px 0 0 -160px; background: radial-gradient(circle at 40% 35%, #c7d2fe 0%, #6366f1 35%, #4f46e5 60%, #0ea5c6 100%); box-shadow: 0 0 0 10px #6366f133; }
  .rip { width: 200px; height: 200px; margin: -100px 0 0 -100px; border: 9px solid #6366f1; }
  .dl { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #e0e7ff 0%, #6366f1 45%, #0ea5c6 100%); opacity: 0; z-index: 31; }
  #splash { position: absolute; left: 960px; top: 540px; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; border: 10px solid #6366f1; opacity: 0; z-index: 29; }

  /* ================= 3D world : software pages ================= */

  .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(140deg, #4f46e5, #0ea5c6); color: #fff; display: flex; align-items: center; justify-content: center; }

  .rail .ri { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; position: relative; flex: none; }
  .rail .ri svg { width: 24px; height: 24px; }
  .rail .ri.g { background: #fff; border: 1px solid var(--line); color: var(--muted); border-radius: 14px; }
  .rail .ri.on { box-shadow: 0 0 0 4px #fff, 0 0 0 7px currentColor; }
  .rail .sep { width: 1px; height: 40px; background: var(--line); margin: 0 10px; }
  .rail .bd { position: absolute; top: -7px; right: -9px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; background: var(--warn); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }

  .card-h { display: flex; align-items: center; justify-content: space-between; padding: 22px 28px 12px; }
  .card-h h3 { font-size: 24px; font-weight: 800; letter-spacing: -0.3px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 99px; font-size: 16px; font-weight: 700; white-space: nowrap; }
  .pill svg { width: 15px; height: 15px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.neu { background: var(--surface-2); color: var(--muted); } .pill.acc { background: var(--accent-soft); color: var(--accent); }
  .stk { position: relative; display: inline-block; height: 34px; }
  .stk > * { position: absolute; right: 0; top: 0; }
  .focus { position: absolute; border: 4px solid #4f46e5; border-radius: 22px; box-shadow: 0 0 40px #4f46e566; opacity: 0; }

  /* Home page wheel */
  .node { position: absolute; left: -48px; top: -48px; width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; opacity: 0; box-shadow: 0 0 0 5px #ffffffaa, 0 14px 30px rgba(21, 25, 53, .22); }

    background: radial-gradient(circle at 30% 25%, #ffffff40 0%, #ffffff00 40%), linear-gradient(150deg, #4f46e5 0%, #0ea5c6 100%); box-shadow: 0 0 0 18px #ffffff99, 0 0 0 19px #4f46e522, 0 40px 90px #4f46e555; }
  .hub-in small { display: block; font-size: 18px; font-weight: 700; letter-spacing: 5px; color: #e0e7ff; }
  .hub-in b { display: block; font-size: 44px; font-weight: 800; letter-spacing: -1px; margin-top: 8px; }
  .hub-in span { display: inline-block; margin-top: 16px; font-size: 20px; font-weight: 700; background: #ffffff2e; padding: 9px 18px; border-radius: 99px; font-variant-numeric: tabular-nums; }

  /* Recruitment */
  .fz { position: absolute; top: 300px; width: 160px; margin-left: -80px; text-align: center; }

  .burst { position: absolute; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%; border: 7px solid #10b981; opacity: 0; }

  .rc .bar { margin-top: 8px; width: 240px; height: 6px; }
  .rc.sel { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
  .bar { height: 9px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: #10b981; }
  .tabs { display: flex; gap: 34px; padding: 0 28px; border-bottom: 1px solid var(--line); }
  .tabs > span { padding: 14px 2px; font-size: 18px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
  .tabs > span.on { color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
  .tabs .bar { width: 190px; }
  .row { position: absolute; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 28px; border-top: 1px solid #eef0f8; font-size: 19px; font-weight: 600; }

  .sigbox svg { position: absolute; left: 40px; top: 36px; }
  .sigbox path { stroke-dasharray: 1000; stroke-dashoffset: 1000; }

  /* Payroll */
  .stp { position: absolute; top: 300px; width: 410px; display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: var(--faint); padding-bottom: 16px; }
  .stp .n { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 17px; position: relative; }

  .pcol { position: absolute; top: 380px; width: 410px; }

  .presta { position: absolute; border-radius: 18px; border: 2px dashed #c7d2fe; background: #f5f7ff; text-align: center; }
  .presta b { display: block; font-size: 19px; margin-top: 10px; } .presta small { font-size: 14px; color: var(--muted); }
  .presta .ok2 { position: absolute; right: -14px; top: -14px; width: 42px; height: 42px; border-radius: 50%; background: #10b981; display: flex; align-items: center; justify-content: center; transform: scale(0); color: #fff; }
