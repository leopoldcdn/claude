<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>GSAP Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 30% 20%, #1e1b4b 0%, #0b0b14 60%);
    font-family: 'DejaVu Sans', system-ui, sans-serif; color: #fff;
  }
  .stage { position: relative; width: 100%; height: 100%; }
  .blob { position: absolute; border-radius: 50%; opacity: 0; }
  .b1 { width: 520px; height: 520px; background: radial-gradient(circle, #7c3aedcc 0%, #7c3aed00 70%); left: 180px; top: 140px; }
  .b2 { width: 460px; height: 460px; background: radial-gradient(circle, #06b6d4cc 0%, #06b6d400 70%); right: 220px; bottom: 120px; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(#ffffff0d 1px, transparent 1px), linear-gradient(90deg, #ffffff0d 1px, transparent 1px);
    background-size: 80px 80px; opacity: 0; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .eyebrow { font-size: 34px; letter-spacing: 14px; text-transform: uppercase; color: #a5b4fc; opacity: 0; }
  h1 { font-size: 200px; font-weight: 800; line-height: 1; margin: 24px 0; display: flex; }
  h1 span { display: inline-block; opacity: 0; }
  .line { width: 0; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #7c3aed, #06b6d4); }
  .sub { font-size: 44px; color: #cbd5e1; margin-top: 36px; opacity: 0; }
  .stats { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 120px; }
  .stat { text-align: center; opacity: 0; }
  .stat .n { font-size: 150px; font-weight: 800;
    background: linear-gradient(135deg, #c4b5fd, #67e8f9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat .l { font-size: 36px; color: #94a3b8; margin-top: 8px; }
  .outro { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .outro .logo { width: 180px; height: 180px; border-radius: 44px; background: linear-gradient(135deg, #7c3aed, #06b6d4);
    display: flex; align-items: center; justify-content: center; font-size: 96px; font-weight: 800; transform: scale(0); }
  .outro .txt { font-size: 90px; font-weight: 800; margin-left: 48px; opacity: 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="center" id="intro">
    <div class="eyebrow">Démo vidéo</div>
    <h1 id="title"></h1>
    <div class="line"></div>
    <div class="sub">Animé avec GSAP · rendu en MP4</div>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="n" data-to="60">0</div><div class="l">images / seconde</div></div>
    <div class="stat"><div class="n" data-to="1080">0</div><div class="l">pixels de haut</div></div>
    <div class="stat"><div class="n" data-to="100">0</div><div class="l">% code</div></div>
  </div>

  <div class="outro" id="outro">
    <div class="logo">G</div>
    <div class="txt">Créé par Claude</div>
  </div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
  // Split the title into letters
  const title = document.getElementById('title');
  for (const ch of 'GSAP') {
    const s = document.createElement('span');
    s.textContent = ch;
    title.appendChild(s);
  }

  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  // Background
  tl.to('.grid', { opacity: 1, duration: 1 }, 0)
    .to('.blob', { opacity: 0.55, scale: 1.15, duration: 1.4, stagger: 0.2 }, 0)
    .to('.b1', { x: 260, y: 120, duration: 8, ease: 'sine.inOut' }, 0)
    .to('.b2', { x: -240, y: -100, duration: 8, ease: 'sine.inOut' }, 0);

  // Intro
  tl.fromTo('.eyebrow', { y: 30 }, { y: 0, opacity: 1, duration: 0.6 }, 0.3)
    .fromTo('#title span', { y: 160, rotate: 12, opacity: 0 },
      { y: 0, rotate: 0, opacity: 1, duration: 0.8, stagger: 0.09, ease: 'back.out(1.8)' }, 0.5)
    .to('.line', { width: 640, duration: 0.8, ease: 'power2.inOut' }, 1.1)
    .fromTo('.sub', { y: 20 }, { y: 0, opacity: 1, duration: 0.6 }, 1.5)
    .to('#intro', { opacity: 0, y: -60, scale: 0.95, duration: 0.6, ease: 'power2.in' }, 3.0);

  // Stats with counters
  tl.fromTo('.stat', { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, stagger: 0.15 }, 3.5);
  document.querySelectorAll('.stat .n').forEach((el, i) => {
    const obj = { v: 0 };
    tl.to(obj, { v: +el.dataset.to, duration: 1.4, ease: 'power2.out',
      onUpdate: () => { el.textContent = Math.round(obj.v); } }, 3.6 + i * 0.15);
  });
  tl.to('.stat', { opacity: 0, y: -60, duration: 0.5, stagger: 0.08, ease: 'power2.in' }, 5.6);

  // Outro
  tl.to('.logo', { scale: 1, rotate: 360, duration: 0.9, ease: 'back.out(1.6)' }, 6.2)
    .fromTo('.txt', { x: -40 }, { x: 0, opacity: 1, duration: 0.6 }, 6.6)
    .to({}, { duration: 1.2 }); // hold on last frame

  window.tl = tl;
  window.ready = document.fonts.ready.then(() => true);
</script>
</body>
</html>
