<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision — Droit du travail (M2 MRH)</title>
<style>
:root{
  --bg:#f5f1e8; --paper:#fffdf8; --ink:#1c2333; --mute:#667085; --line:#e2dccd;
  --accent:#1f4e79; --accent-soft:#e3edf6; --hl:#ffe98a; --hl-soft:#fff6cf;
  --ok:#1f7a4d; --ok-soft:#e1f3e8; --ko:#b3372f; --ko-soft:#fbe6e3; --warn:#9a6700; --warn-soft:#fdf0d0;
  --hc:#5b4b8a; --hc-soft:#eeeaf7; --shadow:0 1px 2px rgba(28,35,51,.06),0 6px 20px rgba(28,35,51,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme=dark]{
  --bg:#12161f; --paper:#1a202c; --ink:#e8eaf0; --mute:#98a2b3; --line:#2c3445;
  --accent:#8ab8e6; --accent-soft:#1f2c3f; --hl:#e6c94a; --hl-soft:#3a3418;
  --ok:#6fd09a; --ok-soft:#173224; --ko:#f08b82; --ko-soft:#3a1d1b; --warn:#e3b341; --warn-soft:#3a2f12;
  --hc:#b7a6ea; --hc-soft:#272240; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans)}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .5em;font-weight:700;text-wrap:balance}
h1{font-size:clamp(1.7rem,4vw,2.4rem)} h2{font-size:1.4rem} h3{font-size:1.1rem}
p{margin:.5em 0} ul,ol{margin:.5em 0;padding-left:1.3em} li{margin:.25em 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:.75rem;padding:.5rem 1rem}
.brand{font-family:var(--serif);font-weight:700;white-space:nowrap;background:none;border:0;padding:0;font-size:1.05rem}
.brand span{background:linear-gradient(transparent 55%,var(--hl) 55%)}
nav{display:flex;gap:.15rem;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;padding:.45rem .7rem;border-radius:8px;white-space:nowrap;color:var(--mute);font-size:.93rem}
nav button:hover{color:var(--ink);background:var(--bg)}
nav button.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;flex:none}
main{max-width:980px;margin:0 auto;padding:1.5rem 1rem 5rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.3rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.lead{color:var(--mute);max-width:62ch}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.stat b{display:block;font-family:var(--serif);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:.55rem .95rem;font-weight:600;font-size:.95rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme=dark] .btn.pri{color:#0f1722}
.btn.sm{padding:.3rem .6rem;font-size:.82rem;font-weight:500}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.ko{background:var(--ko-soft);border-color:var(--ko);color:var(--ko)}
.btn.mid{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.sp{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0 1rem}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:.3rem .75rem;font-size:.86rem}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;border-radius:6px;padding:.1rem .45rem;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.ex{background:var(--hl-soft);color:var(--warn)}
.tag.hcb{background:var(--hc-soft);color:var(--hc)}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;min-width:80px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.memo,.piege,.hc{border-radius:10px;padding:.6rem .8rem .6rem 2.4rem;margin:.8rem 0;position:relative;font-size:.95rem}
.memo::before,.piege::before,.hc::before{position:absolute;left:.7rem;top:.55rem}
.memo{background:var(--hl-soft)} .memo::before{content:"💡"}
.piege{background:var(--ko-soft)} .piege::before{content:"⚠️"}
.hc{background:var(--hc-soft)} .hc::before{content:"＋"; color:var(--hc);font-weight:700}
table{border-collapse:collapse;width:100%;margin:.7rem 0;font-size:.93rem}
th,td{border:1px solid var(--line);padding:.4rem .55rem;text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:600}
.tw{overflow-x:auto}
details{border-top:1px solid var(--line)} details:first-of-type{border-top:0}
summary{cursor:pointer;padding:.8rem 0;font-family:var(--serif);font-weight:700;font-size:1.08rem;list-style:none;display:flex;justify-content:space-between;gap:1rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--mute);font-family:var(--sans);font-weight:400}
details[open] summary::after{content:"–"}
details>div{padding-bottom:1rem}
.side{display:grid;grid-template-columns:230px 1fr;gap:1.2rem;align-items:start}
.menu{position:sticky;top:64px;display:flex;flex-direction:column;gap:.2rem}
.menu button{text-align:left;background:none;border:0;border-radius:8px;padding:.45rem .6rem;font-size:.92rem;display:flex;gap:.5rem;align-items:center}
.menu button:hover{background:var(--paper)}
.menu button.on{background:var(--paper);box-shadow:var(--shadow);font-weight:600}
.menu small{margin-left:auto;color:var(--mute);font-variant-numeric:tabular-nums}
@media(max-width:760px){.side{grid-template-columns:1fr}.menu{position:static;flex-direction:row;overflow-x:auto;padding-bottom:.3rem}.menu button{white-space:nowrap;border:1px solid var(--line);background:var(--paper)}.menu small{margin-left:.3rem}}
.fc{min-height:300px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:2rem 1.5rem}
.fc .q{font-family:var(--serif);font-size:clamp(1.2rem,3vw,1.55rem);line-height:1.35;text-wrap:balance}
.fc .a{margin-top:1.3rem;padding-top:1.3rem;border-top:1px dashed var(--line);font-size:1.05rem;text-align:left;max-width:60ch;margin-inline:auto;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.boxes{display:flex;gap:.4rem;margin:.8rem 0}
.boxes div{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:.4rem .2rem;font-size:.75rem;color:var(--mute);background:var(--paper)}
.boxes b{display:block;font-size:1.1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:.7rem .9rem;margin:.5rem 0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--ko-soft);border-color:var(--ko)}
.opt:disabled{cursor:default;color:inherit}
.expl{background:var(--accent-soft);border-radius:10px;padding:.7rem .9rem;margin-top:.8rem;animation:in .25s}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;font:inherit;font-size:.95rem;background:var(--bg);color:var(--ink);resize:vertical}
.step{border-left:3px solid var(--accent);padding:.1rem 0 .1rem .9rem;margin:.9rem 0}
.step.new{animation:in .25s}
.trow{flex-wrap:wrap}
@media(max-width:640px){.trow>div:first-child{flex:1 1 100%!important}}
.step h4{margin:0 0 .2rem;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.step.c{border-color:var(--ok)} .step.c h4{color:var(--ok)}
.qn{font-family:var(--serif);font-weight:700;color:var(--accent);margin-right:.4rem}
.cloze{border:0;border-bottom:2px dotted var(--mute);background:var(--hl-soft);border-radius:4px 4px 0 0;padding:0 .5rem;min-width:70px;font-weight:700;color:transparent;user-select:none}
.cloze.on{color:var(--ink);background:none;border-bottom-color:transparent}
.nrow{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
kbd{font:600 .75rem var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .35rem;background:var(--bg)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.l1{background:var(--ko)} .dot.l2{background:var(--warn)} .dot.l3{background:var(--ok)}
.mt{margin-top:1rem} .mt2{margin-top:1.8rem} .mute{color:var(--mute)} .small{font-size:.87rem}
.syl{counter-reset:s;list-style:none;padding:0}
.syl li{counter-increment:s;position:relative;padding:.6rem 0 .6rem 2.8rem;border-top:1px solid var(--line)}
.syl li:first-child{border-top:0}
.syl li::before{content:counter(s);position:absolute;left:0;top:.6rem;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--paper);display:grid;place-items:center;font-weight:700;font-family:var(--serif)}
</style>
</head>
<body>
<header><div class="bar">
  <button class="brand" data-a="go" data-v="home"><span>Droit du travail</span></button>
  <nav id="nav"></nav>
  <button class="iconbtn" data-a="dark" title="Mode clair / sombre" aria-label="Mode clair ou sombre">◐</button>
</div></header>
<main id="main"></main>
<script>
/* ===== FICHES DE COURS ===== */
const THEMES = [
{n:1, t:'Négociation collective', ic:'🤝', exam:0, s:[
['Syndicats et représentativité', `
<p><b>Liberté syndicale</b> (L2141-1) : fonder un syndicat, adhérer ou non, choisir son syndicat. Objet : étude et défense des droits et intérêts matériels et moraux, collectifs et individuels (L2131-1). Statuts déposés en mairie → personnalité morale.</p>
<p><b>7 critères de représentativité des syndicats de salariés</b> (L2121-1) :</p>
<ul><li>Respect des <b>v</b>aleurs républicaines</li><li><b>I</b>ndépendance</li><li><b>T</b>ransparence financière</li><li><b>A</b>ncienneté de 2 ans dans le champ de la négociation</li><li><b>A</b>udience : <b>10 %</b> dans l'entreprise, <b>8 %</b> dans la branche et au niveau national (1er tour des élections CSE)</li><li><b>I</b>nfluence (activité, expérience)</li><li><b>E</b>ffectifs d'adhérents et cotisations</li></ul>
<div class="memo">Moyen mnémo : <b>VITA-AIE</b> — Valeurs, Indépendance, Transparence, Ancienneté, Audience, Influence, Effectifs.</div>
<p>Organisations patronales : <b>6 critères</b> (L2151-1), les mêmes sans « effectifs ». Audience : 8 % des entreprises adhérentes <i>ou</i> entreprises employant 8 % des salariés.</p>
<p>Représentativité nationale 2025-2029 : CFDT 30 %, CGT 25 %, FO 17 %, CFE-CGC 15 %, CFTC 11 %.</p>`],
['Présence syndicale dans l\'entreprise', `
<table><tr><th></th><th>Délégué syndical (DS)</th><th>Représentant de section (RSS)</th></tr>
<tr><td>Désigné par</td><td>Syndicat <b>représentatif</b></td><td>Syndicat <b>non représentatif</b></td></tr>
<tr><td>Seuil</td><td>Entreprise de plus de 50 salariés</td><td>Plus de 50 salariés</td></tr>
<tr><td>Conditions</td><td>18 ans, 1 an dans l'entreprise, <b>10 % des suffrages à titre personnel</b> sur une liste à 10 %</td><td>—</td></tr>
<tr><td>Pouvoirs</td><td>Revendique <b>et négocie / signe</b></td><td>Participe aux négociations mais <b>ne peut pas conclure</b></td></tr>
<tr><td>Heures</td><td>—</td><td>4 h / mois</td></tr></table>
<p>Contestation d'une désignation de DS : <b>tribunal judiciaire, 15 jours</b> à compter de la notification.</p>
<p><b>Section syndicale</b> : tableau d'affichage, tracts, réunion 1 fois/mois, local commun (plus de 200 salariés) ou propre (plus de 1 000), crédit de 10 h/an au-delà de 500 salariés.</p>`],
['Validité des accords', `
<ul><li><b>Interpro et branche</b> : signature par des organisations pesant <b>30 %</b>, sans opposition d'organisations pesant <b>50 %</b>.</li>
<li><b>Entreprise</b> (L2232-12) : signature par des syndicats pesant <b>50 %</b> des suffrages ; ou <b>30 % + référendum</b> des salariés (majorité des suffrages exprimés).</li></ul>
<p><b>Sans délégué syndical :</b></p>
<ul><li><b>Moins de 11 salariés</b> : projet de l'employeur, communiqué 15 jours avant, ratifié à la <b>majorité des 2/3</b> du personnel.</li>
<li><b>11 à 50</b> : sans élus → même règle des 2/3 ; avec élus → salariés mandatés (+ référendum) ou élus du CSE représentant la majorité des suffrages.</li>
<li><b>Plus de 50</b> : élus mandatés (+ référendum) ; à défaut élus non mandatés (seulement sur les mesures que la loi subordonne à un accord) ; à défaut salariés mandatés (+ référendum).</li></ul>
<p><b>Forme</b> : préambule, clauses de suivi et de rendez-vous, dépôt à la DREETS, entrée en vigueur <b>le lendemain du dépôt</b>. Publication en ligne sans le nom des signataires — sauf épargne salariale, PSE et APC (non publiés).</p>
<div class="piege">Piège vu en cours (cas 1) : ce qui compte, c'est que tous les syndicats représentatifs soient <b>convoqués</b>, pas qu'ils soient présents. Un syndicat créé en 2025 n'a pas les 2 ans d'ancienneté.</div>`],
['Négociation obligatoire', `
<p>Obligation de <b>négocier</b>, jamais de conclure.</p>
<ul><li><b>Branche</b> : au moins tous les <b>4 ans</b> (salaires, égalité F/H, conditions de travail et GPEC, handicap, formation…) et tous les <b>5 ans</b> (classifications, épargne). À défaut d'accord de méthode : salaires <b>chaque année</b>, autres thèmes tous les <b>3 ans</b>, classifications tous les <b>5 ans</b>.</li>
<li><b>Entreprise de plus de 50 salariés avec DS</b> : au moins tous les 4 ans → ① rémunération, temps de travail, partage de la valeur ajoutée ; ② égalité professionnelle et QVT ; ③ GEPP si au moins 300 salariés. À défaut d'accord de méthode : ① et ② <b>annuelles</b>, ③ <b>tous les 3 ans</b>.</li></ul>`],
['Hiérarchie des normes : 13 + 4 + le reste', `
<ul><li><b>Bloc 1 — la branche s'impose (13 matières)</b>, sauf garanties au moins équivalentes : salaires minima hiérarchiques, classifications, fonds du paritarisme et de la formation, prévoyance, certaines règles de durée du travail, CDD et intérim, CDI de chantier, égalité F/H, renouvellement de la période d'essai, transfert conventionnel des contrats, portage salarial…</li>
<li><b>Bloc 2 — la branche s'impose si elle le dit expressément (4 matières)</b> : prévention des risques professionnels, travailleurs handicapés, seuil et nombre de DS, primes pour travaux dangereux ou insalubres.</li>
<li><b>Bloc 3 — tout le reste : l'accord d'entreprise prime</b>, même moins favorable, qu'il soit antérieur ou postérieur (primes, préavis, indemnités de rupture, durée de la période d'essai…). Sans accord d'entreprise, la branche s'applique.</li></ul>
<p><b>Accord collectif et contrat</b> : le contrat ne peut pas être moins favorable que l'accord ; s'il est plus favorable, on applique le contrat. La perte d'un avantage collectif n'est pas une modification du contrat.</p>`],
['Durée, révision, dénonciation', `
<ul><li>Durée : <b>5 ans</b> sauf stipulation contraire.</li>
<li>Révision : l'avenant se substitue de plein droit à l'accord initial.</li>
<li>Dénonciation (accords à durée indéterminée) : par la totalité des signataires d'une partie → <b>préavis de 3 mois</b> puis <b>survie de 12 mois</b>. Sans accord de substitution : garantie de la <b>rémunération moyenne des 12 derniers mois</b>.</li></ul>
<div class="memo">« 3 + 12 » : trois mois de préavis, douze mois de survie.</div>
<div class="piege">Cas 3 du cours : une <b>entreprise ne peut pas dénoncer une convention de branche</b> — seules les organisations signataires le peuvent. La dénonciation n'a pas à être motivée. Un accord à durée déterminée ne se dénonce pas (il se révise).</div>
<p><b>Extension</b> : arrêté du ministre du Travail → l'accord de branche s'applique à toutes les entreprises du champ, adhérentes ou non. <b>Élargissement</b> : application à une autre branche. Une entreprise applique une seule convention : celle de son <b>activité principale</b>.</p>`]
]},
{n:2, t:'Conditions d\'emploi', ic:'📄', exam:1, s:[
['Contrats particuliers', `
<ul><li><b>CDD à objet défini</b> : ingénieurs et cadres uniquement ; <b>18 à 36 mois</b> ; délai de prévenance 2 mois ; prime de précarité due.</li>
<li><b>Contrat de chantier ou d'opération</b> : doit être prévu par la convention de branche ; c'est un CDI qui prend fin avec le chantier → licenciement pour motif personnel avec cause réelle et sérieuse, préavis et indemnité.</li></ul>`],
['Télétravail', `
<p>Mise en place : <b>accord collectif</b>, ou <b>charte</b> de l'employeur soumise au CSE, ou <b>accord individuel</b> formalisé par tout moyen.</p>
<p>L'accord du salarié est obligatoire, <b>sauf circonstances exceptionnelles</b> (maintien de l'activité, protection des salariés). L'employeur reste tenu de l'obligation de sécurité ; la législation sur les accidents du travail s'applique. Entretien annuel sur la charge de travail.</p>
<div class="piege">Imposer le télétravail ou le travail à domicile = <b>modification du contrat</b>. Y mettre fin aussi : le salarié peut refuser.</div>`],
['Jeunes, travailleurs handicapés', `
<ul><li><b>Jeunes</b> : interdiction avant 16 ans ; 7 h/jour et 35 h/semaine ; travaux dangereux interdits.</li>
<li><b>Handicap</b> (L5213-1) : obligation d'emploi (OETH), référent handicap, suivi médical spécifique. Licenciement : préavis <b>doublé dans la limite de 3 mois</b> ; handicap pris en compte dans l'ordre des licenciements économiques. Refuser les <b>aménagements raisonnables</b> demandés par le médecin du travail = discrimination (Soc. 2 avril 2025).</li></ul>`],
['Seniors — sujet du cas VIII', `
<ul><li>Négociation tous les <b>3 ans</b> sur « l'emploi et le travail des salariés expérimentés » (loi du 24 octobre 2025).</li>
<li>Visite médicale de mi-carrière à <b>45 ans</b> + entretien dans les 2 mois ; entretien de fin de carrière entre <b>58 et 60 ans</b>.</li>
<li><b>Contrat de valorisation de l'expérience (CDI senior)</b>, temps partiel de fin de carrière, retraite progressive.</li></ul>
<div class="hc">Complément utile pour le cas VIII : l'employeur ne peut mettre un salarié à la retraite d'office qu'à <b>70 ans</b> (avant, le salarié peut refuser chaque année). Le contrat de valorisation de l'expérience permet justement la mise à la retraite dès le taux plein. L'âge est un motif de discrimination : refuser d'embaucher ou de former à cause de l'âge est interdit.</div>`]
]},
{n:3, t:'Obligations des parties', ic:'⚖️', exam:1, s:[
['Obligations du salarié', `
<ol><li>Exécution personnelle du travail</li><li>Respect des directives</li><li>Discrétion</li><li><b>Fidélité et loyauté</b> — subsistent pendant la suspension du contrat (maladie)</li><li>Le travail fourni appartient à l'entreprise (utiliser les données à des fins personnelles = vol, détournement)</li><li>Comportement, tenue</li><li>Expression</li></ol>
<p><b>Tenue</b> : la liberté de se vêtir à sa guise au travail <b>n'est pas une liberté fondamentale</b>. L'employeur peut imposer une tenue répondant à une <b>exigence légitime</b>. Le refus de porter les EPI est une faute.</p>
<div class="hc">Cadre général : L1121-1 — toute restriction aux libertés doit être <b>justifiée par la nature de la tâche et proportionnée au but recherché</b>.</div>`],
['Liberté d\'expression', `
<p>Le salarié s'exprime librement <b>dans et hors de l'entreprise</b> (L1121-1 ; art. 10 CEDH). Le licenciement fondé sur l'exercice de cette liberté est <b>nul</b> (Soc. 16 février 2022).</p>
<ul><li><b>Avant 2026</b> : liberté « sauf abus » — propos injurieux, diffamatoires ou excessifs (faute grave selon le cours).</li>
<li><b>Depuis 2026</b> : abandon du critère de l'abus. Le juge <b>met en balance</b> la liberté du salarié et les intérêts de l'employeur, et vérifie que la sanction est <b>nécessaire, adéquate et proportionnée</b>.</li></ul>
<p>Quatre critères à passer en revue dans la copie :</p>
<ol><li>la <b>teneur</b> des propos</li><li>le <b>contexte</b></li><li>leur <b>portée et impact</b> dans l'entreprise</li><li>les <b>conséquences négatives</b> pour l'employeur</li></ol>
<div class="memo">« TCPC » : Teneur, Contexte, Portée, Conséquences.</div>`],
['Lanceur d\'alerte', `
<p>L1132-3-3 : aucune sanction ni discrimination contre celui qui relate ou témoigne <b>de bonne foi</b> de faits constitutifs d'un <b>délit ou d'un crime</b> dont il a eu connaissance dans ses fonctions, ou qui signale une alerte selon la loi du 9 décembre 2016 (Sapin 2).</p>
<p>Trois conditions : être légitimement informé, viser un crime ou un délit, être de bonne foi. Les entreprises de plus de 50 salariés doivent avoir une procédure de recueil des signalements.</p>
<div class="piege">Un simple <b>désaccord</b> avec une décision de gestion (ex. : le costume obligatoire) n'est pas une alerte.</div>`],
['Responsabilité du salarié', `
<ul><li><b>Civile envers l'employeur</b> : seulement en cas de <b>faute lourde</b> (sauf restitution des sommes ou biens détournés).</li>
<li><b>Dommage à un tiers</b> : c'est l'employeur qui répond (commettant), sauf infraction pénale intentionnelle ou dépassement des limites de la mission.</li>
<li><b>Pénale</b> : toujours personnelle.</li></ul>`],
['Obligations de l\'employeur', `
<ol><li>Fournir le travail et les moyens</li><li>Verser le salaire</li><li>Exécuter le contrat de <b>bonne foi</b> (loyauté dans la surveillance)</li><li><b>Sécurité</b> (L4121-1) : protéger la santé physique et mentale ; DUERP ; passeport de prévention. Conscience du risque + mesures insuffisantes = faute inexcusable</li><li>Former : adapter le salarié à l'évolution de son emploi</li><li>Entretiens : entretien professionnel, charge de travail (forfait jours, télétravail), mandats</li></ol>`],
['Surveillance et preuve — très utile pour les cas', `
<table><tr><th>Moyen</th><th>Règle</th></tr>
<tr><td>Vidéosurveillance</td><td>Libre dans les lieux où les salariés <b>n'ont pas accès</b> ; ailleurs, information des salariés et consultation du CSE</td></tr>
<tr><td>Fichiers, mails</td><td><b>Présumés professionnels</b> sauf s'ils sont marqués « personnel »</td></tr>
<tr><td>SMS professionnels</td><td>Pas protégés par le secret des correspondances</td></tr>
<tr><td>Photos perso sur l'ordinateur pro</td><td>Pas une faute, sauf caractère pornographique</td></tr>
<tr><td>Géolocalisation</td><td>Matériels professionnels</td></tr>
<tr><td>LinkedIn</td><td>Caractère <b>public</b></td></tr>
<tr><td>Facebook</td><td>L'employeur ne peut ni consulter ni utiliser des échanges privés</td></tr></table>
<div class="hc">Complément : un casier ou une armoire individuelle ne s'ouvre qu'en <b>présence du salarié ou après l'avoir prévenu</b>. Depuis l'Assemblée plénière du 22 décembre 2023, une preuve illicite ou déloyale n'est plus écartée d'office : le juge l'admet si elle est <b>indispensable</b> au droit à la preuve et l'atteinte <b>proportionnée</b>. Ce n'est pas une raison pour conseiller un procédé clandestin.</div>`]
]},
{n:4, t:'Discriminations', ic:'🚫', exam:1, s:[
['Motifs interdits', `
<p>Origine, sexe, mœurs, orientation sexuelle, identité de genre, <b>âge</b>, situation de famille, <b>grossesse</b>, caractéristiques génétiques, situation économique, ethnie/nation/prétendue race, opinions politiques, activités syndicales, <b>convictions religieuses</b>, <b>apparence physique</b>, nom, lieu de résidence, domiciliation bancaire, <b>état de santé</b>, handicap, perte d'autonomie, capacité à s'exprimer en français.</p>
<p>Protection aussi pour : exercice normal du droit de grève, fonctions de juré, droit d'alerte, témoignage d'agissements discriminatoires, maternité. Elle joue à <b>toutes les étapes</b> : embauche, rémunération, formation, mutation, sanction, rupture.</p>`],
['Limites admises', `
<ul><li>L1133-1 : différence de traitement justifiée par une <b>exigence professionnelle essentielle et déterminante</b>, avec objectif légitime et exigence proportionnée.</li>
<li>L1321-2-1 : le <b>règlement intérieur</b> peut inscrire un principe de <b>neutralité</b> si c'est justifié par d'autres libertés ou par le bon fonctionnement de l'entreprise, et proportionné.</li>
<li>Service public : laïcité et neutralité obligatoires. Secteur privé : il faut passer par le règlement intérieur.</li></ul>`],
['Preuve en trois temps', `
<ol><li>Le salarié <b>présente des éléments de fait laissant supposer</b> une discrimination.</li><li>L'employeur <b>prouve que sa décision repose sur des éléments objectifs</b> étrangers à toute discrimination.</li><li>Le <b>juge</b> forme sa conviction, au besoin après mesures d'instruction.</li></ol>
<div class="memo">Même mécanique pour le harcèlement et pour l'égalité de traitement : le salarié n'a jamais à <i>prouver</i>, seulement à <i>laisser supposer</i>.</div>
<p>Juridictions : conseil de prud'hommes, tribunal judiciaire, tribunal correctionnel. Sanction civile : <b>nullité</b> de la mesure.</p>`]
]},
{n:5, t:'Harcèlement & RPS', ic:'🛑', exam:1, s:[
['Harcèlement moral', `
<p>L1152-1 : <b>agissements répétés</b> ayant pour <b>objet ou pour effet</b> une dégradation des conditions de travail susceptible de porter atteinte aux droits et à la dignité, d'altérer la santé physique ou mentale, ou de compromettre l'avenir professionnel.</p>
<p><b>Harcèlement managérial</b> : il peut venir de méthodes de gestion abusives et répétées (France Télécom), sans conflit personnel.</p>`],
['Harcèlement sexuel', `
<p>L1153-1 :</p>
<ul><li><b>1°</b> propos ou comportements à connotation <b>sexuelle ou sexiste</b>, <b>répétés</b>, qui portent atteinte à la dignité (dégradants, humiliants) <b>ou</b> créent une situation intimidante, hostile ou offensante.</li>
<li>La répétition peut venir de <b>plusieurs personnes</b> : de manière concertée, ou successivement en sachant qu'il y a répétition — même si chacune n'agit qu'une fois.</li>
<li><b>2°</b> assimilé : toute <b>pression grave, même non répétée</b>, pour obtenir un acte de nature sexuelle.</li></ul>
<p><b>Outrage sexiste</b> : propos ou comportement sexuel ou sexiste imposé, hors cas de harcèlement.</p>
<div class="memo">Plaisanteries graveleuses quotidiennes de toute une équipe à la pause-café = le cas « plusieurs personnes ». Pas besoin que chacun ait recommencé.</div>`],
['Ce que doit faire l\'employeur', `
<p>Obligation de sécurité : <b>prévenir</b> et <b>réagir immédiatement</b> dès qu'il est informé.</p>
<ol><li>Recevoir et écouter la personne, tracer par écrit.</li><li>Mesures conservatoires (éloigner, protéger).</li><li><b>Enquête interne</b> sérieuse et impartiale.</li><li>Sanction si les faits sont établis.</li></ol>
<div class="piege">Mauvais réflexe typique de l'énoncé : « qu'elle porte plainte, on verra après l'enquête pénale ». L'employeur ne peut pas attendre : son inaction est une faute.</div>
<p><b>Dénonciation</b> : aucun salarié ne peut être sanctionné pour avoir dénoncé ou témoigné → licenciement <b>nul</b>. Seule limite : la <b>mauvaise foi</b>, c'est-à-dire l'accusation mensongère.</p>
<div class="hc">Précision : la mauvaise foi suppose que le salarié <b>savait</b> que les faits étaient faux. Des faits simplement non établis ne suffisent pas.</div>
<p><b>Preuve</b> : éléments précis et concordants laissant supposer le harcèlement → l'employeur justifie par des éléments objectifs → le juge tranche.</p>
<p><b>Rupture</b> : le licenciement pour inaptitude est nul si l'inaptitude découle du harcèlement ; même effet pour la résiliation judiciaire.</p>`],
['Risques psychosociaux', `
<p>RPS : stress, violences internes et externes, mal-être, harcèlement, addictions. Stress (ANI) : déséquilibre entre les contraintes perçues et les ressources perçues pour y faire face.</p>
<p>Employeur : évaluer les risques (DUERP), agir, plan d'action. Salarié : respecter les consignes, signaler tout danger grave et imminent, <b>droit de retrait</b>. Autres acteurs : CSE, médecin du travail, inspection du travail, CARSAT, INRS.</p>`]
]},
{n:6, t:'Suspension du contrat', ic:'🩺', exam:1, s:[
['Qualifier l\'arrêt', `
<ul><li><b>Accident du travail (AT)</b> : lésion corporelle ou psychologique sur les lieux ou à l'occasion du travail.</li>
<li><b>Maladie professionnelle (MP)</b> : tableaux de la Sécurité sociale.</li>
<li><b>Salarié en mission</b> : protégé pendant toute la mission, actes de la vie courante compris, sauf interruption pour motif personnel (Soc. 19 juillet 2001).</li>
<li><b>Accident de trajet</b> : domicile ↔ travail, travail ↔ lieu habituel des repas ; détour admis pour covoiturage régulier.</li></ul>
<div class="memo">Premier réflexe dans un cas : <b>professionnel ou non ?</b> Toutes les règles en dépendent (licenciement, indemnisation, congés, visite de reprise).</div>`],
['Pendant l\'arrêt', `
<table><tr><th></th><th>AT / MP</th><th>Maladie non professionnelle</th></tr>
<tr><td>Licenciement</td><td><b>Interdit</b> jusqu'à la fin de l'arrêt</td><td>Interdit <b>en raison de la maladie</b></td></tr>
<tr><td>Sécurité sociale</td><td>60 % du brut pendant 30 jours puis 80 % (plafond 1,8 SMIC au 1er nov. 2026)</td><td>50 % à partir du <b>4e jour</b>, 360 jours max, plafond 1,4 SMIC</td></tr>
<tr><td>Complément employeur</td><td>—</td><td>Si <b>1 an d'ancienneté</b> et absence <b>justifiée dans les 48 h</b></td></tr>
<tr><td>Congés acquis</td><td>Comme du temps de travail</td><td><b>2 jours ouvrables/mois</b>, 24 jours/an max</td></tr></table>
<div class="hc">Compléments : pendant un arrêt AT/MP, le licenciement n'est possible que pour <b>faute grave</b> ou <b>impossibilité de maintenir le contrat pour un motif étranger</b> à l'accident — sinon il est <b>nul</b>. En maladie ordinaire, la jurisprudence admet le licenciement lorsque l'absence prolongée <b>perturbe le fonctionnement de l'entreprise et impose un remplacement définitif</b> (embauche en CDI). L'employeur peut faire pratiquer une <b>contre-visite médicale</b>, contrepartie du complément de salaire.</div>
<p><b>Congés au retour</b> : l'employeur <b>informe</b> le salarié du nombre de jours acquis et du délai de <b>15 mois</b> pour les poser, sous peine de perte.</p>
<div class="piege">Le contrat est suspendu : on ne fait <b>jamais travailler</b> un salarié en arrêt, même « un peu, chez lui, à son rythme ». Mais l'obligation de <b>loyauté</b> demeure (restituer un mot de passe, par exemple).</div>`],
['Fin de l\'arrêt et inaptitude', `
<p><b>Visite de reprise</b> auprès du médecin du travail si l'arrêt a duré au moins <b>30 jours (AT/MP)</b> ou <b>60 jours (autres cas)</b>. Pas de visite de reprise s'il y a eu une visite de préreprise dans les 30 jours précédents sans réserve.</p>
<p><b>Inaptitude</b> :</p>
<ol><li><b>Seul le médecin du travail</b> la prononce.</li><li>L'employeur a une <b>obligation de reclassement</b> — obligation de moyens, à tracer par écrit.</li><li>Délai d'<b>1 mois</b> à compter de l'avis pour reclasser ou licencier ; au-delà, <b>reprise du paiement du salaire</b>.</li><li>Absence de recherche de reclassement ou licenciement d'un salarié apte → sanction prud'homale.</li></ol>
<div class="hc">Compléments : consultation du <b>CSE</b> sur les propositions de reclassement ; l'obligation est <b>réputée satisfaite</b> si l'employeur a proposé un emploi conforme aux préconisations du médecin ; dispense de reclassement si l'avis mentionne que tout maintien dans un emploi serait gravement préjudiciable à la santé ou que l'état de santé fait obstacle à tout reclassement. Inaptitude d'origine professionnelle : indemnité spéciale de licenciement <b>doublée</b>.</div>`],
['Faciliter la reprise', `
<ul><li><b>Mi-temps thérapeutique</b> : proposé par le <b>médecin traitant</b>, l'employeur doit l'accepter (selon le cours), avis du médecin-conseil de la CPAM. Indemnités journalières + travail aménagé.</li>
<li><b>Rendez-vous de liaison</b> : arrêt de plus de <b>30 jours</b> ; salarié, employeur, service de santé au travail, référent handicap. Sert à informer sur la préreprise et les mesures d'aménagement. Pas de sanction prévue s'il n'est pas proposé, mais c'est un risque.</li>
<li><b>Visite de préreprise</b> : à la demande du salarié, directement auprès de la médecine du travail, sans informer l'employeur.</li>
<li><b>Essai encadré</b> : <b>14 jours ouvrables renouvelables une fois</b>, avec un tuteur.</li>
<li><b>CRPE</b> (convention de rééducation professionnelle en entreprise) : salariés inaptes ou à risque d'inaptitude.</li></ul>`],
['Maternité', `
<ul><li><b>Protection relative</b> : pendant la grossesse (ou la PMA) et jusqu'à <b>10 semaines</b> après le congé. Licenciement possible uniquement pour <b>faute grave non liée à la grossesse</b> ou <b>impossibilité de maintenir le contrat pour un motif étranger</b>.</li>
<li><b>Protection absolue</b> : aucune notification pendant le congé maternité et les congés payés qui le suivent.</li>
<li>Pas de protection si l'employeur <b>n'est pas informé</b>. La salariée n'est pas obligée de révéler sa grossesse.</li>
<li>Licenciement <b>nul</b> : réintégration, salaires, dommages-intérêts d'au moins <b>6 mois</b>.</li></ul>
<div class="hc">Complément : si le licenciement est notifié alors que l'employeur ignorait la grossesse, la salariée a <b>15 jours</b> pour envoyer un certificat médical et le faire annuler (sauf faute grave ou impossibilité de maintien).</div>
<p><b>Santé</b> : examens médicaux = temps de travail effectif ; <b>affectation temporaire sur un autre poste</b> si l'état de santé l'exige ; interdiction d'emploi 8 semaines dont 6 après l'accouchement.</p>
<p><b>Durée du congé</b> : 6 + 10 semaines ; 8 + 18 au 3e enfant ; 12 + 22 pour des jumeaux ; 24 + 22 pour des triplés. Au retour : visite médicale dans les 8 jours, même poste, augmentations rattrapées.</p>
<p><b>Père</b> : protection de 10 semaines après la naissance ; congé de naissance 3 jours (employeur) ; paternité <b>4 jours obligatoires + 21 jours</b> à prendre dans les 6 mois (Sécurité sociale). Congé supplémentaire de naissance : 1 ou 2 mois, 70 % puis 60 % du net.</p>`],
['Autres congés', `
<table><tr><td>Mariage / PACS</td><td>4 j</td><td>Mariage d'un enfant</td><td>1 j</td></tr>
<tr><td>Naissance / adoption</td><td>3 j</td><td>Décès d'un enfant</td><td>12 à 14 j</td></tr>
<tr><td>Décès conjoint / proche</td><td>3 j</td><td>Survenue d'un handicap</td><td>2 j</td></tr>
<tr><td>Enfant malade</td><td>3 j non payés</td><td>Présence parentale</td><td>310 j sur 3 ans</td></tr>
<tr><td>Congé parental</td><td>1 an renouvelable</td><td>Solidarité familiale</td><td>3 mois</td></tr>
<tr><td>Création d'entreprise</td><td>12 mois max</td><td>Sabbatique</td><td>11 mois max</td></tr></table>`]
]},
{n:7, t:'Modification du contrat', ic:'✏️', exam:1, s:[
['La distinction qui fait tout', `
<table><tr><th></th><th>Modification du contrat</th><th>Changement des conditions de travail</th></tr>
<tr><td>Porte sur</td><td>Un <b>élément essentiel</b></td><td>L'organisation, dans le cadre du pouvoir de direction</td></tr>
<tr><td>Accord du salarié</td><td><b>Obligatoire</b></td><td>Non</td></tr>
<tr><td>Refus</td><td><b>N'est pas une faute</b></td><td>Faute</td></tr></table>
<p><b>Sont des modifications du contrat</b> (jurisprudence) :</p>
<ul><li>la <b>rémunération</b> ou son mode de calcul</li><li>la <b>qualification</b>, le niveau de responsabilité</li><li>la <b>durée du travail</b></li><li>imposer le travail à domicile ou le <b>télétravail</b></li><li>le détachement, la mutation dans une autre société du groupe (Soc. 5 mai 2004)</li><li>le lieu de travail, <b>s'il y a changement de secteur géographique</b> (Soc. 4 juillet 2012)</li></ul>
<div class="memo">Les 4 piliers du contrat : <b>R</b>émunération, <b>Q</b>ualification, <b>D</b>urée, <b>L</b>ieu (secteur géographique).</div>
<div class="hc">Compléments : une <b>clause de mobilité</b> valable fait d'une mutation un simple changement des conditions de travail. Si l'employeur propose la modification pour un <b>motif économique</b> : lettre recommandée, <b>1 mois</b> de réflexion, le silence vaut acceptation ; le refus ouvre un licenciement économique. Face à un refus, l'employeur renonce <b>ou</b> licencie — le motif du licenciement est la raison de la modification, jamais le refus lui-même.</div>`],
['Accord de performance collective (APC)', `
<p>Accord d'entreprise conclu pour répondre aux nécessités de fonctionnement ou préserver ou développer l'emploi. Il peut aménager :</p>
<ul><li>la <b>durée du travail</b></li><li>la <b>rémunération</b> (dans le respect des minima)</li><li>la <b>mobilité</b> géographique ou professionnelle</li></ul>
<p>Ses stipulations <b>se substituent de plein droit</b> aux clauses contraires du contrat. Le salarié a <b>30 jours</b> pour refuser ; l'employeur a alors <b>60 jours</b> pour engager le licenciement.</p>
<div class="memo">APC = le seul cas où un accord collectif l'emporte sur un contrat plus favorable.</div>`]
]},
{n:8, t:'Restructurations', ic:'🏭', exam:1, s:[
['L1224-1 : le transfert des contrats', `
<p>« S'il survient une modification dans la situation juridique de l'employeur, notamment par succession, vente, <b>fusion</b>, transformation du fonds, mise en société, tous les contrats de travail en cours subsistent entre le nouvel employeur et le personnel. »</p>
<p><b>Condition clé</b> : transfert d'une <b>entité économique autonome</b> — ensemble organisé de personnes et de moyens (matériel, locaux, clientèle) poursuivant une activité — qui conserve son identité.</p>
<p><b>Effets</b> :</p>
<ul><li>Transfert <b>automatique</b> : ni l'accord du salarié ni un nouveau contrat ne sont nécessaires.</li><li>Contrat maintenu <b>en l'état</b> (ancienneté, salaire, qualification).</li><li><b>Pas de licenciement à l'occasion du transfert</b> (sauf motif personnel comme une faute grave) → sinon dommages-intérêts ou poursuite du contrat.</li><li>Ensuite, le repreneur peut restructurer dans un délai raisonnable (pas de délai légal).</li></ul>
<p>Si L1224-1 ne joue pas : transfert <b>conventionnel</b> (prévu par la convention de branche) ou <b>volontaire</b> — ce sont alors les conditions du repreneur qui s'appliquent.</p>`],
['Accords collectifs et représentants', `
<ul><li>Les accords de l'entreprise absorbée sont <b>mis en cause</b> (fusion, cession, scission, changement d'activité).</li>
<li>Les accords de l'<b>absorbante</b> bénéficient <b>immédiatement</b> aux salariés transférés.</li>
<li><b>Accord de transition</b> (3 ans max) : pour les seuls salariés de l'entité absorbée.</li>
<li><b>Accord d'adaptation</b> : pour l'ensemble du nouveau périmètre.</li>
<li>Ces deux accords peuvent être négociés <b>avant ou après</b> la fusion.</li></ul>
<div class="hc">Complément : la mise en cause suit le même calendrier que la dénonciation — préavis de 3 mois puis survie de 12 mois, puis garantie de rémunération.</div>
<p><b>IRP</b> (selon le cours) : les syndicats restent représentatifs, les DS et RSS restent en place, le CSE aussi.</p>
<div class="hc">Complément : le projet de fusion doit être soumis à la <b>consultation des CSE</b> des deux sociétés avant sa réalisation.</div>`]
]},
{n:9, t:'Égalité professionnelle', ic:'💶', exam:1, s:[
['« À travail égal, salaire égal »', `
<p>L3221-2 : égalité de rémunération femmes/hommes pour un même travail ou un travail de <b>valeur égale</b>. La jurisprudence l'étend à tous : des salariés <b>placés dans une situation identique</b> doivent être payés de la même façon. Rémunération = salaire de base <b>et tous les accessoires</b>.</p>
<p>L'employeur peut traiter différemment à condition de justifier de <b>critères objectifs, pertinents et matériellement vérifiables</b>. Sans justification, l'inégalité de traitement est retenue.</p>
<table><tr><th>Justification</th><th>Admise ?</th></tr>
<tr><td>Ancienneté, expérience</td><td>Oui, si éléments objectifs et vérifiables</td></tr>
<tr><td>Diplômes</td><td>Oui, mêmes conditions</td></tr>
<tr><td>Statut public / privé (La Poste)</td><td>Non, pas à lui seul (Soc. 9 nov. 2016)</td></tr>
<tr><td>Cadres / non-cadres</td><td>Oui si spécificité de situation (fonctions, carrière, rémunération)</td></tr>
<tr><td><b>Établissements différents</b> d'une même entreprise</td><td>Oui, si <b>raisons objectives</b></td></tr>
<tr><td><b>Entreprises différentes</b>, même groupe ou même convention</td><td>Pas de comparaison possible (Soc. 24 sept. 2008 ; 20 nov. 2012)</td></tr></table>
<div class="piege">« Le coût de la vie est <i>sans doute</i> différent » : une supposition n'est pas une justification objective. Il faut des éléments chiffrés.</div>
<div class="hc">Compléments : le salarié ne peut pas exiger de son employeur les bulletins de paie de ses collègues, mais le <b>juge peut en ordonner la communication</b> (noms et données personnelles occultés) si c'est indispensable à la preuve et proportionné (Soc. 8 mars 2023). L'ancienneté ne justifie pas un écart si elle est déjà payée par une prime d'ancienneté.</div>`],
['Égalité femmes / hommes', `
<ul><li><b>Index de l'égalité</b> : entreprises d'au moins <b>50 salariés</b> (4 indicateurs ; 5 à partir de 250), publié chaque année au <b>1er mars</b>. Résultats insuffisants → mesures de correction, <b>3 ans</b> pour se mettre en conformité, sinon pénalité.</li>
<li><b>Négociation</b> sur l'égalité professionnelle et la QVT ; à défaut d'accord, <b>plan d'action annuel</b>. Objectifs chiffrés dans 3 domaines (moins de 300 salariés) ou 4 (300 et plus).</li>
<li><b>Affichage</b> des textes sur l'égalité de rémunération.</li>
<li><b>CSE</b> : commission de l'égalité professionnelle à partir de 300 salariés.</li></ul>`]
