<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --grid-a: #1a2234;
    --grid-b: #1d2639;
    --snake: #4ade80;
    --snake-dark: #22a65a;
    --food: #f87171;
    --text: #e6ebf5;
    --muted: #8a94a9;
    --accent: #facc15;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; }
  .wrap { width: min(92vw, 480px); display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: .04em; }
  h1 span { color: var(--snake); }
  .scores { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
  .scores div { text-align: right; }
  .scores small { display: block; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; }
  .scores b { font-size: 1.3rem; }
  .board { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; background: var(--grid-a); }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: rgba(15,20,32,.78); backdrop-filter: blur(3px); padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 1.8rem; }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.5; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 10px;
    background: var(--snake); color: #08210f; font-weight: 700;
    padding: 12px 26px; font-size: 1rem;
  }
  button:active { transform: scale(.97); }
  .bar { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .85rem; }
  .bar button { background: var(--panel); color: var(--text); padding: 8px 14px; font-weight: 600; font-size: .85rem; }
  .pad { display: none; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; justify-content: center; }
  .pad button { background: var(--panel); color: var(--text); padding: 0; font-size: 1.4rem; }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) { .pad { display: grid; } .keys-hint { display: none; } }
  kbd { background: var(--panel); border-radius: 4px; padding: 1px 6px; font-family: inherit; color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>S</span>nake</h1>
    <div class="scores">
      <div><small>Score</small><b id="score">0</b></div>
      <div><small>Record</small><b id="best">0</b></div>
    </div>
  </header>

  <div class="board">
    <canvas id="c" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Snake</h2>
      <p id="ov-text">Mange les pommes, grandis, et ne te mords pas la queue.<br>Les murs te font ressortir de l'autre côté.<br>La vitesse augmente à chaque pomme.</p>
      <button id="ov-btn">Jouer</button>
    </div>
  </div>

  <div class="bar">
    <span class="keys-hint"><kbd>←↑↓→</kbd> ou <kbd>ZQSD</kbd> · <kbd>Espace</kbd> pause</span>
    <span id="speed">Vitesse 1</span>
    <button id="pause-btn">Pause</button>
  </div>

  <div class="pad" id="pad">
    <button class="up" data-dir="up" aria-label="Haut">▲</button>
    <button class="left" data-dir="left" aria-label="Gauche">◀</button>
    <button class="down" data-dir="down" aria-label="Bas">▼</button>
    <button class="right" data-dir="right" aria-label="Droite">▶</button>
  </div>
</div>

<script>
(() => {
  const N = 20;                       // cases par côté
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const S = canvas.width / N;         // taille d'une case en px

  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const $speed = document.getElementById('speed');
  const $overlay = document.getElementById('overlay');
  const $ovTitle = document.getElementById('ov-title');
  const $ovText = document.getElementById('ov-text');
  const $ovBtn = document.getElementById('ov-btn');
  const $pauseBtn = document.getElementById('pause-btn');

  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  let best = 0;
  try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}
  $best.textContent = best;

  let snake, dir, queue, food, score, state, stepMs, acc, last, eatFx;

  function reset() {
    const m = Math.floor(N / 2);
    snake = [[m, m], [m - 1, m], [m - 2, m]];
    dir = DIRS.right;
    queue = [];
    score = 0;
    stepMs = 140;
    acc = 0;
    eatFx = 0;
    placeFood();
    updateHud();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < N; x++)
      for (let y = 0; y < N; y++)
        if (!snake.some(([sx, sy]) => sx === x && sy === y)) free.push([x, y]);
    food = free[Math.floor(Math.random() * free.length)] || null;
  }

  function updateHud() {
    $score.textContent = score;
    $speed.textContent = 'Vitesse ' + (1 + Math.floor((140 - stepMs) / 8));
  }

  function turn(name) {
    if (state === 'ready' || state === 'over') { start(); }
    if (state !== 'playing') return;
    const d = DIRS[name];
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if (d[0] === -ref[0] && d[1] === -ref[1]) return;   // pas de demi-tour
    if (d === ref) return;
    if (queue.length < 3) queue.push(d);
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const [hx, hy] = snake[0];
    // les bords se rejoignent : on ressort du côté opposé
    const nx = (hx + dir[0] + N) % N, ny = (hy + dir[1] + N) % N;

    const eating = food && nx === food[0] && ny === food[1];
    // la queue bouge si on ne mange pas : on peut donc entrer dans la case qu'elle quitte
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(([x, y]) => x === nx && y === ny)) {
      return gameOver();
    }
    snake.unshift([nx, ny]);
    if (eating) {
      score += 10;
      stepMs = Math.max(60, stepMs - 4);
      eatFx = 1;
      placeFood();
      if (!food) return gameOver(true);
      updateHud();
    } else {
      snake.pop();
    }
  }

  function gameOver(won) {
    state = 'over';
    const record = score > best;
    if (record) {
      best = score;
      $best.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    $ovTitle.textContent = won ? 'Parfait !' : 'Perdu';
    $ovText.innerHTML = 'Score : <b style="color:var(--accent)">' + score + '</b>' +
      (record && score > 0 ? '<br>Nouveau record !' : '');
    $ovBtn.textContent = 'Rejouer';
    $overlay.classList.remove('hidden');
    $pauseBtn.textContent = 'Pause';
  }

  function start() {
    reset();
    state = 'playing';
    $overlay.classList.add('hidden');
    last = performance.now();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      $ovTitle.textContent = 'Pause';
      $ovText.textContent = 'Appuie sur Espace ou Reprendre.';
      $ovBtn.textContent = 'Reprendre';
      $overlay.classList.remove('hidden');
      $pauseBtn.textContent = 'Reprendre';
    } else if (state === 'paused') {
      state = 'playing';
      last = performance.now();
      $overlay.classList.add('hidden');
      $pauseBtn.textContent = 'Pause';
    }
  }

  // ---------- rendu ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(t) {
    // damier
    for (let x = 0; x < N; x++)
      for (let y = 0; y < N; y++) {
        ctx.fillStyle = (x + y) % 2 ? '#1d2639' : '#1a2234';
        ctx.fillRect(x * S, y * S, S, S);
      }

    // pomme qui pulse
    if (food) {
      const p = 1 + Math.sin(t / 180) * 0.08;
      const cx = food[0] * S + S / 2, cy = food[1] * S + S / 2;
      ctx.fillStyle = 'rgba(248,113,113,.18)';
      ctx.beginPath(); ctx.arc(cx, cy, S * 0.62 * p, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f87171';
      ctx.beginPath(); ctx.arc(cx, cy, S * 0.38 * p, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(cx - 1.5, cy - S * 0.5, 3, S * 0.18);
    }

    // serpent (dégradé de la tête vers la queue)
    const len = snake.length;
    for (let i = len - 1; i >= 0; i--) {
      const [x, y] = snake[i];
      const k = i / Math.max(1, len - 1);
      const g = Math.round(222 - k * 70), r = Math.round(74 - k * 40);
      ctx.fillStyle = `rgb(${r},${g},${Math.round(128 - k * 40)})`;
      const pad = i === 0 ? 1 : 2 + k * 2;
      roundRect(x * S + pad, y * S + pad, S - pad * 2, S - pad * 2, 6);
      ctx.fill();
    }

    // yeux
    const [hx, hy] = snake[0];
    const cx = hx * S + S / 2, cy = hy * S + S / 2;
    const [dx, dy] = dir;
    const ox = -dy * S * 0.2, oy = dx * S * 0.2;
    const fx = dx * S * 0.15, fy = dy * S * 0.15;
    for (const s of [1, -1]) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx + fx + ox * s, cy + fy + oy * s, S * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0f1420';
      ctx.beginPath(); ctx.arc(cx + fx * 1.6 + ox * s, cy + fy * 1.6 + oy * s, S * 0.06, 0, Math.PI * 2); ctx.fill();
    }

    // flash quand on mange
    if (eatFx > 0) {
      ctx.strokeStyle = `rgba(250,204,21,${eatFx})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, S * (1.6 - eatFx), 0, Math.PI * 2); ctx.stroke();
      eatFx = Math.max(0, eatFx - 0.06);
    }
  }

  function loop(t) {
    if (state === 'playing') {
      acc += t - last;
      last = t;
      while (acc >= stepMs && state === 'playing') { acc -= stepMs; step(); }
    }
    draw(t);
    requestAnimationFrame(loop);
  }

  // ---------- contrôles ----------
  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    z: 'up', s: 'down', q: 'left', d: 'right',
    w: 'up', a: 'left'
  };
  addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (KEYS[k]) { e.preventDefault(); turn(KEYS[k]); }
    else if (k === ' ' || k === 'p') {
      e.preventDefault();
      if (state === 'ready' || state === 'over') start(); else togglePause();
    } else if (k === 'Enter' && (state === 'ready' || state === 'over')) start();
  });

  $ovBtn.addEventListener('click', () => state === 'paused' ? togglePause() : start());
  $pauseBtn.addEventListener('click', togglePause);
  document.querySelectorAll('#pad button').forEach(b =>
    b.addEventListener('pointerdown', e => { e.preventDefault(); turn(b.dataset.dir); }));

  // glisser du doigt sur le plateau
  let tx = null, ty = null;
  canvas.addEventListener('touchstart', e => { const p = e.touches[0]; tx = p.clientX; ty = p.clientY; }, { passive: true });
  canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  canvas.addEventListener('touchend', e => {
    if (tx === null) return;
    const p = e.changedTouches[0];
    const dx = p.clientX - tx, dy = p.clientY - ty;
    tx = ty = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  reset();
  state = 'ready';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
