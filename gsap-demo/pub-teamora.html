<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pub Teamora</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2) format('woff2'); }

  :root { --bg: #f4f5fb; --surface-2: #eef0f8; --line: #e0e3ef; --fg: #151935; --muted: #5f6589; --faint: #8d92b0;
    --accent: #4f46e5; --accent-soft: #ebeafd; --ok: #0c8a5f; --ok-soft: #e3f6ee; --warn: #b95a0b; --warn-soft: #fdf0e1;
    --shadow: 0 1px 2px rgba(21, 25, 53, .06), 0 10px 30px rgba(21, 25, 53, .08); --shadow-lg: 0 30px 80px rgba(21, 25, 53, .18); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--fg); }
  .h { opacity: 0; }
  svg { flex: none; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; }

  .blob { position: absolute; border-radius: 50%; }
  #b1 { left: -500px; top: -520px; width: 1400px; height: 1400px; background: radial-gradient(circle, #6366f155 0%, #6366f100 65%); }
  #b2 { right: -480px; top: -420px; width: 1300px; height: 1300px; background: radial-gradient(circle, #ec489944 0%, #ec489900 65%); }
  #b3 { left: 300px; bottom: -760px; width: 1500px; height: 1500px; background: radial-gradient(circle, #06b6d444 0%, #06b6d400 65%); }
  #b4 { right: -300px; bottom: -500px; width: 1000px; height: 1000px; background: radial-gradient(circle, #f59e0b33 0%, #f59e0b00 65%); }

  /* ---------- Hook ---------- */
  #hook { opacity: 1; z-index: 10; }
  .it { position: absolute; left: 0; top: 0; background: #fff; border-radius: 16px; box-shadow: 0 20px 50px rgba(21, 25, 53, .2); display: flex; align-items: center; gap: 14px; padding: 16px 22px; font-size: 21px; font-weight: 700; white-space: nowrap; opacity: 0; }
  .it svg { width: 30px; height: 30px; }
  .it small { display: block; font-size: 15px; color: var(--faint); font-weight: 500; }
  .it.postit { background: #fef08a; box-shadow: 0 16px 36px #a1620740; font-style: italic; color: #713f12; border-radius: 4px; padding: 22px 24px; }
  .it.alert { background: #fff1f2; color: #9f1239; }
  .it.chat { background: #4f46e5; color: #fff; border-bottom-left-radius: 4px; }
  .it.chat small { color: #c7d2fe; }
  #count { position: absolute; left: 1720px; top: 70px; width: 140px; height: 140px; border-radius: 50%; background: #e11d48; color: #fff; font-size: 54px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px #e11d4833, 0 20px 50px #e11d4866; z-index: 12; opacity: 0; font-variant-numeric: tabular-nums; }
  #shock { position: absolute; left: 960px; top: 540px; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; border: 30px solid #fff; opacity: 0; z-index: 48; }

  /* ---------- Teamo + bubbles ---------- */
  #teamo { position: absolute; left: 0; top: 0; width: 170px; height: 170px; margin: -85px 0 0 -85px; z-index: 40; opacity: 0; filter: drop-shadow(0 18px 30px #4f46e555); }
  #teamo svg { width: 100%; height: 100%; display: block; }
  #teamo .eyes { transform-box: fill-box; transform-origin: 50% 50%; }
  .bub { position: absolute; left: 0; top: 0; z-index: 41; background: #fff; border-radius: 26px; padding: 24px 30px; font-size: 34px; font-weight: 700; line-height: 1.25; letter-spacing: -0.3px; color: var(--fg); box-shadow: 0 24px 60px #1519352e, 0 0 0 2px #4f46e522; opacity: 0; }
  .bub::after { content: ''; position: absolute; width: 30px; height: 30px; background: #fff; transform: rotate(45deg); }
  #bubT { max-width: 470px; transform-origin: 80% 100%; } #bubT::after { bottom: -12px; right: 80px; }
  #bubL { max-width: 560px; transform-origin: 0 100%; } #bubL::after { left: -11px; bottom: 30px; }
  .bub .gh { visibility: hidden; }
  .bub .tx { position: absolute; left: 30px; top: 24px; right: 30px; }
  .bub b { color: var(--accent); }

  /* ---------- Home wheel (V3 identity) ---------- */
  #home { z-index: 5; }
  #wheel { position: absolute; left: 780px; top: 560px; width: 0; height: 0; }
  .node { position: absolute; left: -46px; top: -46px; width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; opacity: 0;
    box-shadow: 0 0 0 5px #ffffffaa, 0 14px 30px rgba(21, 25, 53, .22); }
  .node svg { width: 38px; height: 38px; }
  .node .bd { position: absolute; top: -8px; right: -10px; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 99px; background: var(--warn); color: #fff; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; transform: scale(0); }
  .node .ck { position: absolute; top: -8px; right: -10px; width: 36px; height: 36px; border-radius: 50%; background: #10b981; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; transform: scale(0); }
  .node .ck svg { width: 18px; height: 18px; }
  #labels { position: absolute; left: 780px; top: 560px; }
  .lab { position: absolute; width: 250px; font-size: 22px; font-weight: 700; line-height: 1.15; }
  .lab-in { opacity: 0; }
  #hub { position: absolute; left: 620px; top: 400px; width: 320px; height: 320px; border-radius: 50%; z-index: 3; color: #fff; text-align: center; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 25%, #ffffff40 0%, #ffffff00 40%), linear-gradient(150deg, #4f46e5 0%, #0ea5c6 100%); box-shadow: 0 0 0 18px #ffffff99, 0 0 0 19px #4f46e522, 0 40px 90px #4f46e555; transform: scale(0); }
  .hub-in small { display: block; font-size: 17px; font-weight: 700; letter-spacing: 5px; color: #e0e7ff; }
  .hub-in b { display: block; font-size: 42px; font-weight: 800; letter-spacing: -1px; margin-top: 8px; }
  .hub-in span { display: inline-block; margin-top: 16px; font-size: 19px; font-weight: 700; background: #ffffff2e; padding: 9px 18px; border-radius: 99px; font-variant-numeric: tabular-nums; }
  #hub-rub { position: absolute; inset: 0; }
  #hub-rub div { position: absolute; left: 30px; right: 30px; top: 50%; margin-top: -40px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -0.5px; opacity: 0; }
  #hub-logo { position: absolute; width: 180px; height: 180px; opacity: 0; color: #fff; }

  /* ---------- Feature scenes ---------- */
  .chrome { position: absolute; left: 60px; top: 50px; display: flex; align-items: center; gap: 18px; z-index: 6; }
  .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(140deg, #4f46e5, #0ea5c6); color: #fff; display: flex; align-items: center; justify-content: center; }
  .logo svg { width: 32px; height: 32px; }
  .chrome > b { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .rpill { display: flex; align-items: center; gap: 10px; padding: 9px 18px 9px 9px; border-radius: 99px; background: #fff; box-shadow: var(--shadow); font-size: 20px; font-weight: 700; }
  .rpill i { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
  .rpill i svg { width: 20px; height: 20px; }
  .card { position: absolute; background: #fff; border-radius: 28px; box-shadow: var(--shadow-lg); }
  .kick { font-size: 18px; font-weight: 800; letter-spacing: 3px; color: var(--faint); }
  .pill { display: inline-flex; align-items: center; gap: 9px; padding: 10px 20px; border-radius: 99px; font-size: 22px; font-weight: 700; white-space: nowrap; }
  .pill svg { width: 22px; height: 22px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.acc { background: var(--accent-soft); color: var(--accent); }
  .stk { position: relative; display: inline-block; height: 46px; }
  .stk > * { position: absolute; left: 0; top: 0; }
  .av { border-radius: 50%; color: #fff; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex: none; }

  /* Recrutement */
  .sent { font-size: 46px; font-weight: 700; line-height: 1.35; letter-spacing: -0.8px; color: #2d3254; }
  .hl { position: relative; display: inline-block; border-radius: 10px; padding: 0 8px; }
  .hl s { text-decoration: none; white-space: nowrap; }
  .hl s + s { position: absolute; left: 8px; top: 0; }
  .zone { position: absolute; top: 300px; width: 520px; height: 300px; border: 3px dashed #cfd4e6; border-radius: 26px; }
  .zone h4 { position: absolute; left: 26px; top: 20px; font-size: 24px; font-weight: 800; color: var(--muted); }
  .cand { position: absolute; width: 440px; height: 130px; background: #fff; border-radius: 22px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 20px; padding: 0 24px; }
  .cand b { display: block; font-size: 30px; font-weight: 800; } .cand small { display: block; font-size: 20px; color: var(--faint); font-weight: 600; }
  .burst { position: absolute; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; border: 8px solid #10b981; opacity: 0; }

  /* Arrivées */
  .arow { position: absolute; left: 50px; right: 50px; height: 110px; }
  .arow h4 { font-size: 26px; font-weight: 800; }
  .arow .bar { position: absolute; left: 0; right: 0; top: 46px; height: 14px; background: var(--surface-2); border-radius: 7px; overflow: hidden; }
  .arow .bar i { display: block; height: 100%; width: 0; background: #10b981; border-radius: 7px; }
  .arow .chips { position: absolute; left: 0; top: 74px; display: flex; gap: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-size: 19px; font-weight: 700; opacity: 0; }
  .chip svg { width: 18px; height: 18px; }

  /* Paie */
  .tile { position: absolute; top: 380px; width: 270px; height: 290px; background: #fff; border-radius: 26px; box-shadow: var(--shadow); text-align: center; padding-top: 34px; border: 3px solid transparent; }
  .tile .ti { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto; background: var(--surface-2); color: var(--faint); display: flex; align-items: center; justify-content: center; position: relative; }
  .tile .ti svg { width: 36px; height: 36px; }
  .tile .ti em { position: absolute; right: -6px; top: -6px; width: 34px; height: 34px; border-radius: 50%; background: #10b981; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; transform: scale(0); }
  .tile .ti em svg { width: 16px; height: 16px; color: #fff; }
  .tile b { display: block; font-size: 54px; font-weight: 800; letter-spacing: -1.5px; margin-top: 22px; color: #c3c8de; font-variant-numeric: tabular-nums; }
  .tile small { display: block; font-size: 20px; font-weight: 700; color: var(--faint); margin-top: 4px; }
  .pline { position: absolute; top: 523px; height: 6px; background: var(--surface-2); border-radius: 3px; }
  .pline i { display: block; height: 100%; width: 0; background: #10b981; border-radius: 3px; }

  /* Grandir */
  #g-num { position: absolute; left: 160px; width: 1240px; top: 250px; text-align: center; font-size: 300px; font-weight: 800; letter-spacing: -12px; line-height: 1; font-variant-numeric: tabular-nums;
    background: linear-gradient(150deg, #4f46e5, #0ea5c6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gchip { position: absolute; top: 640px; display: flex; align-items: center; gap: 16px; padding: 16px 26px 16px 16px; border-radius: 24px; background: #fff; box-shadow: var(--shadow-lg); font-size: 25px; font-weight: 800; opacity: 0; }
  .gchip span { width: 70px; height: 70px; border-radius: 18px; color: #fff; font-size: 30px; display: flex; align-items: center; justify-content: center; }

  /* Teamo panel */
  #panel { position: absolute; left: 780px; top: 230px; width: 820px; height: 560px; background: #fff; border-radius: 30px; box-shadow: 0 40px 120px #15193540, 0 0 0 1px var(--line); z-index: 30; opacity: 0; overflow: hidden; }
  #panel .ph { display: flex; align-items: center; gap: 16px; padding: 22px 30px; background: linear-gradient(120deg, #4f46e5, #0ea5c6); color: #fff; }
  #panel .ph svg { width: 56px; height: 56px; }
  #panel .ph b { display: block; font-size: 26px; } #panel .ph small { font-size: 17px; opacity: .85; }
  .msg { position: absolute; max-width: 620px; border-radius: 24px; padding: 20px 26px; font-size: 30px; line-height: 1.35; font-weight: 600; opacity: 0; }
  .msg.me { right: 30px; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
  .msg.bot { left: 30px; background: var(--surface-2); color: var(--fg); border-bottom-left-radius: 6px; }
  .msg b { color: var(--accent); }
  .msg .gh { visibility: hidden; } .msg .tx { position: absolute; left: 26px; top: 20px; right: 26px; }

  /* Brand */
  #brand { position: absolute; left: 0; right: 0; top: 600px; text-align: center; z-index: 12; }
  #brand .name { font-size: 130px; font-weight: 800; letter-spacing: -4px; }
  #brand .name span { display: inline-block; opacity: 0; }
  #brand .tag { font-size: 38px; color: var(--muted); margin-top: 6px; font-weight: 600; }
  #brand .tag b { color: var(--accent); }
  #brand .url { display: inline-block; font-size: 26px; color: var(--accent); margin-top: 30px; font-weight: 700; background: var(--accent-soft); padding: 10px 26px; border-radius: 99px; }

  .zoomer { position: absolute; left: -46px; top: -46px; width: 92px; height: 92px; border-radius: 50%; z-index: 18; opacity: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 47; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div><div class="blob" id="b4"></div>

  <div class="scene" id="hook"><div id="items"></div><div id="count">0</div></div>

  <div class="scene" id="home">
    <div id="wheel"></div>
    <div id="labels"></div>
    <div id="hub"><div class="hub-in"><small>NOVA STUDIO</small><b>Collaborateurs</b><span id="hub-n">20 collaborateurs</span></div><div id="hub-rub"></div><div id="hub-logo"></div></div>
  </div>
  <div id="brand"><div class="name" data-split>Teamora</div><div class="tag h">L'ERP repensé pour <b>suivre la vie de vos collaborateurs</b></div><div class="url h">teamora.app</div></div>

  <div class="scene" id="sRec"></div>
  <div class="scene" id="sArr"></div>
  <div class="scene" id="sPay"></div>
  <div class="scene" id="sGrow"></div>
  <div id="panel"></div>

  <div id="zoomers"></div>
  <div id="teamo"></div>
  <div class="bub" id="bubT"><span class="gh"></span><span class="tx"></span></div>
  <div class="bub" id="bubL"><span class="gh"></span><span class="tx"></span></div>
  <div id="shock"></div>
  <div id="flash"></div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
// ================= Icons & data =================
const P = {
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.6-.4 4.4 1.2 5 4.3"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  docCheck: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 16l2.5 2 5-5"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  euro: '<path d="M17 6.5A6.5 6.5 0 1 0 17 17.5"/><path d="M4 10.5h9M4 13.5h9"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  cap: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  heart: '<path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>',
  door: '<path d="M14 3H6v18h8"/><path d="M14 3l6 2v16l-6-2z"/><path d="M10 12h.01"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
};
const ic = (n, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const CHK = ic('check', 3.2);
const RUB = [
  ['Besoin RH', 'target', '#6366f1', 3], ['Recrutement', 'search', '#7c3aed', 9], ['Arrivées', 'docCheck', '#a855f7', 4], ['Vie administrative', 'folder', '#e11d48', 6],
  ['Temps & absences', 'clock', '#ea580c', 8], ['Rémunération', 'euro', '#d97706', 14], ['Performance', 'star', '#ca8a04', 1], ['Formation', 'cap', '#65a30d', 1],
  ['Mobilité', 'trend', '#16a34a', 2], ['Santé & QVT', 'heart', '#059669', 2], ['Relations indiv.', 'chat', '#0d9488', 1], ['Départs', 'door', '#0891b2', 3],
];
const TODO = RUB.reduce((a, r) => a + r[3], 0);
const TEAMO = (id) => `<svg viewBox="0 0 64 64"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5c6"/></linearGradient></defs>
  <circle cx="32" cy="32" r="32" fill="url(#${id})"/><path d="M32 10.5v5.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle class="dot" cx="32" cy="9" r="3.4" fill="#fde68a"/>
  <path d="M13.5 31c0-8.3 7.6-14.5 18.5-14.5S50.5 22.7 50.5 31v5c0 8.3-7.6 13.5-18.5 13.5h-5.6l-7.6 5.6 1.7-7C15.6 45.6 13.5 41.6 13.5 36z" fill="#fff"/>
  <g class="eyes"><ellipse cx="25" cy="32.5" rx="3.1" ry="3.7" fill="#1e1b4b"/><ellipse cx="39" cy="32.5" rx="3.1" ry="3.7" fill="#1e1b4b"/><circle cx="26.1" cy="31.2" r="1" fill="#fff"/><circle cx="40.1" cy="31.2" r="1" fill="#fff"/></g>
  <path d="M26.5 40.2c3.2 3 7.8 3 11 0" stroke="#1e1b4b" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="20.2" cy="38.6" r="2.3" fill="#f9a8d4" opacity=".85"/><circle cx="43.8" cy="38.6" r="2.3" fill="#f9a8d4" opacity=".85"/></svg>`;
const $ = (s) => document.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const int = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(11);

  const set = () => { gh.innerHTML = md(text); tx.innerHTML = md(text.slice(0, Math.round(o.n))); };
