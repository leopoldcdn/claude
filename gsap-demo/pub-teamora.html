<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pub Teamora</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2) format('woff2'); }

  :root { --bg: #f4f5fb; --surface: #fff; --surface-2: #eef0f8; --line: #e0e3ef; --fg: #151935; --muted: #5f6589; --faint: #8d92b0;
    --accent: #4f46e5; --accent-soft: #ebeafd; --ok: #0c8a5f; --ok-soft: #e3f6ee; --warn: #b95a0b; --warn-soft: #fdf0e1; --bad: #c8314a; --bad-soft: #fbe7ea; --info: #2563c9; --info-soft: #e5eefc;
    --shadow: 0 1px 2px rgba(21, 25, 53, .06), 0 10px 30px rgba(21, 25, 53, .08); --shadow-lg: 0 30px 80px rgba(21, 25, 53, .18); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--fg); }
  .h { opacity: 0; }
  svg { flex: none; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  .abs { position: absolute; }

  /* Background blobs (radial gradients instead of blur) */
  .blob { position: absolute; border-radius: 50%; }
  #b1 { left: -500px; top: -520px; width: 1400px; height: 1400px; background: radial-gradient(circle, #6366f155 0%, #6366f100 65%); }
  #b2 { right: -480px; top: -420px; width: 1300px; height: 1300px; background: radial-gradient(circle, #ec489944 0%, #ec489900 65%); }
  #b3 { left: 300px; bottom: -760px; width: 1500px; height: 1500px; background: radial-gradient(circle, #06b6d444 0%, #06b6d400 65%); }
  #b4 { right: -300px; bottom: -500px; width: 1000px; height: 1000px; background: radial-gradient(circle, #f59e0b33 0%, #f59e0b00 65%); }

  /* ---------- Scene 1 : clutter ---------- */
  .cl { position: absolute; background: #fff; border-radius: 14px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 14px; padding: 16px 20px; font-size: 20px; font-weight: 600; white-space: nowrap; opacity: 0; }
  .cl svg { width: 30px; height: 30px; }
  .cl small { display: block; font-size: 15px; color: var(--faint); font-weight: 500; }
  .cl.postit { background: #fef08a; box-shadow: 0 18px 40px #a1620740; font-style: italic; font-weight: 700; color: #713f12; padding: 22px 24px; border-radius: 4px; }
  .cl.alert { background: #fff1f2; color: #9f1239; }
  #words { position: absolute; left: 0; right: 0; top: 380px; text-align: center; z-index: 5; }
  #words span { display: inline-block; font-size: 96px; font-weight: 800; letter-spacing: -3px; margin: 0 18px; opacity: 0; }

  /* ---------- Teamo + bubbles ---------- */
  #teamo { position: absolute; left: 0; top: 0; width: 160px; height: 160px; margin: -80px 0 0 -80px; z-index: 40; opacity: 0; filter: drop-shadow(0 18px 30px #4f46e555); }
  #teamo svg { width: 100%; height: 100%; display: block; }
  #teamo .eyes { transform-box: fill-box; transform-origin: 50% 50%; }
  .bub { position: absolute; left: 0; top: 0; z-index: 41; max-width: 700px; background: #fff; border-radius: 26px; padding: 24px 30px; font-size: 31px; font-weight: 600; line-height: 1.3; color: var(--fg); box-shadow: 0 24px 60px #1519352e, 0 0 0 2px #4f46e522; opacity: 0; }
  .bub::after { content: ''; position: absolute; bottom: 26px; width: 28px; height: 28px; background: #fff; transform: rotate(45deg); }
  #bubR { transform-origin: 100% 100%; } #bubR::after { right: -10px; }
  #bubL { transform-origin: 0 100%; } #bubL::after { left: -10px; }
  .bub .tx b { color: var(--accent); }
  .bub .ghost { visibility: hidden; display: block; height: 0; overflow: hidden; }

  /* ---------- App chrome (V3 style) ---------- */
  #hdr { position: absolute; left: 0; top: 0; right: 0; height: 96px; background: #ffffffd9; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 40px; gap: 22px; z-index: 20; opacity: 0; }
  .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(140deg, #4f46e5, #0ea5c6); color: #fff; display: flex; align-items: center; justify-content: center; }
  .logo svg { width: 32px; height: 32px; }
  #hdr .ttl { padding-left: 22px; border-left: 1px solid var(--line); }
  #hdr .ttl small { display: block; font-size: 15px; font-weight: 700; color: var(--faint); position: relative; height: 20px; }
  #hdr .ttl b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; position: relative; height: 38px; }
  #hdr .ttl s { text-decoration: none; position: absolute; left: 0; top: 0; white-space: nowrap; }
  .seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 5px; gap: 4px; }
  .seg span { display: flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 10px; font-size: 17px; font-weight: 700; color: var(--muted); }
  .seg span.on { background: #fff; color: var(--fg); box-shadow: var(--shadow); }
  .seg.sp span.on { background: var(--accent); color: #fff; }
  .av { width: 30px; height: 30px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .todo-btn { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 18px; font-weight: 700; }
  .todo-btn svg { width: 20px; height: 20px; }
  .todo-btn em { font-style: normal; background: #fff; color: var(--accent); border-radius: 99px; padding: 2px 10px; font-size: 16px; font-weight: 800; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
  .bell { width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted); background: #fff; }
  .bell svg { width: 24px; height: 24px; }

  #rail { position: absolute; left: 0; right: 0; top: 96px; height: 84px; background: #ffffffcc; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 40px; gap: 14px; z-index: 19; opacity: 0; }
  #rail .ri { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; position: relative; flex: none; }
  #rail .ri svg { width: 24px; height: 24px; }
  #rail .ri.g { background: #fff; border: 1px solid var(--line); color: var(--muted); border-radius: 14px; }
  #rail .sep { width: 1px; height: 40px; background: var(--line); margin: 0 10px; }
  #rail .ri .bd { position: absolute; top: -7px; right: -9px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; background: var(--warn); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
  #ring { position: absolute; top: 110px; left: 0; width: 64px; height: 64px; border-radius: 50%; z-index: 21; opacity: 0; }

  /* ---------- Home wheel ---------- */
  #home { position: absolute; inset: 0; z-index: 5; }
  #wheel { position: absolute; left: 960px; top: 600px; width: 0; height: 0; }
  .node { position: absolute; left: -46px; top: -46px; width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; opacity: 0;
    box-shadow: 0 0 0 5px #ffffffaa, 0 14px 30px rgba(21, 25, 53, .22); }
  .node svg { width: 38px; height: 38px; }
  .node .bd { position: absolute; top: -8px; right: -10px; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 99px; background: var(--warn); color: #fff; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; transform: scale(0); }
  .node .ck { position: absolute; top: -8px; right: -10px; width: 36px; height: 36px; border-radius: 50%; background: #10b981; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; transform: scale(0); }
  .node .ck svg { width: 18px; height: 18px; }
  .lab { position: absolute; width: 260px; font-size: 22px; font-weight: 700; color: var(--fg); line-height: 1.15; }
  .lab-in { opacity: 0; }
  #hub { position: absolute; left: 790px; top: 430px; width: 340px; height: 340px; border-radius: 50%; z-index: 3; color: #fff; text-align: center; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 25%, #ffffff40 0%, #ffffff00 40%), linear-gradient(150deg, #4f46e5 0%, #0ea5c6 100%); box-shadow: 0 0 0 18px #ffffff99, 0 0 0 19px #4f46e522, 0 40px 90px #4f46e555; transform: scale(0); }
  .hub-in small { display: block; font-size: 18px; font-weight: 700; letter-spacing: 5px; color: #e0e7ff; }
  .hub-in b { display: block; font-size: 46px; font-weight: 800; letter-spacing: -1px; margin-top: 8px; }
  .hub-in span { display: inline-block; margin-top: 16px; font-size: 19px; font-weight: 700; background: #ffffff2e; padding: 9px 18px; border-radius: 99px; }
  #hub-logo { position: absolute; width: 190px; height: 190px; opacity: 0; color: #fff; }

  /* ---------- Pages ---------- */
  .page { position: absolute; left: 0; top: 180px; width: 1920px; height: 900px; padding: 34px 60px; z-index: 6; opacity: 0; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); position: absolute; }
  .card-h { display: flex; align-items: center; justify-content: space-between; padding: 22px 28px 12px; }
  .card-h h3 { font-size: 23px; font-weight: 800; letter-spacing: -0.3px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 99px; font-size: 16px; font-weight: 700; white-space: nowrap; }
  .pill svg { width: 15px; height: 15px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.info { background: var(--info-soft); color: var(--info); } .pill.neu { background: var(--surface-2); color: var(--muted); } .pill.acc { background: var(--accent-soft); color: var(--accent); }
  .stk { position: relative; display: inline-block; height: 34px; }
  .stk > * { position: absolute; right: 0; top: 0; }
  .who { display: flex; align-items: center; gap: 14px; }
  .who .av { width: 44px; height: 44px; font-size: 15px; }
  .who b { display: block; font-size: 19px; font-weight: 700; }
  .who small { display: block; font-size: 15px; color: var(--faint); font-weight: 500; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 12px; font-size: 17px; font-weight: 700; background: var(--accent); color: #fff; }
  .btn svg { width: 18px; height: 18px; }

  /* Recrutement */
  .frise { display: flex; align-items: flex-start; justify-content: space-between; position: relative; padding: 6px 70px 24px; }
  .frise .ln { position: absolute; left: 140px; right: 140px; top: 30px; height: 5px; background: var(--surface-2); border-radius: 3px; }
  .frise .ln i { display: block; height: 100%; width: 0; background: #10b981; border-radius: 3px; }
  .fz { width: 160px; text-align: center; position: relative; }
  .fz .c { width: 50px; height: 50px; border-radius: 50%; margin: 0 auto; background: #fff; border: 4px solid #d5d9ea; display: flex; align-items: center; justify-content: center; position: relative; }
  .fz .c i { position: absolute; inset: -4px; border-radius: 50%; background: #10b981; display: flex; align-items: center; justify-content: center; transform: scale(0); }
  .fz .c svg { width: 24px; height: 24px; color: #fff; }
  .fz b { display: block; font-size: 18px; margin-top: 10px; }
  .fz small { display: block; font-size: 14px; color: var(--faint); }
  .offer-tx { padding: 6px 28px 28px; font-size: 21px; line-height: 1.6; color: #2d3254; }
  .offer-tx .hl { position: relative; border-radius: 6px; padding: 1px 3px; }
  .offer-tx .hl s { text-decoration: none; }
  .warnbox { position: absolute; display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 2px solid #f59e0b; border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow-lg); font-size: 16px; font-weight: 600; color: #7c2d12; width: 470px; opacity: 0; z-index: 3; }
  .warnbox svg { width: 24px; height: 24px; color: #f59e0b; }
  .kb-col { position: absolute; top: 64px; width: 216px; bottom: 22px; background: var(--surface-2); border-radius: 16px; }
  .kb-col h4 { display: flex; justify-content: space-between; padding: 14px 14px 0; font-size: 17px; font-weight: 800; }
  .kb-col h4 span { color: var(--muted); }
  .kc { position: absolute; width: 200px; height: 74px; background: #fff; border-radius: 13px; box-shadow: 0 2px 8px #1519351a; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
  .kc .av { width: 38px; height: 38px; font-size: 13px; }
  .kc b { display: block; font-size: 15.5px; font-weight: 700; white-space: nowrap; }
  .kc small { display: block; font-size: 13px; color: var(--faint); white-space: nowrap; }

  /* Arrivées */
  .tabs { display: flex; gap: 34px; padding: 0 28px; border-bottom: 1px solid var(--line); }
  .tabs span { padding: 14px 2px 14px; font-size: 18px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
  .tabs span.on { color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
  .tabs .bar { width: 170px; }
  .bar { height: 9px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: #10b981; }
  .rc { display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-top: 1px solid #eef0f8; position: relative; }
  .rc .av { width: 44px; height: 44px; font-size: 15px; }
  .rc b { display: block; font-size: 18px; } .rc small { display: block; font-size: 14px; color: var(--faint); }
  .rc .bar { margin-top: 8px; width: 220px; height: 6px; }
  .rc.sel { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
  .row { display: flex; align-items: center; gap: 14px; padding: 15px 28px; border-top: 1px solid #eef0f8; font-size: 19px; font-weight: 600; }
  .row .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .row .ic svg { width: 22px; height: 22px; }
  .row .stk { margin-left: auto; width: 170px; }
  .row small { display: block; font-size: 14px; color: var(--faint); font-weight: 500; }
  .sigbox { margin: 8px 28px 0; height: 170px; border: 2px dashed #cbd5e1; border-radius: 16px; position: relative; }
  .sigbox label { position: absolute; left: 16px; top: 12px; font-size: 14px; color: var(--faint); font-weight: 700; }
  .sigbox svg { position: absolute; left: 40px; top: 30px; }
  .sigbox path { stroke-dasharray: 1000; stroke-dashoffset: 1000; }

  /* Paie */
  .steps { display: flex; gap: 0; padding: 4px 28px 0; border-bottom: 1px solid var(--line); }
  .stp { flex: 1; display: flex; align-items: center; gap: 12px; padding: 16px 0 18px; font-size: 18px; font-weight: 700; color: var(--faint); position: relative; }
  .stp .n { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 16px; position: relative; }
  .stp .n i { position: absolute; inset: 0; border-radius: 50%; background: #10b981; display: flex; align-items: center; justify-content: center; transform: scale(0); }
  .stp .n svg { width: 18px; height: 18px; color: #fff; }
  .stp .u { position: absolute; left: 0; right: 30px; bottom: -1px; height: 4px; background: var(--accent); transform: scaleX(0); transform-origin: 0 50%; }
  .pz { position: absolute; left: 0; right: 0; top: 160px; bottom: 0; opacity: 0; }
  .tr { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr 1fr 180px; align-items: center; gap: 14px; padding: 0 28px; height: 66px; border-top: 1px solid #eef0f8; font-size: 18px; }
  .tr.th { height: 46px; border-top: 0; font-size: 13px; font-weight: 800; letter-spacing: 1.3px; color: var(--faint); text-transform: uppercase; }
  .tr .who .av { width: 38px; height: 38px; font-size: 13px; } .tr .who b { font-size: 17px; } .tr .who small { font-size: 13px; }
  .chk { display: flex; align-items: center; gap: 16px; padding: 18px 28px; border-top: 1px solid #eef0f8; font-size: 20px; font-weight: 600; }
  .chk .ci { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #d5d9ea; position: relative; flex: none; }
  .chk .ci i { position: absolute; inset: -3px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transform: scale(0); }
  .chk .ci svg { width: 20px; height: 20px; color: #fff; }
  .chk small { display: block; font-size: 15px; color: var(--faint); font-weight: 500; }
  .chk .stk { margin-left: auto; width: 190px; }
  .csv { position: absolute; display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px; box-shadow: var(--shadow-lg); font-size: 19px; font-weight: 700; }
  .csv .fi { width: 46px; height: 56px; border-radius: 8px; background: #dcfce7; color: #15803d; font-size: 12px; font-weight: 800; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
  .presta { position: absolute; width: 360px; height: 220px; border-radius: 20px; border: 2px dashed #c7d2fe; background: #f5f7ff; text-align: center; padding-top: 40px; }
  .presta b { display: block; font-size: 22px; margin-top: 12px; } .presta small { font-size: 16px; color: var(--muted); }
  .presta .ok2 { position: absolute; right: -14px; top: -14px; width: 46px; height: 46px; border-radius: 50%; background: #10b981; display: flex; align-items: center; justify-content: center; transform: scale(0); }
  .presta .ok2 svg { width: 24px; height: 24px; color: #fff; }
  .slip { position: absolute; width: 150px; height: 190px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; opacity: 0; }
  .slip b { display: block; font-size: 13px; font-weight: 800; } .slip small { display: block; font-size: 11px; color: var(--faint); }
  .slip i { display: block; height: 7px; border-radius: 4px; background: var(--surface-2); margin-top: 10px; }
  .slip em { position: absolute; left: 14px; right: 14px; bottom: 14px; font-style: normal; font-size: 15px; font-weight: 800; color: var(--ok); }

  /* Shuffle cards (other rubrics) */
  .shc { position: absolute; left: 960px; top: 600px; width: 760px; height: 300px; margin: -150px 0 0 -380px; background: #fff; border-radius: 28px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 34px; padding: 0 50px; opacity: 0; z-index: 8; }
  .shc .ic { width: 130px; height: 130px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
  .shc .ic svg { width: 62px; height: 62px; }
  .shc small { display: block; font-size: 18px; font-weight: 800; letter-spacing: 3px; }
  .shc b { display: block; font-size: 44px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin-top: 6px; }
  .shc p { font-size: 22px; color: var(--muted); margin-top: 10px; font-weight: 500; }

  /* Obligations */
  .big { font-size: 140px; font-weight: 800; letter-spacing: -5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .chart { position: absolute; left: 40px; right: 40px; bottom: 40px; height: 300px; display: flex; align-items: flex-end; gap: 12px; border-bottom: 2px solid var(--line); }
  .chart i { flex: 1; background: linear-gradient(180deg, #6366f1, #4f46e5); border-radius: 8px 8px 0 0; height: 0; }
  .chart .thr { position: absolute; left: 0; right: 0; border-top: 2px dashed; opacity: 0; }
  .chart .thr span { position: absolute; right: 0; top: -34px; font-size: 16px; font-weight: 800; padding: 3px 10px; border-radius: 8px; color: #fff; }
  .seuil { position: absolute; left: 0; width: 820px; height: 170px; display: flex; align-items: center; gap: 24px; padding: 0 30px; }
  .seuil .sn { width: 104px; height: 104px; border-radius: 26px; background: var(--surface-2); color: var(--faint); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; font-weight: 800; }
  .seuil .sn b { font-size: 40px; line-height: 1; } .seuil .sn small { font-size: 13px; letter-spacing: 1px; }
  .seuil h4 { font-size: 26px; font-weight: 800; } .seuil p { font-size: 18px; color: var(--muted); margin-top: 4px; }
  .seuil .stk { margin-left: auto; width: 170px; height: 34px; }
  .toast { position: absolute; display: flex; align-items: center; gap: 16px; background: #1e1b4b; color: #fff; border-radius: 18px; padding: 20px 26px; font-size: 20px; font-weight: 600; box-shadow: var(--shadow-lg); opacity: 0; z-index: 9; }
  .toast svg { width: 28px; height: 28px; color: #fbbf24; }

  /* Teamo panel */
  #panel { position: absolute; left: 1060px; top: 210px; width: 760px; height: 640px; background: #fff; border-radius: 28px; box-shadow: 0 40px 120px #15193540, 0 0 0 1px var(--line); z-index: 30; opacity: 0; overflow: hidden; }
