<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --hue: 160; --beat: 0; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    color: #eef0ff;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background:
      radial-gradient(1200px 700px at 15% -10%, hsla(calc(var(--hue) + 60), 90%, 45%, calc(.2 + var(--beat) * .12)), transparent 60%),
      radial-gradient(900px 600px at 110% 110%, hsla(calc(var(--hue) - 80), 90%, 45%, calc(.2 + var(--beat) * .12)), transparent 60%),
      #05040b;
  }
  .wrap { width: min(92vw, 500px, 64vh); display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; }
  h1 {
    margin: 0; font-family: Orbitron, system-ui, sans-serif; font-weight: 900;
    font-size: 2rem; letter-spacing: .14em;
    background: linear-gradient(90deg,
      hsl(var(--hue), 100%, 65%), hsl(calc(var(--hue) + 70), 100%, 68%), hsl(calc(var(--hue) + 140), 100%, 68%));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 calc(10px + var(--beat) * 10px) hsla(var(--hue), 100%, 60%, .6));
  }
  .scores { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
  .scores div { text-align: right; }
  .scores small { display: block; color: #8c8fb5; font-size: .66rem; text-transform: uppercase; letter-spacing: .14em; }
  .scores b {
    display: inline-block; font-weight: 800; font-size: 1.6rem;
    text-shadow: 0 0 14px hsla(var(--hue), 100%, 60%, .7);
  }
  .scores b.bump { animation: bump .35s ease-out; }
  .scores b.gold { color: #ffe066; text-shadow: 0 0 16px rgba(255, 210, 60, .9); }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.4); } 100% { transform: scale(1); } }

  .board {
    position: relative; border-radius: 16px; overflow: hidden;
    border: 1px solid hsla(var(--hue), 100%, 65%, calc(.4 + var(--beat) * .4));
    box-shadow:
      0 0 calc(26px + var(--beat) * 20px) hsla(var(--hue), 100%, 55%, .38),
      0 0 90px hsla(calc(var(--hue) + 90), 100%, 55%, .2),
      0 20px 60px rgba(0,0,0,.6);
  }
  /* scanlines + vignette façon écran d'arcade */
  .board::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
      radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.55) 100%);
  }
  .board::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    box-shadow: inset 0 0 60px rgba(255, 30, 70, .0); transition: box-shadow .15s;
  }
  .board.danger::before { box-shadow: inset 0 0 70px rgba(255, 30, 70, .55); animation: danger .25s ease-in-out infinite alternate; }
  @keyframes danger { from { opacity: .6; } to { opacity: 1; } }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; background: #05040b; }

  .overlay {
    position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center;
    background: radial-gradient(circle at 50% 45%, rgba(20,14,50,.55), rgba(5,4,12,.88));
    backdrop-filter: blur(4px); padding: 24px;
    animation: fadeIn .35s ease-out;
  }
  .overlay.light { background: radial-gradient(circle at 50% 45%, rgba(8,6,24,.62) 0, rgba(8,6,24,.25) 55%, rgba(5,4,12,.35) 100%); backdrop-filter: none; }
  .overlay.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: none; } }
  .overlay h2 {
    margin: 0; font-family: Orbitron, system-ui, sans-serif; font-weight: 900;
    font-size: 2.6rem; letter-spacing: .14em;
    background: linear-gradient(90deg, #5effc8, #6ad1ff, #c77dff, #ff6ab3, #ffd166, #5effc8);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 4s linear infinite, float 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(140, 120, 255, .7));
  }
  @keyframes shine { to { background-position: 300% 0; } }
  @keyframes float { 50% { transform: translateY(-5px); } }
  .overlay p { margin: 0; color: #c3c5e6; line-height: 1.6; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
  .overlay p b.big { font-weight: 800; font-size: 2.6rem; color: #ffe066; text-shadow: 0 0 18px rgba(255,210,60,.8); }
  .overlay .record {
    display: inline-block; margin-top: 6px; padding: 4px 12px; border-radius: 999px;
    background: linear-gradient(90deg, #ffb703, #ff6ab3); color: #1a0b14; font-weight: 800; font-size: .85rem;
    animation: pulse .8s ease-in-out infinite alternate;
  }
  @keyframes pulse { to { transform: scale(1.1); box-shadow: 0 0 26px rgba(255, 150, 120, .8); } }

  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 12px; color: #071318; font-weight: 800;
    padding: 13px 34px; font-size: 1rem; letter-spacing: .1em;
    background: linear-gradient(135deg, hsl(var(--hue), 100%, 62%), hsl(calc(var(--hue) + 60), 100%, 66%));
    box-shadow: 0 0 22px hsla(var(--hue), 100%, 60%, .55);
    transition: transform .1s, box-shadow .2s;
  }
  .overlay > button { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 40px hsla(var(--hue), 100%, 60%, .9); transform: scale(1.04); } }
  button:hover { box-shadow: 0 0 36px hsla(var(--hue), 100%, 60%, .85); }
  button:active { transform: scale(.96); }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #8c8fb5; font-size: .82rem; }
  .bar .keys-hint { white-space: nowrap; }
  .bar .ghost {
    background: rgba(255,255,255,.05); color: #eef0ff; padding: 8px 12px; font-weight: 600; font-size: .82rem; letter-spacing: 0;
    box-shadow: none; border: 1px solid rgba(255,255,255,.08); animation: none;
  }
  .bar .ghost.off { opacity: .45; }
  .bar .ghost:hover { border-color: hsla(var(--hue), 100%, 65%, .6); box-shadow: 0 0 14px hsla(var(--hue), 100%, 60%, .35); }
  .speed { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .pips { display: flex; gap: 3px; }
  .pips i { width: 6px; height: 12px; border-radius: 2px; background: rgba(255,255,255,.08); transition: background .3s, box-shadow .3s; }
  .pips i.on { background: hsl(calc(var(--hue) + var(--k) * 12), 100%, 62%); box-shadow: 0 0 8px hsla(calc(var(--hue) + var(--k) * 12), 100%, 60%, .9); }
  .buttons { display: flex; gap: 6px; }

  .pad { display: none; grid-template-columns: repeat(3, 66px); grid-template-rows: repeat(2, 58px); gap: 8px; justify-content: center; }
  .pad button {
    padding: 0; font-size: 1.3rem; color: #eef0ff; animation: none;
    background: rgba(255,255,255,.05); border: 1px solid hsla(var(--hue), 100%, 65%, .35);
    box-shadow: 0 0 12px hsla(var(--hue), 100%, 60%, .2);
  }
  .pad button:active { background: hsla(var(--hue), 100%, 60%, .3); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) { .pad { display: grid; } .keys-hint { display: none !important; } .wrap { width: min(92vw, 480px, 54vh); } }
  kbd { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); border-radius: 5px; padding: 1px 6px; font-family: inherit; color: #eef0ff; }
  .hint { color: #9a9dc4; font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SNAKE</h1>
    <div class="scores">
      <div><small>Score</small><b id="score">0</b></div>
      <div><small>Record</small><b id="best">0</b></div>
    </div>
  </header>

  <div class="board" id="board">
    <canvas id="c"></canvas>
    <div class="overlay light" id="overlay">
      <h2 id="ov-title">SNAKE</h2>
      <p id="ov-text">Mange les orbes, grandis, et ne te mords pas la queue.<br>Les murs te font ressortir de l'autre côté.<br>La vitesse — et la musique — montent à chaque orbe.</p>
      <button id="ov-btn">JOUER</button>
      <span class="hint keys-hint"><kbd>←↑↓→</kbd> / <kbd>ZQSD</kbd> diriger · <kbd>Espace</kbd> pause · <kbd>M</kbd> musique</span>
    </div>
  </div>

  <div class="bar">
    <span class="speed">Vitesse <span class="pips" id="pips"></span></span>
    <span class="buttons">
      <button class="ghost" id="music-btn" aria-label="Musique" title="Musique">🎵</button>
      <button class="ghost" id="sound-btn" aria-label="Effets sonores" title="Effets sonores">🔊</button>
      <button class="ghost" id="pause-btn">Pause</button>
    </span>
  </div>

  <div class="pad" id="pad">
    <button class="up" data-dir="up" aria-label="Haut">▲</button>
    <button class="left" data-dir="left" aria-label="Gauche">◀</button>
    <button class="down" data-dir="down" aria-label="Bas">▼</button>
    <button class="right" data-dir="right" aria-label="Droite">▶</button>
  </div>
</div>

<script>
(() => {
  // ======================================================================
  //  RÉGLAGES
  // ======================================================================
  const N = 20;              // cases par côté
  const W = 480;             // taille logique du plateau
  const S = W / N;           // taille d'une case
  const START_MS = 140, MIN_MS = 60, STEP_DEC = 4, DEMO_MS = 105;
  const MAX_LEVEL = 1 + Math.floor((START_MS - MIN_MS) / 8);
  const CHEERS = ['SUPER !', 'EN FEU !', 'INARRÊTABLE !', 'MONSTRUEUX !', 'LÉGENDAIRE !', 'DIVIN !'];

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = canvas.height = W * dpr;

  // calque du premier plan (serpent, orbe, effets) : sert aussi de source au « bloom »
  const fg = document.createElement('canvas');
  fg.width = fg.height = W * dpr;
  const fctx = fg.getContext('2d');
  const b1 = document.createElement('canvas'); b1.width = b1.height = 160;
  const b2 = document.createElement('canvas'); b2.width = b2.height = 48;
  const b1c = b1.getContext('2d'), b2c = b2.getContext('2d');

  const $ = id => document.getElementById(id);
  const $score = $('score'), $best = $('best'), $pips = $('pips'), $board = $('board');
  const $overlay = $('overlay'), $ovTitle = $('ov-title'), $ovText = $('ov-text'), $ovBtn = $('ov-btn');
  const $pauseBtn = $('pause-btn'), $soundBtn = $('sound-btn'), $musicBtn = $('music-btn');
  const root = document.documentElement.style;

  for (let i = 0; i < MAX_LEVEL; i++) { const p = document.createElement('i'); p.style.setProperty('--k', i); $pips.appendChild(p); }

  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  // ======================================================================
  //  STOCKAGE
  // ======================================================================
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let best = +store.get('snake-best', 0) || 0;
  let sfxOn = store.get('snake-sound', '1') === '1';
  let musicOn = store.get('snake-music', '1') === '1';
  $best.textContent = best;
  const syncAudioBtns = () => {
    $soundBtn.textContent = sfxOn ? '🔊' : '🔇';
    $soundBtn.classList.toggle('off', !sfxOn);
    $musicBtn.classList.toggle('off', !musicOn);
  };
  syncAudioBtns();

  // ======================================================================
  //  AUDIO : effets + musique synthwave procédurale
  // ======================================================================
  let ac = null, out = null, noiseBuf = null;
  function audio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        out = ac.createDynamicsCompressor();
        out.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function osc(when, freq, dur, type, vol, slideTo, lp) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, when);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, when + dur);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    let node = o;
    if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); node = f; }
    node.connect(g); g.connect(out);
    o.start(when); o.stop(when + dur + 0.03);
  }
  function noise(when, dur, vol, type, freq) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    s.connect(f).connect(g).connect(out);
    s.start(when); s.stop(when + dur + 0.03);
  }
  const fx = (fn) => (...a) => { if (sfxOn && !demo && audio()) fn(ac.currentTime, ...a); };
  const sfx = {
    eat: fx((t, n) => { const f = 520 * Math.pow(2, Math.min(n, 30) / 24); osc(t, f, 0.13, 'triangle', 0.16, f * 1.5); osc(t + 0.03, f * 2, 0.09, 'sine', 0.06); }),
    wrap: fx(t => { osc(t, 180, 0.2, 'sine', 0.07, 620); noise(t, 0.15, 0.04, 'bandpass', 2500); }),
    level: fx(t => [0, 4, 7, 12, 16].forEach((s, i) => osc(t + i * 0.06, 523 * Math.pow(2, s / 12), 0.16, 'square', 0.045, 0, 3000))),
    cheer: fx(t => { [0, 4, 7, 12, 7, 12, 16, 19].forEach((s, i) => osc(t + i * 0.07, 392 * Math.pow(2, s / 12), 0.22, 'sawtooth', 0.05, 0, 2600)); noise(t, 0.6, 0.08, 'highpass', 5000); }),
    boom: fx(t => { osc(t, 120, 0.4, 'sine', 0.4, 35); noise(t, 0.35, 0.12, 'lowpass', 900); }),
    die: fx(t => { osc(t, 330, 0.8, 'sawtooth', 0.1, 45, 1600); osc(t + 0.04, 165, 0.6, 'square', 0.06, 40, 900); noise(t, 0.5, 0.18, 'lowpass', 1200); }),
    start: fx(t => { osc(t, 262, 0.12, 'triangle', 0.1, 523); osc(t + 0.1, 523, 0.18, 'triangle', 0.1, 1046); })
  };

  // musique : séquenceur 16 pas, Am – F – C – G ; couches ajoutées avec la vitesse
  const PROG = [[0, 0], [-4, 1], [3, 1], [-2, 1]];          // [racine en demi-tons depuis La, majeur?]
  const BASS = [0, 0, 12, 0, 7, 0, 12, 7];
  const music = { timer: null, step: 0, next: 0 };
  const note = n => 110 * Math.pow(2, n / 12);
  function musicStart() {
    if (!musicOn || music.timer || !audio()) return;
    music.next = ac.currentTime + 0.06;
    music.step = 0;
    music.timer = setInterval(musicTick, 25);
  }
  function musicStop() { clearInterval(music.timer); music.timer = null; }
  function musicTick() {
    const sixteenth = 60 / (104 + (level - 1) * 5) / 4;
    while (music.next < ac.currentTime + 0.12) {
      playStep(music.step, music.next, sixteenth);
      music.next += sixteenth;
      music.step = (music.step + 1) % 64;
    }
  }
  function playStep(s, t, sixteenth) {
    const [r, major] = PROG[Math.floor(s / 16) % 4];
    const st = s % 16;
    const chord = major ? [0, 4, 7, 12] : [0, 3, 7, 12];
    if (st % 4 === 0) {                                   // grosse caisse
      osc(t, 150, 0.15, 'sine', 0.5, 40);
      setTimeout(() => { beat = 1; }, Math.max(0, (t - ac.currentTime) * 1000));
    }
    if (level >= 2 && st % 4 === 2) noise(t, 0.04, 0.05, 'highpass', 7500);          // charleston
    if (level >= 3 && (st === 4 || st === 12)) noise(t, 0.14, 0.11, 'bandpass', 1700); // caisse claire
    if (st % 2 === 0) osc(t, note(r + BASS[(st / 2) % 8]), 0.17, 'sawtooth', 0.075, 0, 450 + level * 60); // basse
    if (level >= 4) osc(t, note(r + 24 + chord[st % 4]), 0.07, 'square', 0.022, 0, 2200 + level * 150); // arpège
    if (level >= 6 && st === 0) chord.slice(0, 3).forEach(c => osc(t, note(r + 24 + c), sixteenth * 15, 'triangle', 0.03)); // nappe
    if (level >= 8 && st % 8 === 3) noise(t, 0.05, 0.05, 'highpass', 9000);           // charleston en plus
    if (level >= 9 && (st === 14 || st === 15)) osc(t, note(r + 36 + chord[(st + s) % 4]), 0.1, 'sawtooth', 0.025, 0, 3500);
  }

  // ======================================================================
  //  ÉTAT DU JEU
  // ======================================================================
  let snake, prev, dir, queue, food, foodBorn, score, shownScore = 0, state, demo = false;
  let stepMs, acc, last, level = 1, dieT = 0, overT = 0, hueBoost = 0;

  function reset() {
    const m = Math.floor(N / 2);
    snake = [[m, m], [m - 1, m], [m - 2, m]];
    prev = snake.map(p => p.slice());
    dir = DIRS.right;
    queue = [];
    score = 0;
    stepMs = demo ? DEMO_MS : START_MS;
    level = 1;
    acc = 0;
    last = performance.now();
    placeFood(last);
    if (!demo) { shownScore = 0; updateHud(); }
  }

  function placeFood(t) {
    const free = [];
    for (let x = 0; x < N; x++)
      for (let y = 0; y < N; y++)
        if (!snake.some(([sx, sy]) => sx === x && sy === y)) free.push([x, y]);
    food = free[Math.floor(Math.random() * free.length)] || null;
    foodBorn = t;
    if (food) ripple(food[0], food[1], 335, 0.6);
  }

  function updateHud() {
    $score.textContent = shownScore;
    $score.classList.toggle('gold', score > 0 && score > best);
    [...$pips.children].forEach((p, i) => p.classList.toggle('on', i < level));
  }
  const bump = el => { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); };

  function turn(name) {
    if (isMenu()) start();
    if (state !== 'playing') return;
    const d = DIRS[name];
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if (d[0] === -ref[0] && d[1] === -ref[1]) return;   // pas de demi-tour
    if (d === ref) return;
    if (queue.length < 3) queue.push(d);
  }

  const occupied = (cells, x, y) => cells.some(c => c[0] === x && c[1] === y);
  const wrapDelta = (a, b) => { let d = b - a; if (d > N / 2) d -= N; if (d < -N / 2) d += N; return d; };

  // IA de la démo : va vers l'orbe en évitant son corps
  function demoThink() {
    const [hx, hy] = snake[0];
    const body = snake.slice(0, -1);
    let bestD = null, bestScore = Infinity;
    for (const d of Object.values(DIRS)) {
      if (d[0] === -dir[0] && d[1] === -dir[1]) continue;
      const nx = (hx + d[0] + N) % N, ny = (hy + d[1] + N) % N;
      if (occupied(body, nx, ny)) continue;
      let sc = food ? Math.abs(wrapDelta(nx, food[0])) + Math.abs(wrapDelta(ny, food[1])) : 0;
      // évite les cases presque encerclées
      let exits = 0;
      for (const e of Object.values(DIRS)) if (!occupied(body, (nx + e[0] + N) % N, (ny + e[1] + N) % N)) exits++;
      sc += (4 - exits) * 1.5 + Math.random() * 0.8;
      if (sc < bestScore) { bestScore = sc; bestD = d; }
    }
    if (bestD) queue = [bestD];
  }

  function step(t) {
    if (demo) demoThink();
    if (queue.length) dir = queue.shift();
    const [hx, hy] = snake[0];
    const rx = hx + dir[0], ry = hy + dir[1];
    // les bords se rejoignent : on ressort du côté opposé
    const nx = (rx + N) % N, ny = (ry + N) % N;
    const wrapped = rx !== nx || ry !== ny;

    const eating = food && nx === food[0] && ny === food[1];
    // la queue bouge si on ne mange pas : on peut donc entrer dans la case qu'elle quitte
    const body = eating ? snake : snake.slice(0, -1);
    if (occupied(body, nx, ny)) return die(t);

    prev = snake.map(p => p.slice());
    snake.unshift([nx, ny]);

    if (wrapped) {
      ripple(rx, ry, headHue(t), 0.9);
      ripple(nx - dir[0] * 0.5, ny - dir[1] * 0.5, headHue(t), 0.9);
      wave((rx + 0.5) * S, (ry + 0.5) * S, 10);
      wave((nx + 0.5) * S, (ny + 0.5) * S, 10);
      sfx.wrap();
    }

    // traînée d'étincelles : queue, et derrière la tête quand ça va vite
    const tail = snake[snake.length - 1];
    burst((tail[0] + 0.5) * S, (tail[1] + 0.5) * S, segHue(t, snake.length), 1, 18, 1.4);
    if (level >= 4) burst((hx + 0.5) * S, (hy + 0.5) * S, headHue(t), level - 3, 60, 2.2, -dir[0], -dir[1]);

    if (eating) {
      score += 10;
      if (!demo) stepMs = Math.max(MIN_MS, stepMs - STEP_DEC);
      const px = (food[0] + 0.5) * S, py = (food[1] + 0.5) * S;
      burst(px, py, 335, 30, 240);
      burst(px, py, headHue(t), 18, 170);
      ripple(food[0], food[1], 335, 1);
      wave(px, py, 22);
      floater(px, py - 6, '+10', 50);
      shake = Math.max(shake, 5);
      zoomKick = Math.max(zoomKick, 0.025);
      flash = { a: 0.08, hue: 335 };
      beat = Math.max(beat, 0.6);
      sfx.eat(snake.length - 3);
      if (!demo) {
        const newLevel = 1 + Math.floor((START_MS - stepMs) / 8);
        if (newLevel > level) levelUp(t, newLevel);
        if (score % 100 === 0) celebrate(t);
        bump($score);
      }
      placeFood(t);
      if (!demo) updateHud();
      if (!food) return gameOver(true);
    } else {
      snake.pop();
    }
  }

  function levelUp(t, newLevel) {
    level = newLevel;
    if (levelFloater) levelFloater.life = 0;
    levelFloater = floater(W / 2, W / 2, 'VITESSE ' + level, headHue(t), 30, 1.6, 'Orbitron, system-ui, sans-serif');
    const [hx, hy] = snake[0];
    wave((hx + 0.5) * S, (hy + 0.5) * S, 34);
    setTimeout(() => sfx.level(), 110);
  }

  function celebrate(t) {
    const msg = CHEERS[Math.min(CHEERS.length - 1, score / 100 - 1)];
    floater(W / 2, W / 2 - 50, msg, 50, 40, 2.2, 'Orbitron, system-ui, sans-serif');
    hueBoost += 120;
    flash = { a: 0.3, hue: 50 };
    shake = Math.max(shake, 10);
    zoomKick = 0.06;
    wave(W / 2, W / 2, 55);
    sfx.cheer();
    for (let i = 0; i < 6; i++) setTimeout(() => {
      const x = W * (0.15 + Math.random() * 0.7), y = W * (0.15 + Math.random() * 0.7), h = Math.random() * 360;
      burst(x, y, h, 50, 300, 0.7);
      burst(x, y, h + 60, 20, 140, 0.9);
      wave(x, y, 18);
      if (i % 2 === 0) sfx.boom();
    }, 120 + i * 170);
  }

  function die(t) {
    state = 'dying';
    dieT = t;
    const pts = snakePoints(1);
    const k = Math.max(1, Math.floor(pts.length / 70));
    pts.forEach(([x, y], i) => {
      if (i % k) return;
      burst((((x % N) + N) % N + 0.5) * S, (((y % N) + N) % N + 0.5) * S, segHue(t, i), 5, 300);
    });
    const [hx, hy] = snake[0];
    wave((hx + 0.5) * S, (hy + 0.5) * S, 60);
    shake = 18;
    flash = { a: 0.5, hue: 350 };
    deathFocus = [(hx + 0.5) * S, (hy + 0.5) * S];
    musicStop();
    sfx.die();
  }

  function gameOver(won) {
    state = 'over';
    overT = performance.now();
    const record = score > best;
    if (record) {
      best = score;
      $best.textContent = best;
      bump($best);
      store.set('snake-best', best);
    }
    shownScore = score; updateHud();
    $score.classList.remove('gold');
    $ovTitle.textContent = won ? 'PARFAIT !' : 'GAME OVER';
    $ovText.innerHTML = 'Score<br><b class="big">' + score + '</b>' +
      (record && score > 0 ? '<br><span class="record">★ Nouveau record ★</span>' : '');
    $ovBtn.textContent = 'REJOUER';
    $overlay.classList.remove('hidden', 'light');
    $pauseBtn.textContent = 'Pause';
  }

  function startDemo() {
    demo = true;
    reset();
    state = 'demo';
    $overlay.classList.add('light');
  }

  const isMenu = () => state === 'demo' || state === 'over' || (state === 'dying' && demo);

  function start() {
    demo = false;
    reset();
    state = 'playing';
    hueBoost = 0;
    $overlay.classList.add('hidden');
    particles.length = 0; floaters.length = 0;
    sfx.start();
    musicStart();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      $ovTitle.textContent = 'PAUSE';
      $ovText.textContent = 'Appuie sur Espace ou Reprendre.';
      $ovBtn.textContent = 'REPRENDRE';
      $overlay.classList.remove('hidden', 'light');
      $pauseBtn.textContent = 'Reprendre';
      musicStop();
    } else if (state === 'paused') {
      state = 'playing';
      last = performance.now();
      $overlay.classList.add('hidden');
      $pauseBtn.textContent = 'Pause';
      musicStart();
    }
  }

  // ======================================================================
  //  EFFETS
  // ======================================================================
  const particles = [], floaters = [], ripples = [], waves = [];
  let shake = 0, flash = { a: 0, hue: 0 }, levelFloater = null, zoomKick = 0, beat = 0, deathFocus = null;

  function burst(x, y, hue, n, speed, decay = 1, bx = 0, by = 0) {
    for (let i = 0; i < n; i++) {
      let a = Math.random() * Math.PI * 2;
      if (bx || by) a = Math.atan2(by, bx) + (Math.random() - 0.5) * 0.9;
      const v = speed * (0.3 + Math.random() * 0.7);
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: (1 + Math.random() * 1.4) * decay, size: 1.5 + Math.random() * 3, hue: hue + (Math.random() * 40 - 20), fr: 0.05 });
    }
    if (particles.length > 900) particles.splice(0, particles.length - 900);
  }
  function floater(x, y, text, hue, size = 18, dur = 1, font) {
    const f = { x, y, text, hue, size, font, life: 1, decay: 1 / dur };
    floaters.push(f);
    return f;
  }
  function ripple(cx, cy, hue, strength) { ripples.push({ x: (cx + 0.5) * S, y: (cy + 0.5) * S, hue, life: strength }); }
  function wave(x, y, strength) { waves.push({ x, y, r: 0, strength, life: 1 }); }

  const headHue = t => (t / 25 + score * 2 + hueBoost) % 360;
  const segHue = (t, i) => (headHue(t) + i * 9) % 360;

  // ======================================================================
  //  DÉCOR : nébuleuses, étoiles, grille déformable
  // ======================================================================
  const bg = document.createElement('canvas');
  bg.width = bg.height = W * dpr;
  (() => {
    const b = bg.getContext('2d');
    b.scale(dpr, dpr);
    const g = b.createRadialGradient(W / 2, W / 2, 0, W / 2, W / 2, W * 0.75);
    g.addColorStop(0, '#120e30'); g.addColorStop(1, '#04030a');
    b.fillStyle = g; b.fillRect(0, 0, W, W);
  })();

  const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * W, z: 0.25 + Math.random() * 0.75, tw: Math.random() * 6.28 }));

  const GP = N + 1;
  const gridOff = new Float32Array(GP * GP * 2);
  function updateGrid(dt, hp) {
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i];
      w.r += 420 * dt; w.life -= dt * 0.85;
      if (w.life <= 0) waves.splice(i, 1);
    }
    for (let j = 0; j < GP; j++)
      for (let i = 0; i < GP; i++) {
        const px = i * S, py = j * S;
        let ox = 0, oy = 0;
        for (const w of waves) {
          const dx = px - w.x, dy = py - w.y, d = Math.hypot(dx, dy) || 0.001;
          const band = Math.exp(-Math.pow((d - w.r) / 26, 2));
          const f = band * w.strength * w.life;
          ox += dx / d * f; oy += dy / d * f;
        }
        // la tête creuse un léger puits dans la grille
        const dx = hp[0] - px, dy = hp[1] - py, d = Math.hypot(dx, dy) || 0.001;
        const f = 9 * Math.exp(-Math.pow(d / 60, 2));
        ox += dx / d * f; oy += dy / d * f;
        const k = (j * GP + i) * 2;
        gridOff[k] = ox; gridOff[k + 1] = oy;
      }
  }

  function drawBackground(c, t, dt, hp) {
    c.drawImage(bg, -40, -40, W + 80, W + 80);
    const hue = headHue(t);

    // nébuleuses
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const x = W / 2 + Math.cos(t / 7000 + i * 2.1) * W * 0.32;
      const y = W / 2 + Math.sin(t / 9000 + i * 1.7) * W * 0.32;
      const r = W * (0.35 + 0.08 * i);
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `hsla(${(hue + i * 100) % 360},90%,55%,${0.09 + beat * 0.05})`);
      g.addColorStop(1, 'hsla(0,0%,0%,0)');
      c.fillStyle = g;
      c.fillRect(-40, -40, W + 80, W + 80);
    }

    // étoiles qui défilent à l'opposé du serpent (sensation de vitesse)
    const sp = (state === 'playing' || state === 'demo') ? 10 + level * 7 : 4;
    for (const s of stars) {
      s.x = (s.x - dir[0] * sp * s.z * dt + W) % W;
      s.y = (s.y - dir[1] * sp * s.z * dt + W) % W;
      const a = (0.25 + 0.5 * Math.abs(Math.sin(t / 700 + s.tw))) * s.z;
      c.fillStyle = `rgba(220,225,255,${a})`;
      const sz = s.z * 1.8;
      c.fillRect(s.x, s.y, sz, sz);
    }
    c.restore();

    // grille déformée
    const lineA = 0.07 + beat * 0.07;
    c.strokeStyle = `hsla(${(hue + 200) % 360},90%,70%,${lineA})`;
    c.lineWidth = 1;
    c.beginPath();
    for (let j = 0; j < GP; j++) {
      for (let i = 0; i < GP; i++) {
        const k = (j * GP + i) * 2, x = i * S + gridOff[k], y = j * S + gridOff[k + 1];
        i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      }
    }
    for (let i = 0; i < GP; i++) {
      for (let j = 0; j < GP; j++) {
        const k = (j * GP + i) * 2, x = i * S + gridOff[k], y = j * S + gridOff[k + 1];
        j === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      }
    }
    c.stroke();

    // intersections qui s'illuminent près de la tête
    for (let j = 1; j < N; j++)
      for (let i = 1; i < N; i++) {
        const k = (j * GP + i) * 2, x = i * S + gridOff[k], y = j * S + gridOff[k + 1];
        let dx = Math.abs(x - hp[0]), dy = Math.abs(y - hp[1]);
        dx = Math.min(dx, W - dx); dy = Math.min(dy, W - dy);
        const near = Math.max(0, 1 - Math.hypot(dx, dy) / (S * 5));
        const a = 0.08 + near * 0.8 + beat * 0.12;
        c.fillStyle = `hsla(${hue},100%,72%,${a})`;
        const s = 1.4 + near * 2.2;
        c.fillRect(x - s / 2, y - s / 2, s, s);
      }

    // reflet qui balaie le plateau
    const sx = ((t / 12) % (W * 3)) - W;
    const g = c.createLinearGradient(sx, 0, sx + 180, 180);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(190,170,255,0.045)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(-40, -40, W + 80, W + 80);
  }

  // ======================================================================
  //  PREMIER PLAN : orbe, serpent, effets
  // ======================================================================
  // positions interpolées (mouvement fluide), « dépliées » à travers les bords
  function snakePoints(alpha) {
    const L = snake.length, pts = new Array(L);
    for (let i = 0; i < L; i++) {
      const to = snake[i], from = prev[i] || prev[prev.length - 1];
      pts[i] = [from[0] + wrapDelta(from[0], to[0]) * alpha, from[1] + wrapDelta(from[1], to[1]) * alpha];
    }
    for (let i = 1; i < L; i++) {
      let [x, y] = pts[i]; const [px, py] = pts[i - 1];
      while (x - px > N / 2) x -= N; while (x - px < -N / 2) x += N;
      while (y - py > N / 2) y -= N; while (y - py < -N / 2) y += N;
      pts[i] = [x, y];
    }
    return pts;
  }

  function drawFood(c, t, hp) {
    if (!food) return;
    const k = Math.min(1, Math.max(0, (t - foodBorn) / 380));
    const e = Math.max(0.01, 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2));   // easeOutBack
    const p = 1 + Math.sin(t / 150) * 0.09 + beat * 0.08;
    const cx = (food[0] + 0.5) * S, cy = (food[1] + 0.5) * S;

    c.save();
    c.globalCompositeOperation = 'lighter';
    const halo = c.createRadialGradient(cx, cy, 0, cx, cy, S * 1.8 * e);
    halo.addColorStop(0, 'rgba(255, 70, 150, .6)'); halo.addColorStop(1, 'rgba(255, 70, 150, 0)');
    c.fillStyle = halo;
    c.beginPath(); c.arc(cx, cy, S * 1.8 * e, 0, Math.PI * 2); c.fill();

    // losange qui tourne
    c.strokeStyle = 'rgba(255, 190, 225, .8)';
    c.lineWidth = 1.5;
    c.save(); c.translate(cx, cy); c.rotate(t / 600);
    const q = S * 0.72 * e * p;
    c.strokeRect(-q / 2, -q / 2, q, q);
    c.rotate(-t / 300);
    c.setLineDash([3, 5]); c.lineDashOffset = -t / 25;
    c.beginPath(); c.arc(0, 0, S * 0.7 * e * p, 0, Math.PI * 2); c.stroke();
    c.setLineDash([]);
    c.restore();

    for (let i = 0; i < 3; i++) {
      const a = t / 360 + i * Math.PI * 2 / 3;
      c.fillStyle = 'rgba(255, 235, 248, .95)';
      c.beginPath(); c.arc(cx + Math.cos(a) * S * 0.88 * e, cy + Math.sin(a) * S * 0.88 * e, 1.9, 0, Math.PI * 2); c.fill();
    }
    c.restore();

    const r = Math.max(0.1, S * 0.38 * e * p);
    const core = c.createRadialGradient(cx - r * 0.35, cy - r * 0.35, 0, cx, cy, r);
    core.addColorStop(0, '#ffffff'); core.addColorStop(0.3, '#ff9ccc'); core.addColorStop(1, '#ff2d7a');
    c.fillStyle = core;
    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();

    // aimant : quand la tête approche, l'orbe lâche un filet d'énergie vers elle
    if (state === 'playing' || state === 'demo') {
      let dx = hp[0] - cx, dy = hp[1] - cy;
      if (dx > W / 2) dx -= W; if (dx < -W / 2) dx += W;
      if (dy > W / 2) dy -= W; if (dy < -W / 2) dy += W;
      const d = Math.hypot(dx, dy);
      if (d < S * 4.5 && d > S * 0.8 && Math.random() < 0.7) {
        const a = Math.random() * 6.28;
        particles.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, vx: dx / d * 170, vy: dy / d * 170, life: 1, decay: 170 / d * 1.1, size: 1.6 + Math.random() * 1.6, hue: 330 + Math.random() * 30, fr: 1 });
      }
    }
  }

  function drawSnakeAt(c, pts, ox, oy, t) {
    const L = pts.length;
    const P = i => [(pts[i][0] + ox + 0.5) * S, (pts[i][1] + oy + 0.5) * S];
    const width = i => S * (0.8 - 0.36 * (i / Math.max(1, L - 1))) * (1 + beat * 0.06);
    c.lineCap = 'round'; c.lineJoin = 'round';

    c.globalCompositeOperation = 'lighter';
    for (let i = L - 1; i >= 1; i--) {
      const [ax, ay] = P(i), [bx, by] = P(i - 1);
      c.strokeStyle = `hsla(${segHue(t, i)},100%,60%,0.10)`;
      c.lineWidth = width(i) * 2.4;
      c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
    }
    c.globalCompositeOperation = 'source-over';
    for (let i = L - 1; i >= 1; i--) {
      const [ax, ay] = P(i), [bx, by] = P(i - 1);
      c.strokeStyle = `hsl(${segHue(t, i)},95%,56%)`;
      c.lineWidth = width(i);
      c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
    }
    // écailles lumineuses qui « coulent » le long du corps
    c.globalCompositeOperation = 'lighter';
    for (let i = L - 1; i >= 1; i--) {
      const [ax, ay] = P(i), [bx, by] = P(i - 1);
      c.strokeStyle = `hsla(${segHue(t, i)},100%,85%,0.33)`;
      c.lineWidth = width(i) * 0.28;
      c.beginPath(); c.moveTo(ax - 2, ay - 2); c.lineTo(bx - 2, by - 2); c.stroke();
      const pulse = Math.sin(t / 90 - i * 0.7);
      if (pulse > 0.75) {
        c.fillStyle = `hsla(${segHue(t, i)},100%,92%,${(pulse - 0.75) * 3})`;
        c.beginPath(); c.arc(ax, ay, width(i) * 0.22, 0, Math.PI * 2); c.fill();
      }
    }
    c.globalCompositeOperation = 'source-over';

    // tête
    const [hx, hy] = P(0);
    const hue = headHue(t);
    const hg = c.createRadialGradient(hx - 4, hy - 4, 1, hx, hy, S * 0.5);
    hg.addColorStop(0, `hsl(${hue},100%,82%)`); hg.addColorStop(1, `hsl(${hue},95%,52%)`);
    c.fillStyle = hg;
    c.shadowColor = `hsl(${hue},100%,60%)`; c.shadowBlur = 20;
    c.beginPath(); c.arc(hx, hy, S * 0.5, 0, Math.PI * 2); c.fill();
    c.shadowBlur = 0;

    // yeux (avec clignement)
    const [dx, dy] = dir;
    const sx = -dy * S * 0.2, sy = dx * S * 0.2;
    const fx = dx * S * 0.12, fy = dy * S * 0.12;
    const blink = (t % 3400) < 110;
    for (const s of [1, -1]) {
      const ex = hx + fx + sx * s, ey = hy + fy + sy * s;
      if (blink) {
        c.strokeStyle = '#0b0820'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(ex - 3, ey); c.lineTo(ex + 3, ey); c.stroke();
      } else {
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(ex, ey, S * 0.15, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#0b0820';
        c.beginPath(); c.arc(ex + dx * 2, ey + dy * 2, S * 0.075, 0, Math.PI * 2); c.fill();
      }
    }
  }

  function drawSnake(c, t, pts, fade) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const [x, y] of pts) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
    c.save();
    c.globalAlpha = fade;
    for (const ox of [-N, 0, N])
      for (const oy of [-N, 0, N])
        if (maxX + ox >= -2 && minX + ox <= N + 1 && maxY + oy >= -2 && minY + oy <= N + 1)
          drawSnakeAt(c, pts, ox, oy, t);
    c.restore();
  }

  // danger : la prochaine case est le corps → anneau rouge et bords qui rougissent
  let dangerOn = false;
  function checkDanger() {
    let on = false;
    if (state === 'playing') {
      const d = queue.length ? queue[0] : dir;
      const nx = (snake[0][0] + d[0] + N) % N, ny = (snake[0][1] + d[1] + N) % N;
      on = occupied(snake.slice(0, -1), nx, ny);
    }
    if (on !== dangerOn) { dangerOn = on; $board.classList.toggle('danger', on); }
    return on;
  }

  function drawEffects(c, dt, t, hp) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life -= dt * 1.8;
      if (r.life <= 0) { ripples.splice(i, 1); continue; }
      c.strokeStyle = `hsla(${r.hue},100%,65%,${r.life})`;
      c.lineWidth = 2.5 * r.life;
      c.beginPath(); c.arc(r.x, r.y, S * (0.4 + (1 - r.life) * 2.2), 0, Math.PI * 2); c.stroke();
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= p.decay * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      const fr = Math.pow(p.fr, dt);
      p.vx *= fr; p.vy *= fr;
      p.x += p.vx * dt; p.y += p.vy * dt;
      c.fillStyle = `hsla(${p.hue},100%,65%,${p.life})`;
      c.beginPath(); c.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); c.fill();
    }
    if (dangerOn) {
      const a = 0.5 + 0.5 * Math.sin(t / 45);
      c.strokeStyle = `rgba(255,50,80,${0.4 + a * 0.5})`;
      c.lineWidth = 3;
      c.beginPath(); c.arc(hp[0], hp[1], S * (0.75 + a * 0.15), 0, Math.PI * 2); c.stroke();
    }
    c.restore();

    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= f.decay * dt;
      if (f.life <= 0) { floaters.splice(i, 1); continue; }
      f.y -= 38 * dt;
      const pop = f.life > 0.85 ? 1 + (f.life - 0.85) * 3 : 1;
      const sc = (1 + (1 - f.life) * 0.25) * pop;
      c.save();
      c.globalAlpha = Math.min(1, f.life * 1.6);
      c.font = `900 ${f.size * sc}px ${f.font || 'Inter, system-ui, sans-serif'}`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.shadowColor = `hsl(${f.hue},100%,60%)`; c.shadowBlur = 18;
      c.fillStyle = `hsl(${f.hue},100%,80%)`;
      c.fillText(f.text, f.x, f.y);
      c.restore();
    }
  }

  // ======================================================================
  //  BOUCLE PRINCIPALE
  // ======================================================================
  let lastFrame = performance.now(), cssTick = 0;
  function loop(t) {
    const rawDt = Math.min(0.05, (t - lastFrame) / 1000);
    lastFrame = t;
    // ralenti au moment de la mort
    const slow = state === 'dying' && t - dieT < 450 ? 0.35 : 1;
    const dt = rawDt * slow;

    if (state === 'playing' || state === 'demo') {
      acc += t - last;
      last = t;
      while (acc >= stepMs && (state === 'playing' || state === 'demo')) { acc -= stepMs; step(t); }
    }
    if (state === 'dying' && t - dieT > 1000) demo ? startDemo() : gameOver(false);
    if (state === 'over' && t - overT > 1600) startDemo();

    if (!demo && shownScore < score) {
      shownScore = Math.min(score, shownScore + Math.max(1, Math.round((score - shownScore) * 0.25)));
      $score.textContent = shownScore;
    }

    const moving = state === 'playing' || state === 'demo' || state === 'paused';
    const alpha = moving ? Math.min(1, acc / stepMs) : 1;
    const fade = state === 'dying' ? Math.max(0, 1 - (t - dieT) / 450) : (state === 'over' ? 0 : 1);
    const pts = snakePoints(alpha);
    const hp = [(((pts[0][0] % N) + N) % N + 0.5) * S, (((pts[0][1] % N) + N) % N + 0.5) * S];

    // caméra : secousse + petits coups de zoom (+ zoom sur la tête à la mort)
    let z = 1 + zoomKick + beat * 0.006, focus = [W / 2, W / 2];
    if (state === 'dying' && deathFocus) { z += 0.14 * Math.min(1, (t - dieT) / 300); focus = deathFocus; }
    zoomKick *= Math.pow(0.01, rawDt);
    let shx = 0, shy = 0;
    if (shake > 0.2) { shx = (Math.random() - 0.5) * shake; shy = (Math.random() - 0.5) * shake; shake *= Math.pow(0.002, rawDt); } else shake = 0;
    const cam = c => c.setTransform(dpr * z, 0, 0, dpr * z, dpr * (focus[0] * (1 - z) + shx), dpr * (focus[1] * (1 - z) + shy));

    updateGrid(dt, hp);
    checkDanger();

    cam(ctx);
    drawBackground(ctx, t, dt, hp);

    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.clearRect(0, 0, fg.width, fg.height);
    cam(fctx);
    drawFood(fctx, t, hp);
    if (fade > 0) drawSnake(fctx, t, pts, fade);
    drawEffects(fctx, dt, t, hp);

    // composition + bloom
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(fg, 0, 0);
    b1c.clearRect(0, 0, 160, 160); b1c.drawImage(fg, 0, 0, 160, 160);
    b2c.clearRect(0, 0, 48, 48); b2c.drawImage(b1, 0, 0, 48, 48);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 0.45 + beat * 0.15; ctx.drawImage(b1, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 0.6 + beat * 0.2; ctx.drawImage(b2, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    if (flash.a > 0.005) {
      ctx.fillStyle = `hsla(${flash.hue},100%,60%,${flash.a})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      flash.a *= Math.pow(0.004, rawDt);
    }

    beat *= Math.pow(0.004, rawDt);
    if (++cssTick % 3 === 0) {
      root.setProperty('--hue', Math.round(headHue(t)));
      root.setProperty('--beat', beat.toFixed(2));
    }
    requestAnimationFrame(loop);
  }

  // ======================================================================
  //  CONTRÔLES
  // ======================================================================
  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    z: 'up', s: 'down', q: 'left', d: 'right', w: 'up', a: 'left'
  };
  addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (KEYS[k]) { e.preventDefault(); turn(KEYS[k]); }
    else if (k === ' ' || k === 'p') {
      e.preventDefault();
      if (isMenu()) start(); else togglePause();
    } else if (k === 'Enter' && isMenu()) start();
    else if (k === 'm') $musicBtn.click();
  });

  $ovBtn.addEventListener('click', () => state === 'paused' ? togglePause() : (isMenu() && start()));
  $pauseBtn.addEventListener('click', e => { togglePause(); e.currentTarget.blur(); });
  $soundBtn.addEventListener('click', e => {
    sfxOn = !sfxOn; store.set('snake-sound', sfxOn ? '1' : '0'); syncAudioBtns(); e.currentTarget.blur();
  });
  $musicBtn.addEventListener('click', () => {
    musicOn = !musicOn; store.set('snake-music', musicOn ? '1' : '0'); syncAudioBtns(); $musicBtn.blur();
    if (musicOn && state === 'playing') musicStart(); else if (!musicOn) musicStop();
  });
  document.querySelectorAll('#pad button').forEach(b =>
    b.addEventListener('pointerdown', e => { e.preventDefault(); turn(b.dataset.dir); }));

  // glisser du doigt sur le plateau
  let tx = null, ty = null;
  $board.addEventListener('touchstart', e => { const p = e.touches[0]; tx = p.clientX; ty = p.clientY; }, { passive: true });
  $board.addEventListener('touchmove', e => { if (state === 'playing') e.preventDefault(); }, { passive: false });
  $board.addEventListener('touchend', e => {
    if (tx === null) return;
    const p = e.changedTouches[0];
    const dx = p.clientX - tx, dy = p.clientY - ty;
    tx = ty = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  startDemo();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
