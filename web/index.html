<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Escapade — Choisis ta prochaine destination</title>
<meta name="description" content="Explore le monde sur un globe 3D, du ciel jusqu'à la rue, et choisis ta prochaine destination de vacances.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div id="loading">
  <div class="load-mark"></div>
  <div class="load-word">Escapade</div>
  <div class="load-bar"><i></i></div>
  <div class="load-sub">Préparation du globe…</div>
</div>

<header class="topbar">
  <div class="searchbar glass">
    <span class="logo" aria-hidden="true"><span class="mark"></span><span class="word">Escapade</span></span>
    <span class="sep"></span>
    <span class="sicon" data-i="search"></span>
    <input id="q" placeholder="Où rêves-tu d’aller ?" autocomplete="off" spellcheck="false" aria-label="Rechercher un lieu">
    <kbd class="kbd">/</kbd>
  </div>
  <div class="sugg glass" id="sugg" role="listbox"></div>
</header>

<button class="favs-btn glass" id="bFavs" aria-label="Mes voyages"><span data-i="heart"></span><span class="lbl">Mes voyages</span><span class="count" id="favCount">0</span></button>

<div class="controls glass" role="toolbar" aria-label="Contrôles de la carte">
  <button class="cbtn" id="bGlobe" data-tip="Revenir au globe" aria-label="Revenir au globe" data-i="globe"></button>
  <button class="cbtn" id="b3d" data-tip="Vue 3D" aria-label="Vue 3D" data-i="cube"></button>
  <button class="cbtn" id="bRelief" data-tip="Relief des montagnes" aria-label="Relief" data-i="mountain"></button>
  <span class="cdiv"></span>
  <button class="cbtn" id="bSun" data-tip="Jour et nuit en temps réel" aria-label="Jour et nuit" data-i="daynight"></button>
  <button class="cbtn" id="bStyle" data-tip="Style de carte" aria-label="Style de carte" data-i="layers"></button>
</div>

<button class="surprise" id="bRandom" title="Destination au hasard (touche R)"><span data-i="sparkles"></span><span>Surprends-moi</span></button>

<div class="infochip glass" id="info"><span id="rPhase"></span><span id="rCoords">—</span><span class="dot"></span><span id="rAlt">—</span></div>
<div class="hint glass" id="hint"><span data-i="pin"></span>Clique n’importe où sur le globe pour découvrir un lieu</div>
<div class="hoverlabel" id="rPlace"></div>

<aside id="panel" aria-live="polite">
  <div class="grab" id="grab"></div>
  <button class="round close" id="pClose" aria-label="Fermer" data-i="close"></button>
  <div class="scroll" id="pBody"></div>
  <div class="actions" id="pActions"></div>
</aside>

<div id="viewer"><button class="round close" id="vClose" aria-label="Fermer" data-i="close"></button><button class="round nav prev" id="vPrev" aria-label="Précédente" data-i="back"></button><img id="vImg" alt=""><div class="cap" id="vCap"></div><button class="round nav next" id="vNext" aria-label="Suivante" data-i="next"></button></div>

<div id="favs"><div class="modal glass-strong">
  <button class="round close" id="fClose" aria-label="Fermer" data-i="close"></button>
  <header><h2>Mes voyages</h2><p>Tes coups de cœur et tes itinéraires, pour choisir où partir.</p></header>
  <div id="fBody"></div>
</div></div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
