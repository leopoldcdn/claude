 const wl=mk(RB(.28,.02,.14,.01),0x2a2250,-.0,0,.1),wr=mk(RB(.28,.02,.14,.01),0x2a2250,0,0,-.1);wl.geometry.translate(0,0,.12);wr.geometry.translate(0,0,-.12);
 const g=grp(mk(SPH(.1),0x2a2250),mk(new THREE.ConeGeometry(.04,.12,8).rotateZ(-Math.PI/2),0xffb050,.12,0,0),wl,wr);
 const b=body(g,x,y,-.2+(i%3)*.4,{th:8+i,r:.1,air:true,wing:[wl,wr]});birds.push(b)});
// feuille finale
const RINGS=[0,1,2].map(i=>{const m=new THREE.Mesh(new THREE.TorusGeometry(1,.035,8,72),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));m.position.set(MOUTH.x,MOUTH.y,1);scene.add(m);return m});
const leaf=mk(new THREE.SphereGeometry(.2,12,8),0x6ad68e,0,0,0,{emissive:0x2a8a50,emissiveIntensity:.5});leaf.scale.set(1.6,.2,.9);scene.add(leaf);

/* ============ SIMULATION ============ */
const NFR=Math.ceil(TOTAL*FPS)+2,NB=bodies.length;
const SNAP={x:new Float32Array(NFR*NB),y:new Float32Array(NFR*NB),a:new Float32Array(NFR*NB),s:new Float32Array(NFR*NB),f:new Float32Array(NFR)};
const tWall=(()=>{let t=T0+5*P+1.35;return t})();
(function simulate(){
  const dt=1/120;let flowAcc=0,prevF=0,G=6,wallIntact=true,ceilIntact=true;
  const rr=rng(99);
  bodies.forEach(b=>{b.x=b.hx;b.y=b.hy;b.vx=b.vy=0;b.a=0;b.wa=0;b.state='anch'});
  const steps=Math.floor(TOTAL/dt);
  for(let st=0;st<=steps;st++){
    const t=st*dt,br=breath(t),S=br.S,f=br.f;
    const exStart=f>0&&prevF<=0;prevF=f;
    flowAcc+=-f*Math.min(S,16)**.3*dt;
    wallIntact=PAN[0].state==='anch'||!PAN.some(p=>p.state!=='anch');
    wallIntact=PAN.every(p=>p.state==='anch');ceilIntact=CEILB.state==='anch';
    for(const b of bodies){
      if(b.state==='anch'){
        if(S>=b.th&&(b.air||Math.abs(f)>.15)){b.state='free';b.wa=(rr()-.5)*4*b.spin}
        continue}
      if(b.state==='in'){ if(exStart){b.state='free';b.x=MOUTH.x+.25;b.y=MOUTH.y;const sp=Math.min(14,5+Math.sqrt(S)*.8);const an=(rr()-.4)*.9;b.vx=Math.cos(an)*sp;b.vy=Math.sin(an)*sp+1;b.wa=(rr()-.5)*10;b.noSw=t+1.2} continue}
      const dx=b.x-MOUTH.x,dy=b.y-MOUTH.y,d=Math.hypot(dx,dy)+.001,g=1/(1+(d/8)**2);
      let mag=S*f*g/b.mass;const ux=dx/d,uy=dy/d;
      let ax=mag*ux,ay=mag*uy;
      if(f>0)ax+=mag*.35;
      if(f<0){const swl=clamp((br.k-6)/3)*.9,am=Math.abs(mag)*swl*.8;ax+=am*(-uy);ay+=am*ux}
      ay-=G*b.gf;
      b.vx+=ax*dt;b.vy+=ay*dt;
      const k=Math.exp(-.45*dt);b.vx*=k;b.vy*=k;
      const sp=Math.hypot(b.vx,b.vy);if(sp>24){b.vx*=24/sp;b.vy*=24/sp}
      b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=(b.wa+b.vx*.25)*dt;
      if(b.y<FL+b.r){b.y=FL+b.r;if(b.vy<0)b.vy=-b.vy*.35;b.vx*=Math.exp(-1.6*dt);b.wa*=.98}
      if(b.room){
        if(b.x<-2.8+b.r){b.x=-2.8+b.r;b.vx=Math.abs(b.vx)*.4}
        if(ceilIntact&&b.y>CEIL-b.r&&b.x<WALLX){b.y=CEIL-b.r;b.vy=-Math.abs(b.vy)*.4}
        if(wallIntact&&b.x>WALLX-b.r-.05&&b.x<WALLX+.5&&b.y<CEIL){b.x=WALLX-b.r-.05;b.vx=-Math.abs(b.vx)*.35}
      }
      if(b.sw&&f<0&&t>b.noSw&&d<.5){b.state='in';b.inS=t}
    }
    if(st%4===0){const i=st/4;if(i<NFR){SNAP.f[i]=flowAcc;for(let j=0;j<NB;j++){const b=bodies[j];SNAP.x[i*NB+j]=b.x;SNAP.y[i*NB+j]=b.y;SNAP.a[i*NB+j]=b.a;SNAP.s[i*NB+j]=b.state==='in'?0:(b.state==='anch'?1:2)}}}
  }
})();

/* ============ rendu d'une image ============ */
const hash=(n)=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
// traînées d'air
const NS=60,streaks=[];const stM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.5,depthWrite:false});
for(let i=0;i<NS;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(1,.035),stM.clone());m.position.z=.95;scene.add(m);streaks.push({m,th:(hash(i+1)-.5)*2.0+.05,ph:hash(i+9)})}
function frameState(t){
  const fi=clamp(t*FPS,0,NFR-2),i0=Math.floor(fi),fr=fi-i0;
  return{i0,fr,fi}}
function applyFrame(t){
  const {i0,fr}=frameState(t);const br=breath(t),S=br.S,f=br.f,lk=Math.log2(S)||0;
  const t1=t;
  for(let j=0;j<NB;j++){const b=bodies[j],o=b.obj;const a=i0*NB+j,c=a+NB;
    const st=SNAP.s[a],x=lerp(SNAP.x[a],SNAP.x[c],fr),y=lerp(SNAP.y[a],SNAP.y[c],fr),ang=lerp(SNAP.a[a],SNAP.a[c],fr);
    if(st===0||(b.city&&t<14.95)){o.visible=false;continue}o.visible=true;
    if(st===1){ // ancré : tremble avant de céder
      const q=Math.min(1,S/b.th),amp=q*q*.03*Math.abs(f);
      o.position.set(b.hx+Math.sin(t*61+b.ph)*amp,b.hy+Math.sin(t*53+b.ph*2)*amp*.6,b.hz);o.rotation.set(0,0,Math.sin(t*47+b.ph)*amp*.8);
      if(b.air){o.position.set(b.hx+Math.sin(t*.9+b.ph)*.6,b.hy+Math.sin(t*1.3+b.ph)*.25,b.hz);o.rotation.set(0,0,Math.sin(t*1.3+b.ph)*.1)}
    }else{o.position.set(x,y,b.hz);o.rotation.set(Math.sin(ang*.6)*.5,Math.cos(ang*.4)*.4,ang)}
    if(b.wing){const fl=Math.sin(t*(st===1?14:22)+b.ph)*.9;b.wing[0].rotation.x=fl;b.wing[1].rotation.x=-fl}
  }
  // personnage
  const vis=Math.min(1,.28+lk*.1);
  const inh=Math.max(0,-f),exh=Math.max(0,f);
  chest.scale.set(1+.09*vis*inh-.03*vis*exh,1+.03*vis*inh,1+.09*vis*inh);
  head.scale.set(1+.05*vis*exh,1+.03*vis*exh,1+.05*vis*exh);
  mouth.scale.set(.03+.05*vis*(inh+exh*.6),.025+.08*vis*inh+.03*vis*exh,.04);
  person.rotation.z=(-.05*inh+.06*exh)*vis*Math.min(1,lk/4);
  armL.rotation.z=.08+.4*vis*exh*Math.min(1,lk/5)*-1+.3*vis*inh*Math.min(1,lk/5);
  const wind=-f*Math.min(S,64)**.5*.12;
  scarf.forEach((m,i)=>{const k=i/7;m.position.set(-.12-.035*i+wind*k*k*1.6+Math.sin(t*5+i)*.01*Math.abs(f)*(1+lk),1.55-.13*i+Math.sin(t*2+i*.6)*.02,-.05)});
  // rideaux
  for(const c of[curL,curR]){const pos=c.geometry.attributes.position,base=c.userData.base;
    const side=c===curL?1:-1;
    for(let v=0;v<pos.count;v++){const bx=base[v*3],by=base[v*3+1];const h=clamp((.85-by)/1.7);
      const dxw=f*Math.min(S,48)**.5*.11*h*h*1.2;const fl=Math.sin(t*9+by*5+bx*3)*.02*Math.abs(f)*(1+lk*.4)*h;
      pos.setXYZ(v,bx+dxw+fl,by,base[v*3+2]+Math.sin(t*7+by*4)*.03*Math.abs(f)*h*(1+lk*.3))}
    pos.needsUpdate=true}
  // traînées d'air
  const F=SNAP.f[i0]*(1-fr)+SNAP.f[i0+1]*fr;
  const L=.3+1.1*Math.min(1,Math.abs(f)*1.0)*clamp(lk/5+.15);
  for(const s of streaks){
    const u=((s.ph+F*.22)%1+1)%1,r=.7+(1-u)*6;
    const th=s.th;const x=MOUTH.x+Math.cos(th)*r,y=MOUTH.y+Math.sin(th)*r;
    s.m.position.set(x,y,.95);s.m.rotation.z=th;s.m.scale.set(L,1,1);
    const inside=(x<WALLX&&y>FL&&y<CEIL)||t>15.15;s.m.material.opacity=(inside?1:0)*Math.min(.5,Math.abs(f)*.55*clamp((S-2)/6))*Math.sin(Math.PI*u)}
  // feuille
  const lt=clamp((t-30.6)/5.4);leaf.visible=t>30.6;
  leaf.position.set(-.6+Math.sin(lt*10)*.8*(1-lt)+lt*.0,lerp(6,FL+.03,lt*lt*.3+lt*.7),.4);leaf.rotation.set(0,lt*6,Math.sin(lt*10)*.8*(1-lt));
  // onde de choc finale + immeubles qui plient
  RINGS.forEach((m,i)=>{const u=(t-(T0+27+1.35+.28*i))/1.2;m.visible=u>0&&u<1;if(m.visible){m.scale.setScalar(.3+u*u*13);m.material.opacity=.7*(1-u)}});
  const bend=-f*.05*clamp((lk-8)/2);BUILD.forEach((m,i)=>{m.rotation.z=bend*(1+.2*(i%3))});
  // caméra
  const k1=rs(t,15.1,21.3);
  const D=lerp(20,36,k1),cx=lerp(0,2.2,k1),cy=lerp(0,2.7,k1);
  const shk=Math.min(1,S/48)*Math.abs(f)*.1*(D/20)*(t<T0+11*P?1:0);
  cam.position.set(cx+Math.sin(t*53)*shk,cy+Math.cos(t*47)*shk,D);cam.lookAt(cx+Math.sin(t*53)*shk,cy+Math.cos(t*47)*shk,0);
  $('sky').style.opacity=rs(t,15.1,20);GROUND.material.opacity=rs(t,15.2,19);GROUND.visible=t>15.1;CITY.visible=t>=14.95;
}
function dom(t){
  const br=breath(t);
  let k=Math.max(0,br.k);if(br.k>10)k=0;
  const col=k<=5?[lerp(92,255,k/5),lerp(225,209,k/5),lerp(230,102,k/5)]:[255,lerp(209,107,(k-5)/5),lerp(102,87,(k-5)/5)];
  const cn=$('cnt');
  const show=t>=0&&t<30.1;
  cn.style.opacity=show?1:clamp(1-(t-30.1)/.4);
  cn.textContent='×'+Math.pow(2,k);
  cn.style.color=`rgb(${col.map(Math.round).join(',')})`;
  const pulse=1+.22*Math.exp(-Math.max(0,br.ph)*5)*(br.k>=0?1:0);
  cn.style.transform=`scale(${pulse})`;
  $('lab').style.opacity=cn.style.opacity;
  $('cur').style.opacity=(Math.floor(t*2)%2)?0:1;
  const c=CH.find(c=>t>=c.a&&t<c.b);$('cap').textContent=c?c.g:'';
}
/* GSAP : mots-clés, fin de vidéo */
const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
function pop(id,a,b){tl.fromTo('#'+id,{opacity:0,y:26,scale:.92},{opacity:1,y:0,scale:1,duration:.4,ease:'back.out(1.6)'},a);tl.to('#'+id,{opacity:0,y:-16,duration:.25,ease:'power2.in'},b-.25)}
pop('k1',2.4,4.6);pop('k2',26.2,28.8);pop('k3',30.8,36.2);
tl.fromTo('#swish',{left:-700,opacity:1},{left:1300,duration:.6,ease:'power2.in'},END-.2);
tl.fromTo('#end',{opacity:0},{opacity:1,duration:.15,ease:'none'},END+.1);
tl.from('#end b',{y:40,opacity:0,duration:.5,ease:'back.out(1.6)'},END+.2).from('#end span',{y:30,opacity:0,duration:.5},END+.45);
tl.to({},{duration:.01},TOTAL);
window.seek=(t)=>{tl.seek(t,false);dom(t);applyFrame(t);renderer.render(scene,cam)};
window.TOTAL=TOTAL;
window.READY=true;
window.seek(COVER?12.9:0);
</script></body></html>
