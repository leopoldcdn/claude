<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La vie de Léa</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2) format('woff2'); }
  :root { --fg: #151935; --muted: #5f6589; --faint: #8d92b0; --line: #e0e3ef; --s2: #eef0f8; --accent: #4f46e5; --ok: #0c8a5f; --ok-soft: #e3f6ee; --warn: #b95a0b; --warn-soft: #fdf0e1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; color: var(--fg); background: #f4f5fb; }
  .h { opacity: 0; }
  svg { flex: none; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f4f5fb; }
  .bl { position: absolute; border-radius: 50%; }
  .abs { position: absolute; }

  /* Brand corner */
  #corner { position: absolute; left: 56px; top: 46px; display: flex; align-items: center; gap: 16px; opacity: 0; z-index: 20; }
  .logo { width: 58px; height: 58px; border-radius: 17px; background: linear-gradient(140deg, #4f46e5, #0ea5c6); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px #4f46e544; }
  .logo svg { width: 34px; height: 34px; }
  #corner b { font-size: 30px; font-weight: 800; letter-spacing: -0.8px; }

  /* Hook */
  #notif { position: absolute; left: 960px; top: 300px; width: 720px; margin-left: -360px; display: flex; align-items: center; gap: 22px; background: #fff; border-radius: 26px; padding: 24px 30px; box-shadow: 0 30px 80px rgba(21, 25, 53, .18); opacity: 0; z-index: 10; }
  #notif .ni { width: 64px; height: 64px; border-radius: 18px; background: #7c3aed; color: #fff; display: flex; align-items: center; justify-content: center; }
  #notif .ni svg { width: 34px; height: 34px; }
  #notif b { display: block; font-size: 30px; font-weight: 800; } #notif small { display: block; font-size: 22px; color: var(--faint); font-weight: 600; margin-top: 2px; }
  #kt { position: absolute; left: 0; right: 0; top: 700px; z-index: 30; text-align: center; }
  .capl { position: absolute; left: 50%; transform: translateX(-50%); opacity: 0; white-space: nowrap; font-size: 92px; background: #151935; padding: 8px 40px 18px; border-radius: 26px; box-shadow: 0 30px 70px rgba(21, 25, 53, .35); }
  .capl .w { display: inline-block; font-size: 92px; font-weight: 800; letter-spacing: -3px; color: #fff; }
  .capl .w b { color: #a5b4fc; }

  /* Léa's portrait */
  #lea { position: absolute; left: 960px; top: 470px; width: 300px; height: 300px; margin: -150px 0 0 -150px; z-index: 12; opacity: 0; }
  #lea svg { width: 100%; height: 100%; }

  /* The wheel as a clock */
  #wheel { position: absolute; left: 600px; top: 575px; width: 0; height: 0; z-index: 5; }
  .node { position: absolute; left: -42px; top: -42px; width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; opacity: 0; box-shadow: 0 0 0 5px #ffffffaa, 0 12px 26px rgba(21, 25, 53, .2); }
  .node svg { width: 36px; height: 36px; }
  .node .ck { position: absolute; top: -6px; right: -8px; width: 30px; height: 30px; border-radius: 50%; background: #10b981; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; transform: scale(0); color: #fff; }
  .node .ck svg { width: 15px; height: 15px; }
  #ring { position: absolute; left: -330px; top: -330px; width: 660px; height: 660px; opacity: 0; }
  #hand { position: absolute; left: -3px; top: -255px; width: 6px; height: 255px; border-radius: 3px; background: linear-gradient(180deg, #4f46e5, #4f46e500); transform-origin: 50% 100%; opacity: 0; }
  #hub { position: absolute; left: -150px; top: -150px; width: 300px; height: 300px; border-radius: 50%; background: linear-gradient(150deg, #4f46e5, #0ea5c6); box-shadow: 0 0 0 16px #ffffff99, 0 40px 90px #4f46e555; transform: scale(0); color: #fff; text-align: center; }
  #hub .nm { position: absolute; left: 0; right: 0; top: 196px; font-size: 26px; font-weight: 800; }
  #hub .yr { position: absolute; left: 0; right: 0; top: 230px; font-size: 22px; font-weight: 700; color: #c7d2fe; font-variant-numeric: tabular-nums; }

  /* Moment cards */
  .mc { position: absolute; left: 1060px; top: 560px; width: 800px; background: #fff; border-radius: 30px; box-shadow: 0 40px 100px rgba(21, 25, 53, .16); padding: 38px 44px; opacity: 0; z-index: 8; }
  .mh { display: flex; align-items: center; gap: 14px; }
  .mh .ri { width: 50px; height: 50px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; }
  .mh .ri svg { width: 26px; height: 26px; }
  .mh .rn { font-size: 21px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  .mh .yr { margin-left: auto; font-size: 22px; font-weight: 800; color: var(--muted); background: var(--s2); padding: 8px 18px; border-radius: 99px; }
  .mc h2 { font-size: 62px; font-weight: 800; letter-spacing: -2px; line-height: 1.08; margin-top: 28px; }
  .mc h2 b { color: var(--accent); }
  .mb { margin-top: 34px; position: relative; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 99px; font-size: 24px; font-weight: 700; white-space: nowrap; }
  .pill svg { width: 20px; height: 20px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.acc { background: #ebeafd; color: var(--accent); }
  .row { display: flex; align-items: center; gap: 16px; height: 74px; border-top: 1px solid #eef0f8; font-size: 29px; font-weight: 600; }
  .row .pill { margin-left: auto; }
  .uicard { position: relative; display: flex; align-items: center; gap: 18px; background: var(--s2); border-radius: 20px; padding: 18px 22px; }
  .uicard b { display: block; font-size: 30px; } .uicard small { display: block; font-size: 22px; color: var(--faint); font-weight: 600; }
  .av { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; flex: none; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal i { height: 60px; border-radius: 10px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 18px; font-weight: 700; color: var(--muted); }
  .big { font-size: 110px; font-weight: 800; letter-spacing: -4px; line-height: 1; }
  .stars { display: flex; gap: 10px; }
  .stars svg { width: 84px; height: 84px; color: #e0e3ef; }
  .confetti i { position: absolute; width: 14px; height: 22px; border-radius: 3px; opacity: 0; }

  /* Ending */
  #end { position: absolute; inset: 0; z-index: 40; opacity: 0; text-align: center; background: radial-gradient(circle at 25% 15%, #6366f133 0%, #6366f100 45%), radial-gradient(circle at 85% 90%, #06b6d433 0%, #06b6d400 45%), #f4f5fb; padding-top: 150px; }
  #end .hl { font-size: 64px; font-weight: 800; letter-spacing: -2px; line-height: 1.1; opacity: 0; }
  #end .hl b { color: var(--accent); }
  #end .lg2 { width: 120px; height: 120px; border-radius: 34px; margin: 46px auto 0; background: linear-gradient(140deg, #4f46e5, #0ea5c6); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 26px 60px #4f46e555; }
  #end .lg2 svg { width: 70px; height: 70px; }
  #end .nm { font-size: 120px; font-weight: 800; letter-spacing: -4px; line-height: 1.05; margin-top: 6px; }
  #end .nm span { display: inline-block; opacity: 0; }
  #end .tg { font-size: 32px; font-weight: 600; color: var(--muted); margin-top: 4px; opacity: 0; }
  #end .tg b { color: var(--accent); }
  #end .btn { display: inline-block; margin-top: 34px; font-size: 36px; font-weight: 800; color: #fff; background: linear-gradient(120deg, #4f46e5, #6366f1); padding: 22px 48px; border-radius: 22px; box-shadow: 0 24px 60px #4f46e566; opacity: 0; }
  #end .ur { font-size: 28px; font-weight: 700; color: var(--accent); margin-top: 20px; opacity: 0; }
  #teamo { position: absolute; left: 0; top: 0; width: 150px; height: 150px; margin: -75px 0 0 -75px; z-index: 45; opacity: 0; filter: drop-shadow(0 16px 26px #4f46e555); }
  #teamo svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage">
  <div class="bl" style="left:-500px;top:-520px;width:1400px;height:1400px;background:radial-gradient(circle,#6366f14d 0%,#6366f100 65%)"></div>
  <div class="bl" style="right:-480px;top:-420px;width:1300px;height:1300px;background:radial-gradient(circle,#ec48993d 0%,#ec489900 65%)"></div>
  <div class="bl" style="left:300px;bottom:-760px;width:1500px;height:1500px;background:radial-gradient(circle,#06b6d43d 0%,#06b6d400 65%)"></div>

  <div id="corner"><div class="logo"></div><b>Teamora</b></div>
  <div id="notif"><div class="ni"></div><div><b>Nouvelle candidature</b><small>Léa Martin · UX Designer</small></div></div>

  <div id="wheel"><svg id="ring" viewBox="0 0 660 660"><circle cx="330" cy="330" r="310" fill="none" stroke="#e0e3ef" stroke-width="6"/><circle id="prog" cx="330" cy="330" r="310" fill="none" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" transform="rotate(-90 330 330)"/>
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#0ea5c6"/></linearGradient></defs></svg>
    <div id="nodes"></div><div id="hand"></div>
    <div id="hub"><div class="nm">Léa Martin</div><div class="yr" id="yr">2024</div></div>
  </div>
  <div id="lea"></div>
  <div id="cards"></div>
  <div id="kt"></div>

  <div id="end"><div class="hl">Chaque étape d’une vie au travail.<br><b>Un seul logiciel.</b></div><div class="lg2"></div><div class="nm" data-split>Teamora</div>
    <div class="tg">L’ERP repensé pour <b>suivre la vie de vos collaborateurs</b></div><div class="btn">Réservez votre démo gratuite →</div><div class="ur">teamora.app</div></div>
  <div id="teamo"></div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const P = {
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.6-.4 4.4 1.2 5 4.3"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  docCheck: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 16l2.5 2 5-5"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  euro: '<path d="M17 6.5A6.5 6.5 0 1 0 17 17.5"/><path d="M4 10.5h9M4 13.5h9"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  cap: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  heart: '<path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>',
  door: '<path d="M14 3H6v18h8"/><path d="M14 3l6 2v16l-6-2z"/><path d="M10 12h.01"/>',
  check: '<path d="M5 12l5 5 9-10"/>', file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  badge: '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="2.5"/><path d="M9 16h6"/>',
  up: '<path d="M12 19V5M5 12l7-7 7 7"/>', home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
};
const ic = (n, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const CHK = ic('check', 3.2);
const RUB = [['Besoin RH', 'target', '#6366f1'], ['Recrutement', 'search', '#7c3aed'], ['Arrivées', 'docCheck', '#a855f7'], ['Vie administrative', 'folder', '#e11d48'],
  ['Temps & absences', 'clock', '#ea580c'], ['Rémunération', 'euro', '#d97706'], ['Performance', 'star', '#ca8a04'], ['Formation', 'cap', '#65a30d'],
  ['Mobilité', 'trend', '#16a34a'], ['Santé & QVT', 'heart', '#059669'], ['Relations indiv.', 'chat', '#0d9488'], ['Départs', 'door', '#0891b2']];
const $ = (s) => document.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const md = (s) => s.replace(/\*([^*]*)\*?/g, '<b>$1</b>');
const pill = (t, k) => `<span class="pill ${k}">${k === 'ok' ? ic('check', 3) : ''}${t}</span>`;
// Léa : a flat portrait ; glasses and lanyard appear as the years go by
const LEA = (id, extra = '') => `<svg viewBox="0 0 120 120"><defs><clipPath id="${id}"><circle cx="60" cy="60" r="60"/></clipPath></defs><g clip-path="url(#${id})">
  <rect width="120" height="120" fill="#e0e7ff"/><path d="M14 124c4-26 22-38 46-38s42 12 46 38z" fill="#7c3aed"/><rect x="51" y="70" width="18" height="20" rx="8" fill="#e8b48f"/>
  <path d="M28 64c-4-28 10-46 32-46s36 18 32 46c-2 14-6 26-10 30H38c-4-4-8-16-10-30z" fill="#3b2a20"/>
  <ellipse cx="60" cy="56" rx="21" ry="25" fill="#f2c7a5"/><path d="M38 50c4-16 14-22 24-22 12 0 20 8 22 20-10-2-20-8-24-14-4 8-12 14-22 16z" fill="#3b2a20"/>
  <circle cx="52" cy="57" r="2.6" fill="#1e1b4b"/><circle cx="68" cy="57" r="2.6" fill="#1e1b4b"/><path d="M53 68c4 4 10 4 14 0" stroke="#b45309" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="46" cy="64" r="3.5" fill="#f9a8d4" opacity=".7"/><circle cx="74" cy="64" r="3.5" fill="#f9a8d4" opacity=".7"/>
  <g class="glasses" opacity="0"><circle cx="52" cy="57" r="7" fill="none" stroke="#1e1b4b" stroke-width="2.2"/><circle cx="68" cy="57" r="7" fill="none" stroke="#1e1b4b" stroke-width="2.2"/><path d="M59 57h2" stroke="#1e1b4b" stroke-width="2.2"/></g>
  <g class="lanyard" opacity="0"><path d="M48 88l12 20 12-20" stroke="#0ea5c6" stroke-width="4" fill="none"/><rect x="53" y="104" width="14" height="16" rx="2" fill="#fff" stroke="#0ea5c6" stroke-width="2"/></g></g></svg>`;
const TEAMO = (id) => `<svg viewBox="0 0 64 64"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5c6"/></linearGradient></defs>
  <circle cx="32" cy="32" r="32" fill="url(#${id})"/><path d="M32 10.5v5.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="32" cy="9" r="3.4" fill="#fde68a"/>
  <path d="M13.5 31c0-8.3 7.6-14.5 18.5-14.5S50.5 22.7 50.5 31v5c0 8.3-7.6 13.5-18.5 13.5h-5.6l-7.6 5.6 1.7-7C15.6 45.6 13.5 41.6 13.5 36z" fill="#fff"/>
  <ellipse cx="25" cy="32.5" rx="3.1" ry="3.7" fill="#1e1b4b"/><ellipse cx="39" cy="32.5" rx="3.1" ry="3.7" fill="#1e1b4b"/>
  <path d="M26.5 40.2c3.2 3 7.8 3 11 0" stroke="#1e1b4b" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;

// ================= Build =================
$('#corner .logo').innerHTML = ic('users', 2.2);
$('#end .lg2').innerHTML = ic('users', 2);
$('#notif .ni').innerHTML = ic('search', 2.2);
$('#lea').innerHTML = LEA('lc0');
$('#teamo').innerHTML = TEAMO('tg');
const R = 310, ang = (i) => (-90 + i * 30) * Math.PI / 180, pos = (i) => ({ x: Math.cos(ang(i)) * R, y: Math.sin(ang(i)) * R });
$('#nodes').innerHTML = RUB.map((r, i) => `<div class="node" id="n${i}" style="background:${r[2]}">${ic(r[1])}<span class="ck">${CHK}</span></div>`).join('');
const C = 2 * Math.PI * 310; $('#prog').setAttribute('stroke-dasharray', C); $('#prog').setAttribute('stroke-dashoffset', C);
$$('[data-split]').forEach((el) => { el.innerHTML = [...el.textContent].map((c) => `<span>${c}</span>`).join(''); });

// The moments of Léa's working life : [rubric, date, title, body html]
const MOM = [
  [0, 'Mars 2024', 'L’équipe Design recrute<br><b>une UX designer.</b>', `<div class="row" style="border:0">${pill('Demande', 'ok')} ${pill('RH', 'ok')} ${pill('Direction', 'ok')} ${pill('Offre publiée', 'acc')}</div>`],
  [1, 'Avril 2024', 'Léa postule.<br><b>Et dit oui.</b>', `<div class="uicard"><div class="av">${LEA('lc1')}</div><div><b>Léa Martin</b><small>UX Designer · ★ 4,8</small></div><span class="pill warn m-a" style="margin-left:auto">Proposition envoyée</span><span class="pill ok m-b h" style="position:absolute;right:22px">${CHK}Acceptée</span></div>`],
  [2, 'Nov. 2024', 'Premier jour.<br><b>Tout est prêt.</b>', ['Contrat signé', 'DPAE déclarée', 'Badge et PC prêts'].map((t) => `<div class="row m-r">${ic('check', 2.6).replace('<svg', '<svg style="width:28px;height:28px;color:#10b981"')}${t}${pill('Fait', 'ok')}</div>`).join('')],
  // [3] déménagement, [7] formation, [10] télétravail : ticked on the wheel without a card
  [3, 'Févr. 2025', 'Elle déménage.<br><b>Une demande, c’est réglé.</b>', `<div class="uicard"><div>${ic('home').replace('<svg', '<svg style="width:44px;height:44px;color:#e11d48"')}</div><div><b>18 rue des Martyrs, Paris</b><small>justificatif joint</small></div><span class="pill ok m-b h" style="margin-left:auto">${CHK}Validé</span></div>`],
  [4, 'Août 2025', 'Ses premières vacances,<br><b>validées en un clic.</b>', `<div class="cal">${Array.from({ length: 14 }, (_, k) => `<i class="${k >= 3 && k < 10 ? 'm-d' : ''}">${k + 1}</i>`).join('')}</div>`],
  [5, 'Janv. 2026', 'Sa première <b>augmentation.</b>', `<div style="display:flex;align-items:center;gap:26px"><span class="big" style="color:#d97706">+5 %</span><div class="uicard" style="flex:1"><div>${ic('file').replace('<svg', '<svg style="width:40px;height:40px;color:#d97706"')}</div><div><b>Bulletin de janvier</b><small>diffusé · avenant signé</small></div></div></div>`],
  [6, 'Déc. 2026', 'Entretien annuel :<br><b>objectifs dépassés.</b>', `<div class="stars">${Array.from({ length: 5 }, () => ic('star', 2).replace('stroke="currentColor"', 'stroke="currentColor" fill="currentColor"')).join('')}</div>`],
  [7, 'Mars 2027', 'Formée au <b>management.</b>', `<div class="uicard"><div>${ic('cap').replace('<svg', '<svg style="width:44px;height:44px;color:#65a30d"')}</div><div><b>Manager une équipe design</b><small>21 h · financée par l’OPCO</small></div>${pill('Validée', 'ok')}</div>`],
  [8, 'Sept. 2028', 'Léa devient<br><b>Lead Designer.</b>', `<div style="display:flex;align-items:center;gap:22px"><span style="width:84px;height:84px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center">${ic('up', 2.6).replace('<svg', '<svg style="width:44px;height:44px"')}</span><div><b style="font-size:34px;display:block">UX Designer → Lead Designer</b><small style="font-size:21px;color:var(--faint);font-weight:600">avenant généré automatiquement</small></div></div>`],
  [9, 'Mai 2029', 'Un bébé.<br><b>Un retour en douceur.</b>', `<div class="row m-r" style="border:0">${ic('heart', 2.4).replace('<svg', '<svg style="width:30px;height:30px;color:#059669"')}Congé maternité${pill('Suivi', 'ok')}</div><div class="row m-r">${ic('check', 2.6).replace('<svg', '<svg style="width:28px;height:28px;color:#059669"')}Reprise à 4/5, poste aménagé${pill('Accordé', 'ok')}</div>`],
  [10, 'Oct. 2030', 'Télétravail 3 jours ?<br><b>Demande tracée, accordée.</b>', `<div class="uicard"><div>${ic('chat').replace('<svg', '<svg style="width:40px;height:40px;color:#0d9488"')}</div><div><b>Échange RH · Léa Martin</b><small>réponse sous 48 h</small></div>${pill('Accordé', 'ok')}</div>`],
  [11, 'Juin 2031', 'Léa part lancer<br><b>son propre studio.</b>', `<div class="confetti" style="position:absolute;left:0;right:0;top:-400px">${Array.from({ length: 18 }, (_, k) => `<i style="left:${40 + k * 36}px;top:0;background:${RUB[k % 12][2]}"></i>`).join('')}</div><div class="row" style="border:0;margin-top:60px">${ic('check', 2.6).replace('<svg', '<svg style="width:28px;height:28px;color:#0891b2"')}Pot de départ · documents de sortie${pill('Prêts', 'ok')}</div>`],
];
const _c = 0; $('#cards').innerHTML = MOM.map(([i, d, t, b], k) => `<div class="mc" id="m${k}"><div class="mh"><span class="ri" style="background:${RUB[i][2]}">${ic(RUB[i][1])}</span><span class="rn" style="color:${RUB[i][2]}">${RUB[i][0]}</span><span class="yr">${d}</span></div><h2>${t}</h2><div class="mb">${b}</div></div>`).join('')
  + `<div class="mc" id="mB"><div class="mh"><span class="ri" style="background:#7c3aed">${ic('search')}</span><span class="rn" style="color:#7c3aed">Recrutement</span><span class="yr">Mars 2033</span></div><h2>Un poste de directrice design s’ouvre…<br><b>Léa revient.</b></h2>
    <div class="mb"><div class="uicard"><div class="av">${LEA('lc2')}</div><div><b>Léa Martin</b><small>ancienne collaboratrice · réseau alumni</small></div>${pill('Candidature reçue', 'acc')}</div></div></div>`;

gsap.set('.mc', { yPercent: -50 });
// ================= Timeline =================
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out', immediateRender: false } });
const show = (t, sel, from = { y: 20 }, d = 0.4, extra = {}) => tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, y: 0, x: 0, scale: 1, duration: d, ...extra }, t);
const hide = (t, sel, d = 0.2, to = {}) => tl.to(sel, { opacity: 0, duration: d, ease: 'power2.in', ...to }, t);
function caption(t0, t1, text) {
  const box = document.createElement('div'); box.className = 'capl';
  box.innerHTML = md(text).split(/(<b>.*?<\/b>| )/).filter((w) => w && w !== ' ').map((w) => `<span class="w">${w}</span>`).join(' ');
  $('#kt').appendChild(box);
  tl.set(box, { opacity: 1 }, t0).fromTo(box.querySelectorAll('.w'), { opacity: 0, y: 36, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, stagger: 0.06, ease: 'back.out(2.2)' }, t0)
    .to(box, { opacity: 0, y: -16, duration: 0.18, ease: 'power2.in' }, t1);
}
const setText = (t, sel, v) => tl.to({}, { duration: 0.01, onComplete: () => { $(sel).textContent = v; } }, t);

// ---- 0 → 3.4 : hook ----
show(0.15, '#notif', { y: 40, scale: 0.85 }, 0.4, { ease: 'back.out(1.8)' });
tl.fromTo('#lea', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(1.7)' }, 0.75);
tl.to('#notif', { y: -40, opacity: 0, duration: 0.3, ease: 'power2.in' }, 0.75);
caption(0.9, 1.95, 'Voici *Léa.*');
caption(2.05, 3.35, 'Sa vie au travail, *en 30 secondes.*');
// ---- 3.4 → 4.5 : Léa takes her place in the hub, the wheel opens (Teamora) ----
tl.to("#lea", { left: 600, top: 535, scale: 0.42, duration: 0.55, ease: 'power3.inOut' }, 3.35);
tl.fromTo('#hub', { scale: 0 }, { scale: 1, duration: 0.55, ease: 'back.out(1.6)' }, 3.45);
show(3.6, '#corner', { x: -30 }, 0.4);
tl.set('#ring', { opacity: 1 }, 3.9);
RUB.forEach((r, i) => { const p = pos(i); tl.fromTo(`#n${i}`, { x: 0, y: 0, scale: 0.4, opacity: 0 }, { x: p.x, y: p.y, scale: 1, opacity: 0.35, duration: 0.6, ease: 'back.out(1.5)' }, 3.85 + i * 0.035); });
tl.fromTo('#ring', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.9);
tl.fromTo('#hand', { opacity: 0, rotation: 0 }, { opacity: 1, duration: 0.25 }, 4.3);

// ---- 4.5 → 24.6 : the hand sweeps the wheel, one moment per rubric ----
// Steps of the hand : a card for the strong moments, a quick tick for the others (readability first)
const STEPS = [[0, 0, 2.1], [1, 1, 2.2], [2, 2, 2.2], [3, -1, 0.3], [4, 4, 2.1], [5, 5, 2.0], [6, 6, 2.0], [7, -1, 0.3], [8, 8, 2.1], [9, 9, 2.2], [10, -1, 0.3], [11, 11, 2.3]];
const YEAR = [2024, 2024, 2024, 2025, 2025, 2026, 2026, 2027, 2028, 2029, 2030, 2031];
const START = []; { let s = 4.45; STEPS.forEach(([, , d]) => { START.push(s); s += d; }); }
const prog = { a: 0 }; const setProg = () => { $('#prog').setAttribute('stroke-dashoffset', C * (1 - prog.a / 360)); };
STEPS.forEach(([i, k, d], n) => {
  const s = START[n], quick = k < 0, mv = quick ? 0.22 : 0.3;
  tl.to('#hand', { rotation: i * 30, duration: mv, ease: 'power2.inOut' }, s);
  tl.to(prog, { a: i * 30 + 0.01, duration: mv, ease: 'power2.inOut', onUpdate: setProg, onComplete: setProg }, s);
  setText(s + 0.15, '#yr', YEAR[i]);
  if (quick) {
    tl.to(`#n${i}`, { opacity: 1, duration: 0.15 }, s + 0.1).to(`#n${i} .ck`, { scale: 1, duration: 0.25, ease: 'back.out(3)' }, s + 0.15);
    return;
  }
  const m = `#m${k}`;
  tl.to(`#n${i}`, { opacity: 1, scale: 1.25, boxShadow: `0 0 0 8px ${RUB[i][2]}44, 0 14px 36px ${RUB[i][2]}aa`, duration: 0.22 }, s + 0.18)
    .to(`#n${i}`, { scale: 1, boxShadow: '0 0 0 5px #ffffffaa, 0 12px 26px rgba(21,25,53,.2)', duration: 0.25 }, s + d - 0.25)
    .to(`#n${i} .ck`, { scale: 1, duration: 0.3, ease: 'back.out(3)' }, s + d - 0.25);
  tl.fromTo(m, { opacity: 0, x: 120, rotationY: -22, transformPerspective: 1600 }, { opacity: 1, x: 0, rotationY: 0, duration: 0.28, ease: 'power3.out' }, s + 0.04);
  tl.fromTo(`${m} h2`, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.25 }, s + 0.08);
  tl.fromTo(`${m} .mb`, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.25 }, s + 0.16);
  tl.to(m, { opacity: 0, x: -50, duration: 0.14, ease: 'power2.in' }, s + d - 0.14);
});
const ST = (k) => START[STEPS.findIndex((x) => x[1] === k)];
// per-moment touches
tl.to('#m1 .m-a', { opacity: 0, duration: 0.12 }, ST(1) + 0.75); show(ST(1) + 0.8, '#m1 .m-b', { scale: 0.6 }, 0.3, { ease: 'back.out(2.5)' });
$$('#m2 .m-r').forEach((r, k) => show(ST(2) + 0.3 + k * 0.18, r, { x: -20 }, 0.25));
tl.to('#lea .lanyard', { opacity: 1, duration: 0.3 }, ST(2) + 0.5);
$$('#m4 .m-d').forEach((c, k) => tl.to(c, { backgroundColor: '#ea580c', color: '#fff', duration: 0.1 }, ST(4) + 0.35 + k * 0.05));
tl.fromTo('#m5 .big', { scale: 0.5 }, { scale: 1, duration: 0.4, ease: 'back.out(2.5)' }, ST(5) + 0.25);
$$('#m6 .stars svg').forEach((sv, k) => { const t = ST(6) + 0.3 + k * 0.09; tl.to(sv, { color: '#eab308', duration: 0.1 }, t).fromTo(sv, { scale: 1 }, { scale: 1.25, duration: 0.1, yoyo: true, repeat: 1 }, t); });
tl.to('#lea .glasses', { opacity: 1, duration: 0.3 }, ST(6) + 1.2);
$$('#m9 .m-r').forEach((r, k) => show(ST(9) + 0.3 + k * 0.25, r, { x: -20 }, 0.25));
$$('#m11 .confetti i').forEach((c, k) => tl.fromTo(c, { opacity: 1, y: -10, rotation: 0 }, { y: 40 + (k % 4) * 15, rotation: (k % 2 ? 1 : -1) * 220, opacity: 0, duration: 1.4, ease: 'power1.in' }, ST(11) + 0.3 + (k % 6) * 0.04));
tl.to('#lea', { scale: 0.42, duration: 0.01 }, START[0]);

// ---- 24.6 → 26.9 : the loop closes — Léa comes back ----
const B = START[11] + STEPS[11][2];
tl.to('#hand', { rotation: 360 + 30, duration: 0.55, ease: 'power2.inOut' }, B);
tl.to(prog, { a: 360, duration: 0.45, ease: 'power2.inOut', onUpdate: setProg, onComplete: setProg }, B);
setText(B + 0.3, '#yr', 2033);
tl.to('#n1', { scale: 1.3, boxShadow: '0 0 0 10px #7c3aed44, 0 14px 40px #7c3aedaa', duration: 0.3 }, B + 0.4);
tl.fromTo('#mB', { opacity: 0, x: 140, rotationY: -25, transformPerspective: 1600 }, { opacity: 1, x: 0, rotationY: 0, duration: 0.45 }, B + 0.15);
tl.fromTo('#mB h2', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35 }, B + 0.25).fromTo('#mB .mb', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35 }, B + 0.4);

// ---- E → 30 : the promise and the call to action ----
tl.set('#end', { opacity: 1 }, E).fromTo('#end', { opacity: 0 }, { opacity: 1, duration: 0.3 }, E);

tl.fromTo('#end .lg2', { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.5, ease: 'back.out(1.8)' }, E + 0.6);
tl.fromTo('#end .nm span', { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.035, ease: 'back.out(1.6)' }, E + 0.75);
show(E + 1.15, '#end .tg', { y: 14 }, 0.35);
show(E + 1.4, '#end .btn', { y: 20, scale: 0.8 }, 0.4, { ease: 'back.out(2)' });
show(E + 1.65, '#end .ur', {}, 0.35);
tl.to('#end .btn', { scale: 1.05, duration: 0.3, yoyo: true, repeat: 3, ease: 'sine.inOut' }, E + 1.9);
tl.set('#teamo', { x: 1075, y: 395, scale: 0, opacity: 1 }, E + 0.8).to('#teamo', { scale: 0.55, duration: 0.45, ease: 'back.out(2)' }, E + 0.8)
  .to('#teamo', { rotation: 12, duration: 0.16, yoyo: true, repeat: 5, ease: 'sine.inOut' }, E + 1.3);
tl.to({}, { duration: 0.01 }, 30);
window.TIMES = { START, STEPS, B, E };
window.tl = tl;
window.ready = document.fonts.ready.then(() => true);
</script>
