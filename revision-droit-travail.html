[5,`Des propos racistes tenus au repas de fin d'année de l'entreprise peuvent-ils être sanctionnés ?`,[`Non, c'est la vie privée`,`Oui, l'événement se rattache à la vie de l'entreprise`,`Seulement s'ils sont filmés`,`Seulement si une plainte est déposée`],1,`Un événement organisé par l'entreprise ou entre collègues à ce titre se rattache à la vie professionnelle.`],
[5,`La vidéosurveillance du parking, installée contre les vols, peut-elle servir contre un salarié ?`,[`Oui, sans condition`,`Non, jamais`,`Oui si les salariés ont été informés et le CSE consulté ; à défaut la preuve est illicite et son admission incertaine`,`Seulement avec l'accord du salarié filmé`],2,`Le parking est accessible aux salariés : il faut information et consultation. Une preuve illicite peut parfois être admise si elle est indispensable et proportionnée, mais c'est un risque.`],
[2,`Un salarié recruté à 62 ans refuse de partir à la retraite. L'employeur peut l'y contraindre…`,[`À 64 ans`,`À 67 ans`,`À 70 ans`,`Jamais`],2,`Mise à la retraite d'office à 70 ans seulement. Le contrat de valorisation de l'expérience permet de l'anticiper au taux plein.`],
[11,`Doit-on former les salariés âgés comme les plus jeunes ?`,[`Non, ce n'est pas rentable`,`Oui : obligation d'adaptation pour tous et interdiction de discriminer selon l'âge`,`Seulement jusqu'à 60 ans`,`Seulement s'ils le demandent`],1,`L6321-1 ne distingue pas selon l'âge, et le plan de développement des compétences doit respecter la non-discrimination.`],
[11,`Une salariée demande un congé de transition professionnelle pour une formation de 8 mois. Délai de prévenance ?`,[`30 jours`,`60 jours`,`120 jours`,`6 mois`],2,`120 jours pour une formation de 6 mois et plus ; 60 jours en dessous.`],
[11,`L'employeur peut-il refuser un congé de transition professionnelle ?`,[`Oui, librement`,`Non, il peut seulement en différer le départ`,`Oui, après avis du CSE`,`Oui, si la formation est sans rapport avec le poste`],1,`Si les conditions sont réunies, seul le report est possible (raisons de service, effectifs absents).`],
[1,`Un accord d'entreprise est signé par un seul syndicat ayant obtenu 35 % des suffrages. Est-il valable ?`,[`Oui, directement`,`Oui, s'il est approuvé par référendum à la majorité`,`Non, jamais`,`Oui, sauf opposition à 50 %`],1,`Entre 30 % et 50 %, l'accord doit être validé par les salariés.`],
[1,`Un accord d'entreprise fixe une prime de vacances inférieure à celle de la convention de branche. Lequel s'applique ?`,[`La branche, plus favorable`,`L'accord d'entreprise`,`Le plus récent`,`Au choix du salarié`],1,`Les primes (hors travaux dangereux) relèvent du bloc 3 : l'accord d'entreprise prime, même moins favorable.`],
[1,`Un accord d'entreprise fixe un salaire minimum inférieur au minimum hiérarchique de branche. Valable ?`,[`Oui, bloc 3`,`Non, bloc 1 : la branche s'impose`,`Oui avec référendum`,`Oui si la branche ne l'interdit pas`],1,`Les salaires minima hiérarchiques sont la première matière du bloc 1.`],
[1,`Le contrat prévoit un 13e mois ; un nouvel accord d'entreprise (hors APC) le supprime. Le salarié…`,[`Le perd`,`Le conserve : le contrat plus favorable s'applique`,`Le conserve 12 mois`,`Le perd après 3 mois de préavis`],1,`Un accord collectif ne modifie pas le contrat de travail ; l'avantage contractuel demeure.`],
[1,`Une entreprise mécontente veut « dénoncer » la convention de branche. Elle…`,[`Le peut avec 3 mois de préavis`,`Ne le peut pas : seuls les signataires peuvent dénoncer`,`Le peut par référendum`,`Le peut avec l'accord du CSE`],1,`Cas 3 du cours. L'entreprise peut en revanche négocier son propre accord dans le bloc 3.`],
[1,`Lors d'une négociation, un syndicat représentatif n'a pas été convoqué. Conséquence ?`,[`Aucune s'il n'aurait pas signé`,`La négociation est irrégulière : tous les syndicats représentatifs doivent être convoqués`,`L'accord est valable à 30 %`,`Il suffit de l'informer après`],1,`Toutes les organisations représentatives sont convoquées, sous peine de discrimination. Leur présence, elle, n'est pas exigée.`],
[10,`Des salariés ralentissent volontairement la cadence pour obtenir une prime. Est-ce une grève ?`,[`Oui, grève perlée licite`,`Non : la grève suppose un arrêt total du travail`,`Oui s'ils préviennent 5 jours avant`,`Oui s'ils sont syndiqués`],1,`Sans cessation totale, c'est une exécution fautive du contrat, sanctionnable.`],
[10,`Pendant la grève, l'employeur recourt à l'intérim pour remplacer les grévistes. C'est…`,[`Licite`,`Interdit`,`Licite avec l'accord du CSE`,`Licite après 8 jours`],1,`Ni CDD ni intérim. Il peut réaffecter des non-grévistes ou sous-traiter.`],
[10,`Un gréviste est licencié pour avoir participé au mouvement, sans autre grief. Le licenciement est…`,[`Sans cause réelle et sérieuse`,`Nul de plein droit`,`Valable`,`Irrégulier en la forme`],1,`Seule la faute lourde permet de licencier un gréviste.`],
[2,`L'employeur met fin unilatéralement au télétravail prévu au contrat. Le salarié…`,[`Doit s'y plier`,`Peut refuser : c'est une modification du contrat`,`Est réputé démissionnaire s'il refuse`,`Doit saisir le CSE`],1,`La fin du télétravail contractualisé modifie le contrat, sauf période probatoire ou fin de circonstances exceptionnelles.`]
];
/* ===== CAS PRATIQUE GVC : corrigé guidé =====
   q: question · th: thèmes · pb: problème de droit · r: règle · a: application · c: conclusion · hc: point hors cours */
const CAS_INTRO = `La <b>SA GVC</b> fabrique et commercialise des tissus d'ameublement, des vêtements et des chaussures. Usines au Portugal et au Maroc, usine de maroquinerie à <b>Versailles</b> (78), usine de tissus d'ameublement à <b>Pessac</b> (33). Siège à Paris. <b>280 salariés</b> en France, un CSE et des délégués syndicaux désignés pour l'ensemble de l'entreprise.`;

const CAS = [
{id:'I', t:'Absorption d\'ASV et fermeture de Millau', ctx:`GVC absorbe la <b>SARL ASV</b>, qui disparaît en tant que personne juridique. ASV réalise des vêtements en cuir à <b>Millau</b> (12), connaît des difficultés et doit monter en gamme. Elle emploie <b>68 salariés</b> et dispose d'un CSE.`, qs:[
 {id:'I1', th:[8], q:`Faut-il suivre une procédure particulière à l'égard des salariés d'ASV du fait de l'absorption ?`,
  pb:`Quel est le sort des contrats de travail lorsque l'employeur disparaît par fusion-absorption ?`,
  r:`<b>L1224-1</b> : en cas de modification de la situation juridique de l'employeur, « notamment par […] fusion », tous les contrats en cours subsistent avec le nouvel employeur. Condition : transfert d'une <b>entité économique autonome</b>. Effets : transfert automatique, contrat maintenu en l'état, pas de licenciement à l'occasion du transfert.`,
  a:`ASV est absorbée en totalité : son personnel, son site de Millau et son activité passent à GVC. L'entité économique autonome est transférée dans son ensemble. Les 68 contrats se poursuivent donc de plein droit, avec ancienneté, salaire et qualification inchangés.`,
  c:`<b>Aucune procédure individuelle</b> : ni accord des salariés, ni avenant, ni nouveau contrat, ni licenciement. Sur le plan collectif en revanche : les accords d'ASV sont mis en cause (négocier un accord de transition ou d'adaptation), ceux de GVC bénéficient immédiatement aux salariés transférés ; CSE et délégués restent en place selon le cours.`,
  hc:`Le projet de fusion doit être soumis à la consultation des CSE de GVC et d'ASV avant sa réalisation. Une information écrite des salariés est une bonne pratique, pas une condition.`},
 {id:'I2', th:[7], q:`La direction envisage de fermer Millau et de muter les salariés à Pessac. Peuvent-ils refuser de quitter Millau ?`,
  pb:`Le changement de lieu de travail est-il une modification du contrat ou un simple changement des conditions de travail ?`,
  r:`Le changement de lieu de travail entraînant un <b>changement de secteur géographique</b> est une modification du contrat (Soc. 4 juillet 2012). Toute modification du contrat exige l'<b>accord du salarié</b> ; le refus n'est pas fautif. Le transfert L1224-1 maintient le contrat « en l'état » : le repreneur n'a pas plus de droits que l'ancien employeur.`,
  a:`Millau (Aveyron) et Pessac (Gironde) sont à plusieurs centaines de kilomètres, dans deux bassins d'emploi distincts : le secteur géographique change sans discussion. Rien dans l'énoncé n'indique une clause de mobilité.`,
  c:`<b>Oui, ils peuvent refuser.</b> Il faut recueillir l'accord de chacun. Réserve à formuler : si un contrat contient une clause de mobilité valable couvrant Pessac, la mutation redevient un changement des conditions de travail, et le refus une faute.`,
  hc:`Le motif étant économique (fermeture du site), la proposition se fait par lettre recommandée avec un mois de réflexion ; le silence vaut acceptation.`},
 {id:'I3', th:[7,1], q:`Quelles pourraient être les conséquences de leur éventuel refus ?`,
  pb:`Que peut faire l'employeur face au refus d'une modification du contrat ?`,
  r:`Face au refus, l'employeur <b>renonce</b> ou <b>licencie</b> — pour le motif qui a justifié la proposition, jamais pour le refus. Alternative du cours : l'<b>accord de performance collective</b>, qui peut organiser la mobilité géographique ; ses stipulations se substituent au contrat ; le salarié a 30 jours pour refuser et l'employeur 60 jours pour engager le licenciement.`,
  a:`La mutation vient de la fermeture du site de Millau : motif non inhérent à la personne, donc économique. Les refus déboucheraient sur des licenciements économiques, que l'entreprise devra justifier (difficultés, réorganisation nécessaire à la sauvegarde de la compétitivité). Avec 68 salariés concernés dans une entreprise de 280 salariés dotée de délégués syndicaux, la négociation d'un APC est envisageable.`,
  c:`Sans APC : <b>licenciements économiques</b> des salariés qui refusent, avec la procédure collective correspondante. Avec APC : licenciement reposant sur un motif spécifique lié au refus de l'accord. Dans les deux cas, le refus n'est <b>pas une faute</b> et le salarié perçoit ses indemnités.`,
  hc:`Dès 10 refus dans une entreprise d'au moins 50 salariés, un plan de sauvegarde de l'emploi (PSE) est obligatoire, avec consultation du CSE.`}
]},
{id:'II', t:'Tenue, expression, vie personnelle, égalité de salaire', ctx:`Questions sur le pouvoir de direction et ses limites.`, qs:[
 {id:'II1', th:[3,4], q:`La direction veut une présentation soignée des commerciaux et des salariés en contact avec le public. Peut-elle exiger le port systématique d'un tailleur pour les dames et d'un costume pour les hommes ?`,
  pb:`L'employeur peut-il restreindre la liberté vestimentaire, et jusqu'où ?`,
  r:`La liberté de se vêtir à sa guise au travail <b>n'est pas une liberté fondamentale</b>. L'employeur peut imposer une tenue correspondant à une <b>exigence légitime</b>. Cadre général (L1121-1) : restriction <b>justifiée par la nature de la tâche et proportionnée au but recherché</b>.`,
  a:`Pour les salariés <b>en contact avec la clientèle</b>, l'image de l'entreprise justifie une tenue soignée : l'exigence est légitime. Elle ne le serait pas pour des salariés sans contact avec le public. Le caractère « systématique » et le modèle imposé (tailleur / costume) doivent rester proportionnés : une exigence de « tenue de ville correcte » est plus sûre qu'un uniforme genré. La différence dames / hommes doit pouvoir se justifier, le sexe et l'apparence physique étant des motifs de discrimination.`,
  c:`<b>Oui sur le principe</b>, à condition de limiter l'obligation aux postes en contact avec le public et de la formuler de façon proportionnée.`,
  hc:`La règle doit passer par le règlement intérieur ou une note de service (consultation du CSE, transmission à l'inspection du travail).`},
 {id:'II2', th:[3], q:`M. Gustave, commercial, écrit à la direction un courrier virulent : l'idée est « ridicule », « une nouvelle débilité du service RH ». Peut-il être sanctionné ? Peut-il invoquer sa liberté d'expression ou se dire lanceur d'alerte ?`,
  pb:`Des propos critiques et vifs adressés à la direction relèvent-ils de la liberté d'expression ? Le salarié est-il un lanceur d'alerte ?`,
  r:`Le salarié jouit de sa liberté d'expression dans et hors de l'entreprise ; le licenciement qui y porte atteinte est <b>nul</b> (Soc. 16 fév. 2022). <b>Depuis 2026</b>, le juge ne recherche plus l'abus : il met en balance cette liberté et les intérêts de l'employeur et contrôle la <b>nécessité et la proportionnalité</b> de la sanction, au regard de la <b>teneur</b> des propos, du <b>contexte</b>, de leur <b>portée</b> et des <b>conséquences</b> pour l'employeur. Lanceur d'alerte (L1132-3-3) : relater de bonne foi un <b>crime ou un délit</b>, ou une alerte au sens de la loi de 2016.`,
  a:`<b>Teneur</b> : critique d'une décision, en termes vifs (« ridicule », « débilité ») mais visant une mesure et un service, pas une personne nommée. <b>Contexte</b> : réaction à un projet qui touche directement ses conditions de travail. <b>Portée</b> : courrier adressé à la seule direction, sans diffusion. <b>Conséquences</b> : aucune établie. Quant à l'alerte : il ne dénonce ni crime, ni délit, ni menace pour l'intérêt général, seulement son désaccord.`,
  c:`Il peut <b>invoquer sa liberté d'expression</b> ; une sanction lourde, a fortiori un licenciement, serait disproportionnée et exposée à la nullité. Tout au plus un rappel à l'ordre sur le ton. Il n'est <b>pas lanceur d'alerte</b>.`},
 {id:'II3', th:[3,4], q:`Convoqué à un entretien préalable, M. Gustave remet au DRH un dessin où celui-ci pense se reconnaître, excluant les hommes de l'entreprise et accueillant à bras ouverts de jeunes collaboratrices « aux jolies formes ». Peut-on le sanctionner ou le licencier ?`,
  pb:`Une caricature visant personnellement un supérieur reste-t-elle couverte par la liberté d'expression ?`,
  r:`Même grille qu'à la question précédente : mise en balance et proportionnalité (teneur, contexte, portée, conséquences). Les propos injurieux ou diffamatoires peuvent justifier une sanction.`,
  a:`<b>Teneur</b> : le dessin vise cette fois une <b>personne identifiable</b> et lui prête un comportement sexiste et discriminatoire — c'est une attaque personnelle, plus grave que le courrier. <b>Contexte</b> : il est remis pendant l'entretien préalable, moment où le salarié se défend. <b>Portée</b> : remis au seul DRH, sans diffusion aux collègues. <b>Conséquences</b> : atteinte à la considération du DRH, mais limitée. La caricature est par nature outrancière ; le DRH « pense » se reconnaître, ce qui n'est pas une certitude.`,
  c:`Une <b>sanction est envisageable</b> si le caractère injurieux et l'identification sont établis, mais elle doit rester mesurée. Un <b>licenciement paraît disproportionné</b> : pas de publicité, contexte de défense. La réponse changerait si le dessin avait été affiché ou diffusé dans l'entreprise.`,
  hc:`La jurisprudence protège les propos tenus par le salarié pour sa défense lors de l'entretien préalable : sauf abus, ils ne peuvent fonder un licenciement.`},
 {id:'II4', th:[3,5], q:`M. Gédéon, technicien à Pessac, tient un blog personnel hors temps de travail. Une rubrique « heurs et malheurs des collègues ploucs » tourne en ridicule des collègues, sans les nommer ni nommer l'entreprise, mais plusieurs se sentent visés et se plaignent. Peut-on le sanctionner ?`,
  pb:`Un comportement relevant de la vie personnelle peut-il justifier une sanction disciplinaire ?`,
  r:`Le salarié s'exprime librement <b>hors de l'entreprise</b> aussi. Un fait de la vie personnelle n'est sanctionnable que s'il <b>se rattache à la vie professionnelle</b> ou viole une obligation née du contrat (loyauté). L'employeur est tenu d'une <b>obligation de sécurité</b> (L4121-1) et doit prévenir le harcèlement moral (agissements répétés dégradant les conditions de travail). Contrôle de proportionnalité : teneur, contexte, portée, conséquences.`,
  a:`Le blog est personnel et tenu hors du temps de travail : en principe, vie privée. Mais il est <b>public</b>, s'inspire <b>régulièrement</b> de collègues qui se <b>reconnaissent</b>, et produit des effets <b>dans l'entreprise</b> (plaintes) : le rattachement à la vie professionnelle est défendable. Teneur : moquerie dénigrante (« ploucs »). Difficulté de preuve : sans nom, il faut établir que les collègues sont identifiables. L'entreprise, non nommée, ne subit pas d'atteinte à son image.`,
  c:`<b>Sanction possible, mais pas automatique</b> : il faut démontrer que des collègues sont identifiables et que les publications dégradent leurs conditions de travail. L'employeur doit en tout cas <b>réagir</b> (entretien, enquête, mise en demeure de cesser). Sanction proportionnée ; un licenciement immédiat serait risqué.`,
  hc:`Le blog étant accessible à tous, l'employeur peut le consulter et en faire dresser constat : la preuve est licite, à la différence d'un compte Facebook privé.`},
 {id:'II5', th:[4], q:`M. Gédéon est allé voir à l'hôpital un collègue accidenté de la route et lui a offert une Bible. Peut-on le licencier pour prosélytisme religieux ?`,
  pb:`Un acte religieux accompli hors de l'entreprise peut-il fonder un licenciement ?`,
  r:`Les <b>convictions religieuses</b> sont un motif de discrimination ; la mesure prise sur ce fondement est <b>nulle</b>. Une restriction n'est possible que par une clause de neutralité du <b>règlement intérieur</b> (L1321-2-1), justifiée et proportionnée — et elle ne vaut que <b>dans l'entreprise</b>. Les faits de la vie personnelle ne sont pas sanctionnables.`,
  a:`Le geste a lieu <b>à l'hôpital</b>, hors du temps et du lieu de travail, lors d'une visite amicale. Il est <b>isolé</b>, sans pression ni insistance, et le collègue n'est victime que d'un accident de la circulation, sans lien avec le travail. Aucune clause de neutralité ne peut s'appliquer là. Rien ne rattache l'acte à la vie de l'entreprise.`,
  c:`<b>Non.</b> Le licenciement serait discriminatoire, donc nul (réintégration possible). Seul un prosélytisme insistant <i>dans l'entreprise</i>, perturbant le travail ou exerçant une pression sur des collègues, pourrait être sanctionné.`},
 {id:'II6', th:[9], q:`Mme Ginette, un an d'ancienneté à Millau, s'étonne d'être moins payée que deux collègues du même service et relève que les salaires de Millau seraient inférieurs à ceux de Pessac. Peut-elle obtenir une copie des bulletins de salaire de ses collègues ?`,
  pb:`Le salarié qui invoque une inégalité de traitement peut-il accéder aux éléments de rémunération de ses collègues ?`,
  r:`« À travail égal, salaire égal » : des salariés dans une situation identique doivent être payés de la même façon. Preuve aménagée : la salariée présente des éléments laissant supposer l'inégalité, puis l'employeur justifie par des éléments objectifs. Le juge peut ordonner toute mesure d'instruction utile.`,
  a:`Les bulletins de paie contiennent des données personnelles de tiers. Rien n'oblige la direction à les remettre sur simple demande. Mais Mme Ginette n'a pas à prouver l'inégalité : il lui suffit d'éléments laissant supposer un écart (même service, mêmes fonctions, propos des représentants du personnel).`,
  c:`<b>Pas directement auprès de la direction.</b> En cas de contentieux, le <b>juge peut ordonner la communication</b> des bulletins.`,
  hc:`Soc. 8 mars 2023 : la communication de bulletins de collègues, noms conservés mais données personnelles inutiles occultées, est admise si elle est indispensable au droit à la preuve et proportionnée. Elle peut être demandée en référé avant tout procès.`},
 {id:'II7', th:[9], q:`La direction envisage de répondre que les collègues ont une expérience plus longue et une productivité plus élevée, et que le coût de la vie est « sans doute » différent entre Pessac et Millau. Qu'en pensez-vous ?`,
  pb:`Ces trois justifications sont-elles objectives et pertinentes ?`,
  r:`Une différence de traitement doit reposer sur des <b>critères objectifs, pertinents et matériellement vérifiables</b>. L'ancienneté et l'expérience peuvent justifier un écart à cette condition. Entre <b>établissements</b> d'une même entreprise, des différences sont admises si elles reposent sur des <b>raisons objectives</b>. Entre <b>entreprises différentes</b>, le principe ne s'applique pas (Soc. 20 nov. 2012).`,
  a:`<b>Expérience</b> : recevable — Mme Ginette n'a qu'un an d'ancienneté — si l'employeur produit des éléments vérifiables (dates d'embauche, parcours). <b>Productivité</b> : recevable seulement si elle est mesurée par des critères objectifs (indicateurs, évaluations), pas par une impression. <b>Coût de la vie</b> : l'argument peut valoir entre établissements, mais « sans doute » trahit l'absence de preuve ; il faut des données chiffrées. Enfin, tant que la fusion n'est pas réalisée, ASV et GVC sont deux entreprises distinctes : la comparaison Millau / Pessac est alors inopérante.`,
  c:`Réponse <b>fragile en l'état</b>. Les deux premiers arguments sont bons en droit mais doivent être <b>documentés</b> ; le troisième doit être démontré. Conseil : réunir les justificatifs avant de répondre.`,
  hc:`Après la fusion, le maintien des salaires issus des contrats transférés (L1224-1) est lui-même une justification objective d'écarts entre anciens ASV et anciens GVC. L'ancienneté ne justifie rien si elle est déjà rémunérée par une prime d'ancienneté.`}
]},
{id:'III', t:'Accident du travail de M. Gontran', ctx:`M. Gontran, employé à la découpe des cuirs, a subi un <b>accident du travail le 8 août 2026</b> sur le site de Millau.`, qs:[
 {id:'III1', th:[6,4], q:`Dès l'accident, la direction a douté de son aptitude à reprendre et a souhaité le remplacer. Pouvait-on engager une procédure de licenciement ?`,
  pb:`Peut-on licencier un salarié dont le contrat est suspendu par un accident du travail ?`,
  r:`<b>Interdiction du licenciement jusqu'à l'issue de l'arrêt AT/MP.</b> L'état de santé est un motif de discrimination. L'inaptitude ne peut être constatée que par le <b>médecin du travail</b>.`,
  a:`L'accident est survenu sur le lieu de travail : c'est un accident du travail, le contrat est suspendu. Les « doutes » de la direction ne sont pas un avis médical, et vouloir le remplacer revient à le licencier en raison de son état de santé.`,
  c:`<b>Non.</b> Le licenciement serait nul. Pour assurer la production, l'entreprise peut recourir à un CDD de remplacement ou à l'intérim.`,
  hc:`Les deux seules exceptions pendant l'arrêt AT/MP : la faute grave et l'impossibilité de maintenir le contrat pour un motif étranger à l'accident.`},
 {id:'III2', th:[6], q:`Le salarié est absent depuis près de trois mois. L'entreprise aurait-elle dû faire quelque chose malgré l'absence d'évolution de son état de santé ?`,
  pb:`Quelles démarches incombent à l'employeur pendant un arrêt long ?`,
  r:`Pour tout arrêt de plus de <b>30 jours</b> : <b>rendez-vous de liaison</b>, destiné à informer le salarié des actions de prévention de la désinsertion professionnelle, de la visite de préreprise et des aménagements envisageables. La <b>visite de préreprise</b> se fait à la demande du salarié auprès du médecin du travail.`,
  a:`Trois mois d'absence : le seuil de 30 jours est largement dépassé. L'entreprise aurait dû informer M. Gontran qu'il pouvait bénéficier d'un rendez-vous de liaison et lui rappeler l'existence de la préreprise. C'est d'autant plus utile que son métier (découpe) est physique.`,
  c:`<b>Oui</b> : proposer le rendez-vous de liaison et garder le contact pour préparer le retour. Aucune sanction spécifique n'est prévue, mais l'inaction pèsera si l'on reproche ensuite à l'employeur de n'avoir rien fait pour le maintien dans l'emploi.`},
 {id:'III3', th:[6], q:`Le médecin du travail considère que M. Gontran est inapte à un emploi en station debout durable. Peut-on le licencier directement ?`,
  pb:`Quelles obligations pèsent sur l'employeur après un avis d'inaptitude ?`,
  r:`Seul le médecin du travail prononce l'inaptitude. L'employeur a une <b>obligation de reclassement</b> (de moyens), dont toutes les étapes doivent être écrites. Il dispose d'<b>un mois</b> à compter de l'avis pour reclasser ou licencier ; au-delà, il <b>reprend le paiement du salaire</b>. L'absence de recherche de reclassement est sanctionnée par le conseil de prud'hommes.`,
  a:`L'avis ne vise que la station debout prolongée : il laisse ouverts les postes assis ou alternés. Un reclassement est donc concevable et doit être recherché sérieusement dans l'entreprise — Millau, mais aussi Pessac et Versailles.`,
  c:`<b>Non.</b> Le licenciement n'est possible qu'après une recherche de reclassement infructueuse, ou le refus du poste proposé.`,
  hc:`Consultation du CSE sur les propositions de reclassement. Dispense de recherche seulement si l'avis mentionne expressément que tout maintien dans un emploi serait gravement préjudiciable à la santé du salarié ou que son état fait obstacle à tout reclassement.`},
 {id:'III4', th:[6,7], q:`Un poste au contrôle du chargement des commandes (alternance debout/assis, informatique fréquente) pourrait lui être proposé, mais il est moins rémunéré. Peut-il être proposé ? Faut-il respecter une procédure ?`,
  pb:`Un poste de reclassement moins payé peut-il être proposé, et selon quelles formes ?`,
  r:`Le reclassement doit être conforme aux <b>préconisations du médecin du travail</b> et faire l'objet d'<b>écrits</b>. La <b>rémunération</b> est un élément du contrat : la réduire est une <b>modification du contrat</b>, qui exige l'accord du salarié.`,
  a:`L'alternance debout/assis semble compatible avec l'avis, mais c'est au médecin du travail de le confirmer. L'usage fréquent de l'informatique peut exiger une formation, au titre de l'obligation d'adaptation. La baisse de salaire n'interdit pas la proposition — l'employeur doit proposer ce qui existe — mais impose un avenant accepté.`,
  c:`<b>Oui, il peut et doit être proposé.</b> Procédure : validation par le médecin du travail, proposition écrite et précise, formation si nécessaire, <b>accord exprès</b> de M. Gontran formalisé par avenant.`,
  hc:`S'y ajoute la consultation préalable du CSE.`},
 {id:'III5', th:[6,7], q:`M. Gontran peut-il refuser le poste ? Que pourra faire l'entreprise ? Est-elle en faute si elle ne propose pas d'autres postes ?`,
  pb:`Quelles sont les suites du refus d'un poste de reclassement ?`,
  r:`Le refus d'une modification du contrat n'est <b>pas fautif</b>. L'obligation de reclassement est de <b>moyens</b>. Délai d'un mois puis reprise du salaire.`,
  a:`Le poste emporte une baisse de rémunération : M. Gontran est libre de le refuser. L'entreprise doit alors vérifier s'il existe d'autres postes compatibles (dans tous ses établissements). S'il n'y en a pas, le reclassement est impossible.`,
  c:`<b>Il peut refuser sans faute.</b> L'entreprise peut alors le <b>licencier pour inaptitude et impossibilité de reclassement</b>. Elle n'est pas en faute de ne pas proposer d'autres postes <b>s'il n'en existe pas</b> de compatibles — ce qu'elle doit pouvoir démontrer par écrit.`,
  hc:`Depuis 2017, l'obligation est réputée satisfaite dès que l'employeur a proposé un emploi conforme aux indications du médecin du travail. L'inaptitude étant d'origine professionnelle : indemnité spéciale de licenciement doublée et indemnité équivalente au préavis.`},
 {id:'III6', th:[6], q:`On s'oriente vers un mi-temps thérapeutique. En attendant, pour des commandes urgentes, pourrait-on proposer à M. Gontran quelques travaux chez lui, à son rythme ?`,
  pb:`Peut-on faire travailler un salarié pendant la suspension de son contrat ?`,
  r:`Pendant l'arrêt, le contrat est <b>suspendu</b>. L'employeur est tenu d'une <b>obligation de sécurité</b>. Le mi-temps thérapeutique est <b>proposé par le médecin traitant</b>, soumis à l'employeur puis au médecin-conseil de la CPAM. Imposer un travail à domicile est une modification du contrat.`,
  a:`Tant que le mi-temps thérapeutique n'est pas prescrit, M. Gontran est en arrêt complet. Le faire travailler, même volontaire, même chez lui, même « à son rythme », revient à ignorer la prescription médicale. L'urgence des commandes est indifférente.`,
  c:`<b>Non.</b> L'entreprise s'exposerait à des dommages-intérêts et le salarié à la perte de ses indemnités journalières. Il faut attendre la prescription, puis organiser la reprise à temps partiel.`,
  hc:`La jurisprudence récente accorde réparation au salarié qu'on a fait travailler pendant un arrêt sans qu'il ait à prouver un préjudice.`},
 {id:'III7', th:[6], q:`Quelle sera l'incidence de l'absence sur son droit à congés payés ? Les congés se prennent sur l'année civile et sont perdus au 31 décembre. Quelles obligations si M. Gontran revient en février ? A-t-il perdu les congés 2025 non pris ?`,
  pb:`Le salarié acquiert-il des congés pendant l'arrêt, et que deviennent ceux qu'il n'a pas pu prendre ?`,
  r:`Le salarié continue d'acquérir des congés pendant l'arrêt (en maladie non professionnelle : 2 jours ouvrables par mois, 24 par an). <b>Au retour</b>, l'employeur l'<b>informe</b> du nombre de jours dont il dispose et du délai de <b>15 mois</b> pour les prendre ; à défaut de prise dans ce délai, ils sont perdus.`,
  a:`L'arrêt est d'origine professionnelle : M. Gontran acquiert ses congés comme s'il travaillait. Absent d'août 2026 à février, il n'a pas pu solder ses congés avant le 31 décembre : cette impossibilité tient à l'accident, pas à lui. La règle interne ne peut donc pas lui être opposée.`,
  c:`<b>Il ne perd rien.</b> À son retour en février, l'entreprise doit l'informer par écrit du nombre de jours (reliquat antérieur + jours acquis pendant l'arrêt) et de la date limite : il a <b>15 mois</b> pour les poser.`,
  hc:`Depuis la loi du 22 avril 2024 : acquisition intégrale (2,5 jours par mois) en AT/MP sans limite de durée ; l'information doit être donnée dans le mois suivant la reprise, et le délai de 15 mois ne court qu'à partir de cette information.`}
]},
{id:'IV', t:'Maladie de M. Eleazar', ctx:`M. Eleazar ne se présente pas à son poste un lundi, sans justification. Il prévient le <b>jeudi</b> par téléphone qu'il est en arrêt maladie et envoie l'arrêt <b>la semaine suivante</b>. Il a <b>7 ans d'ancienneté</b> et est chargé des expéditions de l'usine de Millau.`, qs:[
 {id:'IV1', th:[6], q:`L'entreprise est-elle tenue de lui verser un complément de rémunération ?`,
  pb:`Quelles sont les conditions du complément de salaire en cas de maladie ?`,
  r:`En maladie non professionnelle, la Sécurité sociale verse 50 % à partir du 4e jour. L'employeur verse un <b>complément</b> si le salarié a <b>1 an d'ancienneté</b> <u>et</u> s'il <b>justifie de son absence dans les 48 h</b>.`,
  a:`Ancienneté : 7 ans, condition remplie. Justification : absence le lundi, appel le jeudi (3 jours après), certificat la semaine suivante. Le délai de 48 h n'est pas respecté.`,
  c:`<b>Non</b>, l'entreprise n'y est pas tenue au titre de la loi, la seconde condition faisant défaut. Réserve : vérifier la convention collective, qui peut être plus favorable.`,
  hc:`Le complément légal : 90 % du brut puis 2/3, après 7 jours de carence, pour des durées qui augmentent avec l'ancienneté.`},
 {id:'IV2', th:[3,6], q:`Pourrait-elle le sanctionner pour envoi tardif de l'arrêt de travail ?`,
  pb:`Le retard à justifier une absence est-il fautif alors que la maladie est réelle ?`,
  r:`Le salarié doit respecter les directives de l'employeur et exécuter loyalement son contrat : prévenir et justifier son absence en fait partie. La maladie elle-même ne peut jamais être sanctionnée (discrimination liée à l'état de santé). Toute sanction doit être proportionnée.`,
  a:`Ce qui est reproché n'est pas la maladie mais le <b>silence de trois jours</b> et l'envoi tardif du certificat, qui ont laissé le service des expéditions sans information. Le manquement est réel mais isolé, chez un salarié de 7 ans d'ancienneté ; l'état de santé peut expliquer en partie le retard.`,
  c:`<b>Oui, une sanction légère</b> (avertissement) est possible. Un licenciement serait disproportionné.`},
 {id:'IV3', th:[6,4], q:`Son absence se prolonge et désorganise le fonctionnement de l'entreprise. Pourrait-on le licencier ?`,
  pb:`L'absence prolongée pour maladie peut-elle justifier un licenciement ?`,
  r:`<b>Interdiction du licenciement fondé sur la maladie</b> (état de santé = discrimination → nullité).`,
  a:`Le motif ne peut pas être la maladie. Il faut donc un motif distinct et objectif. M. Eleazar occupe un poste clé (contrôle et remise des envois) : la désorganisation est plausible, mais elle doit toucher l'entreprise et ne pas pouvoir être réglée par un remplacement temporaire (CDD, intérim, réaffectation).`,
  c:`<b>Possible, mais à des conditions strictes</b> : perturbation du fonctionnement de l'entreprise <u>et</u> nécessité d'un <b>remplacement définitif</b> par une embauche en CDI. Sans ces deux éléments, le licenciement est nul.`,
  hc:`Cette construction est jurisprudentielle. La lettre de licenciement doit mentionner les deux éléments, et l'embauche du remplaçant doit intervenir dans un délai proche. Vérifier aussi une éventuelle clause conventionnelle de garantie d'emploi.`},
 {id:'IV4', th:[3], q:`Il a modifié le mot de passe de son ordinateur : impossible d'accéder aux données de suivi des marchandises. Cela pourrait-il justifier une sanction ou un licenciement ?`,
  pb:`Quelles obligations subsistent pendant la suspension du contrat ?`,
  r:`Le travail fourni par le salarié <b>appartient à l'entreprise</b> ; les fichiers professionnels sont présumés professionnels et l'employeur doit pouvoir y accéder. L'obligation de <b>loyauté</b> survit à la suspension du contrat.`,
  a:`Modifier un mot de passe n'est pas fautif en soi (c'est même une règle de sécurité). Tout dépend de la suite : l'entreprise doit d'abord <b>demander</b> le mot de passe — ce qui ne revient pas à le faire travailler. S'il le communique, il n'y a pas de faute. S'il refuse, ou s'il l'a changé pour bloquer l'activité, il retient des données appartenant à l'entreprise.`,
  c:`<b>Pas de sanction d'emblée</b> : demander d'abord. En cas de <b>refus</b> ou d'intention de nuire : manquement à la loyauté, sanctionnable, pouvant aller jusqu'au licenciement pour faute grave — la maladie ordinaire n'y fait pas obstacle.`},
 {id:'IV5', th:[6], q:`L'entreprise doute du sérieux de la maladie. Peut-elle faire contrôler son état de santé ?`,
  pb:`De quels moyens de contrôle dispose l'employeur ?`,
  r:`Le cours ne traite pas ce point : seuls les médecins peuvent apprécier l'état de santé, l'employeur n'a pas accès aux informations médicales.`,
  a:`L'employeur ne peut ni convoquer le salarié ni l'interroger sur sa pathologie. Il peut en revanche mandater un médecin pour une contre-visite au domicile, et signaler ses doutes à la CPAM.`,
  c:`<b>Oui, par une contre-visite médicale</b>. Si le médecin conclut que l'arrêt n'est pas justifié ou si le salarié est absent sans motif, l'employeur peut <b>suspendre le complément de salaire</b> — pas sanctionner.`,
  hc:`La contre-visite est la contrepartie du complément de salaire : ici, si aucun complément n'est versé (question 1), son intérêt est limité ; reste le signalement à la CPAM.`}
]},
{id:'V', t:'Mme Séraphine : grossesse, congés, formation', ctx:`Mme Séraphine, salariée à Pessac, est connue pour ses sautes d'humeur et une certaine irrégularité. Elle a été convoquée à un <b>entretien préalable au licenciement</b> pour négligences et propos insolents envers sa hiérarchie.`, qs:[
 {id:'V1', th:[6], q:`À l'entretien, elle annonce qu'elle poursuivra l'entreprise pour discrimination : son licenciement serait envisagé après qu'elle a appris sa grossesse au médecin du travail. Faut-il cesser la procédure ?`,
  pb:`L'annonce de la grossesse fait-elle obstacle au licenciement ?`,
  r:`Pendant la grossesse (et jusqu'à 10 semaines après le congé), le licenciement n'est possible que pour <b>faute grave non liée à l'état de grossesse</b> ou <b>impossibilité de maintenir le contrat</b> pour un motif étranger. La protection suppose que l'employeur soit <b>informé</b>. Licenciement nul : réintégration, salaires, au moins 6 mois de dommages-intérêts. Aucune notification pendant le congé maternité.`,
  a:`L'employeur est désormais informé : la protection joue. Les griefs — négligences et insolence — sont étrangers à la grossesse, mais constituent-ils une <b>faute grave</b> ? Des négligences relèvent plutôt de la faute simple ou de l'insuffisance ; l'insolence peut être grave selon les termes et la répétition. En l'état, la faute grave est douteuse.`,
  c:`<b>Pas d'obligation de principe d'arrêter</b>, mais on ne peut poursuivre que sur une <b>faute grave solidement établie</b>. À défaut : renoncer au licenciement et, si nécessaire, prononcer une sanction moindre (avertissement, mise à pied).`,
  hc:`Même notifié à une salariée dont l'employeur ignorait la grossesse, le licenciement est annulé si elle envoie un certificat médical dans les 15 jours.`},
 {id:'V2', th:[4], q:`Pensez-vous que l'action en discrimination puisse prospérer ?`,
  pb:`Les éléments invoqués laissent-ils supposer une discrimination liée à la grossesse ?`,
  r:`La grossesse est un motif de discrimination. Preuve en trois temps : la salariée présente des <b>éléments laissant supposer</b> ; l'employeur prouve que sa décision repose sur des <b>éléments objectifs étrangers</b> ; le juge forme sa conviction.`,
  a:`Élément avancé : la chronologie (procédure après la visite au médecin du travail). Mais le médecin du travail est tenu au <b>secret médical</b> : l'employeur n'a appris la grossesse qu'à l'entretien, donc <b>après</b> avoir engagé la procédure. Les griefs sont antérieurs et sans lien avec la grossesse. L'employeur doit pouvoir le démontrer : date de la convocation, traces écrites des négligences et des propos.`,
  c:`<b>L'action a peu de chances d'aboutir</b> si le dossier est documenté. Attention toutefois : même sans discrimination, le licenciement serait <b>nul</b> s'il était prononcé sans faute grave (protection de la maternité).`},
 {id:'V3', th:[6,5], q:`Elle exige d'être affectée dans une autre équipe pendant sa grossesse, ne serait-ce que pour ne plus voir son supérieur direct. Doit-on accéder à cette demande ?`,
  pb:`La salariée enceinte a-t-elle droit à un changement d'affectation ?`,
  r:`Protection de la santé : <b>affectation sur un autre poste pendant la grossesse</b> lorsque l'état de santé l'exige. Par ailleurs, obligation de sécurité de l'employeur (santé physique et mentale).`,
  a:`Le motif avancé — ne plus voir son supérieur — est une convenance personnelle, pas une nécessité médicale. L'employeur n'est donc pas tenu d'accepter. Mais la demande peut révéler une tension avec la hiérarchie : l'ignorer serait imprudent.`,
  c:`<b>Non, pas d'obligation</b>, sauf si le médecin du travail constate que son état de santé l'exige. Conseil : l'orienter vers le médecin du travail et s'assurer qu'il n'existe pas de situation de souffrance au travail.`,
  hc:`L'affectation temporaire (L1225-7) se fait sans baisse de rémunération.`},
 {id:'V4', th:[6], q:`Elle rappelle qu'elle a été absente deux ans, en 2020 et 2021, pour un Covid long, et qu'elle a été privée de congés. Peut-elle être indemnisée en compensation ?`,
  pb:`Le salarié acquiert-il des congés pendant une maladie non professionnelle, y compris pour le passé ?`,
  r:`Maladie et congés : acquisition de <b>2 jours ouvrables par mois, dans la limite de 24 jours par an</b>. Délai de <b>15 mois</b> pour les prendre.`,
  a:`Un Covid long est (sauf reconnaissance contraire) une maladie non professionnelle. Sur le principe, Mme Séraphine a acquis jusqu'à 24 jours par an pour 2020 et 2021. Elle est toujours en poste : elle ne peut obtenir que des <b>jours de congé</b>, pas une indemnité, celle-ci n'étant due qu'à la rupture du contrat.`,
  c:`<b>Sur le principe, des droits existent</b> (jusqu'à 48 jours), mais sous forme de congés et sous réserve des délais pour agir.`,
  hc:`La loi du 22 avril 2024 est rétroactive au 1er décembre 2009, mais les salariés encore en poste devaient agir dans les 2 ans de son entrée en vigueur, soit avant le 24 avril 2026. À la date du cas, sa demande est très probablement <b>forclose</b>. Point à vérifier avec l'enseignant.`},
 {id:'V5', th:[11], q:`Elle voudrait bénéficier d'un congé de transition professionnelle à l'issue de son congé maternité. Doit-elle respecter un délai de prévenance ? L'entreprise pourrait-elle refuser son départ en formation ?`,
  pb:`Quelles sont les conditions du congé de transition professionnelle et les pouvoirs de l'employeur ?`,
  r:`Conditions : <b>24 mois</b> d'ancienneté comme salarié dont <b>12 dans l'entreprise</b>. Demande d'autorisation d'absence <b>60 jours</b> avant (formation de moins de 6 mois) ou <b>120 jours</b> avant (6 mois et plus) ; réponse de l'employeur sous <b>30 jours</b>. L'employeur <b>ne peut pas refuser</b> ; il peut <b>différer</b> pour raisons de service ou selon le nombre de salariés déjà bénéficiaires. Le CSE est consulté en cas de report.`,
  a:`Mme Séraphine était déjà dans l'entreprise en 2020 : la condition d'ancienneté est remplie. Le congé maternité n'empêche pas de présenter la demande, qui peut être déposée pendant le congé pour respecter le délai.`,
  c:`<b>Oui, délai de 60 ou 120 jours</b> selon la durée de la formation. <b>L'entreprise ne peut pas refuser</b> si les conditions sont réunies, seulement reporter le départ, en motivant et après avis du CSE. À défaut de réponse dans les 30 jours, l'autorisation est acquise.`,
  hc:`Le report pour raisons de service est limité à 9 mois.`}
]},
{id:'VII', t:'Harcèlement sexuel : Mme Josette et M. Arsène', ctx:`Mme Josette est souvent en retard, ce qui perturbe son équipe. Elle explique au DRH qu'elle ne supporte plus les <b>plaisanteries graveleuses</b> de l'équipe au café du matin, les suppositions sur sa vie sexuelle selon sa tenue ou sa démarche. Elle accuse M. Arsène d'exhiber des <b>revues pornographiques</b> dans l'entreprise et sur Facebook, et se déclare harcelée sexuellement.`, qs:[
 {id:'VII1', th:[5,3], q:`Le responsable de production doute, estime que Facebook ne concerne pas l'entreprise, propose d'inviter Mme Josette à porter plainte et d'attendre l'enquête, et de vérifier discrètement l'armoire de M. Arsène. Que conseillez-vous ?`,
  pb:`Comment l'employeur doit-il réagir à une dénonciation de harcèlement sexuel ?`,
  r:`<b>L1153-1</b> : propos ou comportements à connotation sexuelle ou sexiste répétés, dégradants ou créant une situation hostile ; la répétition peut venir de <b>plusieurs personnes</b>. L'employeur, tenu d'une <b>obligation de sécurité</b>, doit <b>prévenir et réagir immédiatement</b>. La salariée qui dénonce est protégée, sauf mauvaise foi. Preuve : éléments précis et concordants laissant supposer le harcèlement.`,
  a:`Les faits décrits correspondent à la définition : remarques quotidiennes sur sa vie sexuelle, venant de plusieurs collègues, plus l'exhibition de revues. Les <b>doutes</b> du responsable ne dispensent pas d'agir. <b>Attendre la plainte pénale</b> serait une faute : les deux procédures sont indépendantes. La <b>fouille discrète de l'armoire</b> est un procédé déloyal. Les <b>retards</b> s'expliquent peut-être par le harcèlement : les sanctionner maintenant exposerait à la nullité.`,
  c:`① Recevoir Mme Josette et consigner ses déclarations. ② La protéger (aménager l'embauche, l'éloigner de l'équipe sans la pénaliser). ③ Ouvrir sans délai une <b>enquête interne</b> impartiale : auditions de l'équipe et de M. Arsène, association du CSE. ④ Ouvrir l'armoire seulement <b>en présence de M. Arsène</b>. ⑤ Suspendre tout projet de sanction des retards. ⑥ Sanctionner si les faits sont établis.`,
  hc:`Le CSE désigne un référent harcèlement sexuel. Une mise à pied conservatoire est possible le temps de l'enquête. Les faits fautifs se prescrivent par 2 mois à compter du jour où l'employeur en a une connaissance exacte.`},
 {id:'VII2', th:[3], q:`Faut-il faire constater par commissaire de justice le contenu du compte Facebook de M. Arsène ?`,
  pb:`L'employeur peut-il se constituer une preuve à partir d'un réseau social personnel ?`,
  r:`L'employeur exécute le contrat de bonne foi : ses modes de preuve doivent être loyaux. Selon le cours, il <b>ne peut pas consulter ou utiliser des échanges Facebook</b>, qui relèvent de la sphère privée — à la différence de LinkedIn, public.`,
  a:`Tout dépend de l'accessibilité. Si les publications sont <b>publiques</b>, ou si elles sont <b>montrées spontanément par des collègues</b> qui y ont légitimement accès (ce qui semble être le cas, puisque Mme Josette les a vues), le constat fige une preuve qui peut disparaître. Si le compte est <b>privé</b>, y accéder par ruse (faux profil, identifiants d'un tiers) serait déloyal. Et puisque des collègues voient ces contenus, ils se rattachent à la vie de l'entreprise, contrairement à ce que soutient le responsable.`,
  c:`<b>Oui si le contenu est accessible loyalement</b> : le constat est alors utile. <b>Non</b> s'il faut forcer l'accès à un espace privé.`,
  hc:`La Cour de cassation a admis la production d'une publication Facebook privée transmise spontanément par un collègue « ami », l'atteinte à la vie privée étant proportionnée (Soc. 30 sept. 2020).`},
 {id:'VII3', th:[5,3], q:`Mme Gertrude l'accuse d'avoir poursuivi une stagiaire de ses assiduités à l'été 2026 ; Mme Gudule signale des messages salaces envoyés avec la messagerie de l'entreprise à des commerciales de clients et fournisseurs ; Mme Alfonsine, informée par ses collègues, rapporte des propos égrillards et racistes au repas de fin d'année de décembre 2025. Ces faits pourraient-ils être sanctionnés ?`,
  pb:`Ces comportements relèvent-ils du pouvoir disciplinaire ?`,
  r:`Harcèlement sexuel (L1153-1) et pression grave même non répétée. Obligation de sécurité. Les messages envoyés avec les outils de l'entreprise sont <b>présumés professionnels</b>. Un fait est sanctionnable dès qu'il se rattache à la vie professionnelle.`,
  a:`<b>Stagiaire</b> : des « assiduités » répétées peuvent constituer un harcèlement sexuel ; elle est sous la responsabilité de l'entreprise. <b>Messages aux commerciales</b> : envoyés avec la messagerie professionnelle, à des partenaires — faute caractérisée, atteinte à l'image, et l'employeur peut consulter ces messages. <b>Repas de fin d'année</b> : événement lié à l'entreprise, propos sexistes et racistes entre collègues — rattachement à la vie professionnelle. Faiblesse : Mme Alfonsine ne rapporte que du <b>ouï-dire</b> ; il faut des témoins directs.`,
  c:`<b>Oui, les trois séries de faits sont sanctionnables</b>, sous réserve de les établir. Les messages professionnels sont la preuve la plus solide.`,
  hc:`Les stagiaires sont expressément protégés contre le harcèlement sexuel. Prescription : 2 mois à compter de la connaissance exacte des faits par l'employeur — les faits de décembre 2025 restent donc sanctionnables si la hiérarchie vient de les apprendre.`},
 {id:'VII4', th:[5], q:`Pourrait-on prononcer directement une sanction disciplinaire contre M. Arsène ?`,
  pb:`L'employeur peut-il sanctionner sur la seule foi d'accusations ?`,
  r:`L'employeur doit réagir immédiatement, mais il lui appartient d'établir les faits : il doit démontrer des éléments objectifs. Toute sanction doit être proportionnée.`,
  a:`À ce stade, il n'y a que des déclarations, dont une indirecte. M. Arsène n'a pas été entendu. Sanctionner maintenant ferait peser un risque d'annulation si les faits ne sont pas prouvés.`,
  c:`<b>Non.</b> D'abord l'enquête, puis la <b>procédure disciplinaire</b> : convocation, entretien préalable où il s'explique, notification motivée. En attendant, une mesure conservatoire peut l'écarter.`,
  hc:`La sanction ne peut être notifiée moins de 2 jours ouvrables ni plus d'un mois après l'entretien.`},
 {id:'VII5', th:[3], q:`Pourrait-on vérifier certaines accusations avec la vidéosurveillance des abords, installée contre les vols mais couvrant le parking où M. Arsène aurait importuné la stagiaire ?`,
  pb:`Un dispositif de sécurité peut-il servir de preuve contre un salarié ?`,
  r:`Vidéosurveillance : <b>autorisée sans conditions dans les lieux où les salariés n'ont pas accès</b>. Ailleurs, la loyauté impose l'information des salariés et la consultation du CSE.`,
  a:`Le parking est un lieu où les salariés circulent : ce n'est pas un lieu « sans accès ». Le dispositif a été installé pour la sécurité, pas pour contrôler le personnel. Si les salariés ont été informés de son existence et le CSE consulté, les images sont utilisables. Sinon, la preuve est illicite. Obstacle pratique : des images de l'été sont probablement déjà effacées.`,
  c:`<b>Oui si le dispositif a été régulièrement porté à la connaissance des salariés</b> ; sinon, usage risqué.`,
  hc:`Une preuve illicite n'est plus automatiquement écartée : le juge peut l'admettre si elle est indispensable à l'exercice du droit à la preuve et que l'atteinte est proportionnée (Ass. plén. 22 déc. 2023).`},
 {id:'VII6', th:[5], q:`Qu'adviendrait-il si ces accusations n'étaient pas clairement établies ? Faudrait-il annuler d'éventuelles sanctions contre M. Arsène et sanctionner inversement Mmes Josette, Gertrude, Alfonsine et Gudule ?`,
  pb:`Quel est le sort de la sanction et celui des dénonciatrices lorsque les faits ne sont pas prouvés ?`,
  r:`La dénonciation de faits de harcèlement <b>ne peut justifier ni sanction ni licenciement</b> — nullité. <b>Seule limite : la mauvaise foi</b>, c'est-à-dire l'accusation mensongère.`,
  a:`Pour M. Arsène : sans faits établis, la sanction n'a pas de fondement. Pour les quatre salariées : « non établi » ne veut pas dire « faux ». Rien n'indique qu'elles aient menti en connaissance de cause ; Mme Alfonsine se borne à rapporter ce qu'on lui a dit.`,
  c:`<b>Les sanctions contre M. Arsène devraient être retirées</b> ou seraient annulées par le juge. <b>Les salariées ne peuvent pas être sanctionnées</b>, sauf preuve qu'elles savaient les faits inexacts. Toute mesure prise contre elles serait nulle.`,
  hc:`En matière disciplinaire, le doute profite au salarié. La mauvaise foi ne se déduit pas de la seule absence de preuve des faits dénoncés.`}
]},
{id:'VIII', t:'Recrutement de seniors à Millau', ctx:`Le développement de Millau nécessite des recrutements.`, qs:[
 {id:'VIII1', th:[2,4], q:`Y a-t-il un risque, en recrutant des salariés de plus de 60 ans, de devoir les conserver jusqu'à 70 ans ?`,
  pb:`L'employeur peut-il rompre le contrat d'un salarié en raison de son âge ?`,
  r:`L'<b>âge</b> est un motif de discrimination, à l'embauche comme à la rupture. Le cours cite le <b>contrat de valorisation de l'expérience (CDI senior)</b> parmi les dispositifs en faveur des seniors.`,
  a:`Un CDI classique conclu avec un salarié de plus de 60 ans ne peut pas être rompu au motif de l'âge. Le salarié reste libre de partir à la retraite quand il le souhaite, mais l'employeur ne peut pas l'y contraindre avant l'âge légal de mise à la retraite d'office.`,
  c:`<b>Oui, le risque existe</b> dans un CDI ordinaire. Il se neutralise en recourant au <b>contrat de valorisation de l'expérience</b>. Refuser d'embaucher des seniors pour cette raison serait une discrimination.`,
  hc:`Mise à la retraite d'office : 70 ans. Avant, l'employeur peut seulement interroger le salarié chaque année, qui peut refuser. Le contrat de valorisation de l'expérience (loi du 24 octobre 2025), ouvert aux demandeurs d'emploi d'au moins 60 ans, autorise la mise à la retraite dès que le salarié remplit les conditions du taux plein.`},
 {id:'VIII2', th:[11,4], q:`Est-on obligé de former des salariés âgés comme les plus jeunes ?`,
  pb:`L'obligation de formation varie-t-elle selon l'âge ?`,
  r:`<b>L6321-1</b> : l'employeur assure l'adaptation des salariés à leur poste et veille au maintien de leur capacité à occuper un emploi. Le plan de développement des compétences est établi librement, sous réserve du <b>principe de non-discrimination</b>. L'âge est un motif discriminatoire, y compris pour l'accès à la formation.`,
  a:`Le texte vise « les salariés » sans distinction. Écarter un salarié d'une formation parce qu'il est proche de la retraite serait une discrimination. L'argument de la « rentabilité » de la formation n'est pas recevable. Le projet de montée en gamme de Millau rend d'ailleurs la formation nécessaire pour tous.`,
  c:`<b>Oui.</b> Même obligation d'adaptation, même accès à la formation. S'y ajoutent des dispositifs propres : entretien de fin de carrière entre 58 et 60 ans, négociation sur l'emploi des salariés expérimentés.`}
]}
];

/* ===== APPLICATION ===== */
const LS = 'revision-droit-mrh-v1';
let S = {cards:{}, quiz:{}, cas:{}, lu:{}, dark:null};
try { const r = localStorage.getItem(LS); if (r) S = Object.assign(S, JSON.parse(r)); } catch(e){}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} };

const main = document.getElementById('main'), navEl = document.getElementById('nav');
const TH = {}; THEMES.forEach(t => TH[t.n] = t);
const TABS = [['home','Accueil'],['cas','Cas pratique'],['cartes','Cartes'],['quiz','QCM'],['cours','Cours'],['chiffres','Chiffres'],['methode','Méthode']];
const V = {view:'home', th:0, cours:3, sec:'I', fc:null, qz:null, steps:{}, shown:{}};
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*6e4) / 864e5);
const GAP = [0,1,2,4,8,16];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const ALLQ = CAS.flatMap(s => s.qs);

/* ---- statistiques ---- */
const cst = i => S.cards[i] || {b:0, d:0};
function cardIdx(th){ return CARDS.map((c,i)=>i).filter(i => !th || CARDS[i][0]===th); }
function cardStats(th){ const ix = cardIdx(th), t = today(); return {n:ix.length, due:ix.filter(i=>cst(i).d<=t).length, ok:ix.filter(i=>cst(i).b>=3).length, seen:ix.filter(i=>cst(i).b>0).length}; }
function quizIdx(th){ return QUIZ.map((q,i)=>i).filter(i => !th || QUIZ[i][0]===th); }
function quizStats(th){ const ix = quizIdx(th).filter(i=>S.quiz[i]); return {n:quizIdx(th).length, done:ix.length, ok:ix.filter(i=>S.quiz[i].last).length}; }
function casStats(){ return {n:ALLQ.length, done:ALLQ.filter(q=>(S.cas[q.id]||{}).lvl).length, ok:ALLQ.filter(q=>(S.cas[q.id]||{}).lvl===3).length}; }

/* ---- composants ---- */
function chips(sel, act, counter){
  return `<div class="chips"><button class="chip ${!sel?'on':''}" data-a="${act}" data-t="0">Tous les thèmes</button>` +
    THEMES.map(t => `<button class="chip ${sel===t.n?'on':''}" data-a="${act}" data-t="${t.n}">${t.ic} ${t.t}${counter?` · ${counter(t.n)}`:''}</button>`).join('') + `</div>`;
}
const thTag = n => `<span class="tag">${TH[n].ic} ${TH[n].t}</span>`;

/* ================= ACCUEIL ================= */

  <div class="grid g4 mt">

      <div class="pbar" title="${s.ok}/${s.n} cartes maîtrisées"><i style="width:${pct(s.ok,s.n)}%"></i></div>

/* ================= CARTES ================= */
function vCartes(){
  const f = V.fc;
  if (!f) {
    const s = cardStats(V.th), ix = cardIdx(V.th), box = [0,0,0,0,0,0];
    ix.forEach(i => box[cst(i).b]++);
    return `<h1>Cartes mémoire</h1><p class="lead">Lis la question, réponds de tête (ou à voix haute), puis retourne la carte et note-toi honnêtement.</p>
    ${chips(V.th,'setTh',n=>cardStats(n).n)}
    <div class="card"><div class="row sp"><div><b>${s.due}</b> à revoir aujourd'hui · <b>${s.ok}</b> maîtrisées · ${s.n} au total</div></div>
      <div class="boxes"><div><b>${box[0]}</b>nouvelles</div>${[1,2,3,4,5].map(b=>`<div><b>${box[b]}</b>niveau ${b}</div>`).join('')}</div>
      <div class="row"><button class="btn pri" data-a="fcStart" data-m="due" data-t="${V.th}" ${s.due?'':'disabled'}>Réviser les cartes dues (${Math.min(s.due,20)})</button>
      <button class="btn" data-a="fcStart" data-m="all" data-t="${V.th}">Tout le paquet (${s.n})</button></div>
      <p class="small mute mt">Raccourcis : <kbd>Espace</kbd> pour retourner, <kbd>1</kbd> à revoir, <kbd>2</kbd> hésitant, <kbd>3</kbd> je savais.</p></div>`;
  }
  if (!f.queue.length) {
    return `<div class="card" style="text-align:center;padding:2.5rem 1rem"><h2>Séance terminée</h2><p>${f.total} cartes vues · ${f.good} sues du premier coup.</p>
      <div class="row" style="justify-content:center"><button class="btn pri" data-a="fcQuit">Retour aux cartes</button><button class="btn" data-a="go" data-v="cas">Passer au cas pratique</button></div></div>`;
  }
  const i = f.queue[0], c = CARDS[i];
  return `<div class="row sp"><button class="btn sm" data-a="fcQuit">← Quitter</button><span class="small mute">${f.done} faites · ${f.queue.length} restantes</span></div>
  <div class="pbar mt"><i style="width:${pct(f.done,f.done+f.queue.length)}%"></i></div>
  <div class="card fc mt"><div>${thTag(c[0])} ${c[3]?'<span class="tag hcb">hors cours</span>':''}</div>
    <p class="q mt">${c[1]}</p>
    ${f.shown ? `<div class="a">${c[2]}</div>` : ''}</div>
  <div class="row mt" style="justify-content:center">${f.shown ?
    `<button class="btn ko" data-a="fcRate" data-r="1">À revoir <kbd>1</kbd></button><button class="btn mid" data-a="fcRate" data-r="2">Hésitant <kbd>2</kbd></button><button class="btn ok" data-a="fcRate" data-r="3">Je savais <kbd>3</kbd></button>` :
    `<button class="btn pri" data-a="fcShow">Voir la réponse <kbd>Espace</kbd></button>`}</div>`;
}
function fcStart(mode, th){
  const t = today(); let ix = cardIdx(th);
  if (mode === 'due') ix = shuffle(ix.filter(i => cst(i).d <= t)).sort((a,b) => cst(a).b - cst(b).b).slice(0,20);
  ix = shuffle(ix);
  V.th = th; V.fc = {queue:ix, shown:false, done:0, good:0, total:ix.length, again:{}}; V.view = 'cartes';
}
function fcRate(r){
  const f = V.fc, i = f.queue.shift(), s = Object.assign({}, cst(i)), t = today();
  if (r === 1) { s.b = 1; s.d = t; f.again[i] = 1; f.queue.push(i); }
  else if (r === 2) { s.b = Math.max(1, s.b); s.d = t + 1; f.done++; }
  else { s.b = Math.min(5, s.b + 1); s.d = t + GAP[s.b]; f.done++; if (!f.again[i]) f.good++; }
  S.cards[i] = s; f.shown = false; save();
}

/* ================= QCM ================= */
function vQuiz(){
  const z = V.qz;
  if (!z) {
    const s = quizStats(V.th);
    return `<h1>QCM</h1><p class="lead">Des mises en situation courtes, inspirées de l'exercice d'entraînement. Chaque réponse est expliquée.</p>
    ${chips(V.th,'setTh',n=>quizStats(n).n)}
    <div class="card"><p><b>${s.n}</b> questions disponibles · ${s.done} déjà vues${s.done?` · ${pct(s.ok,s.done)} % de réussite`:''}</p>
      <div class="row"><button class="btn pri" data-a="qzStart" data-n="10" data-t="${V.th}">10 questions</button>
      <button class="btn" data-a="qzStart" data-n="20" data-t="${V.th}">20 questions</button>
      <button class="btn" data-a="qzStart" data-n="99" data-t="${V.th}">Toutes</button>
      ${s.done-s.ok>0?`<button class="btn ko" data-a="qzStart" data-n="err" data-t="${V.th}">Refaire mes erreurs (${s.done-s.ok})</button>`:''}</div>
      <p class="small mute mt">Les questions jamais vues ou ratées sortent en premier.</p></div>`;
  }
  if (z.pos >= z.list.length) {
    const bad = z.res.filter(r => !r.ok);
    return `<div class="card"><p class="eyebrow">Résultat</p><h2>${z.res.length - bad.length} / ${z.res.length}</h2>
      <div class="pbar"><i style="width:${pct(z.res.length-bad.length, z.res.length)}%"></i></div>
      ${bad.length ? `<h3 class="mt2">À revoir</h3>${bad.map(r => `<div class="step" style="border-color:var(--ko)"><p><b>${QUIZ[r.i][1]}</b></p><p>✔ ${QUIZ[r.i][2][QUIZ[r.i][3]]}</p><p class="small mute">${QUIZ[r.i][4]}</p><button class="btn sm" data-a="openCours" data-t="${QUIZ[r.i][0]}">Fiche : ${TH[QUIZ[r.i][0]].t}</button></div>`).join('')}` : '<p class="mt">Sans faute.</p>'}
      <div class="row mt2"><button class="btn pri" data-a="qzQuit">Nouveau QCM</button>${bad.length?`<button class="btn ko" data-a="qzStart" data-n="err" data-t="0">Refaire mes erreurs</button>`:''}<button class="btn" data-a="go" data-v="home">Accueil</button></div></div>`;
  }
  const i = z.list[z.pos], q = QUIZ[i];
  return `<div class="row sp"><button class="btn sm" data-a="qzQuit">← Quitter</button><span class="small mute">Question ${z.pos+1} / ${z.list.length}</span></div>
  <div class="pbar mt"><i style="width:${pct(z.pos, z.list.length)}%"></i></div>
  <div class="card mt">${thTag(q[0])}<h2 class="mt" style="font-size:1.25rem">${q[1]}</h2>
    ${z.order.map(o => `<button class="opt ${z.pick!==null ? (o===q[3]?'good':(o===z.pick?'bad':'')) : ''}" data-a="qzPick" data-o="${o}" ${z.pick!==null?'disabled':''}>${q[2][o]}</button>`).join('')}
    ${z.pick!==null ? `<div class="expl"><b>${z.pick===q[3]?'Exact.':'Pas tout à fait.'}</b> ${q[4]}</div><div class="row mt"><button class="btn pri" data-a="qzNext">${z.pos+1<z.list.length?'Question suivante':'Voir le résultat'} <kbd>Entrée</kbd></button></div>` : ''}</div>`;
}
function qzStart(n, th){
  let ix = quizIdx(th);
  if (n === 'err') ix = shuffle(ix.filter(i => S.quiz[i] && !S.quiz[i].last));
  else { const w = i => !S.quiz[i] ? 1 : (S.quiz[i].last ? 2 : 0); ix = shuffle(ix).sort((a,b) => w(a)-w(b)).slice(0, +n); ix = shuffle(ix); }
  if (!ix.length) { V.qz = null; V.view = 'quiz'; return; }
  V.th = th; V.qz = {list:ix, pos:0, pick:null, res:[], order:shuffle([0,1,2,3])}; V.view = 'quiz';
}
function qzPick(o){
  const z = V.qz, i = z.list[z.pos], ok = o === QUIZ[i][3];
  z.pick = o; z.res.push({i, ok});
  const s = S.quiz[i] || {ok:0, ko:0}; ok ? s.ok++ : s.ko++; s.last = ok ? 1 : 0; S.quiz[i] = s; save();
}

/* ================= CAS PRATIQUE ================= */
const STEPS = [['pb','Problème de droit'],['r','Règle'],['a','Application aux faits'],['c','Conclusion']];
function vCas(){
  const sec = CAS.find(s => s.id === V.sec) || CAS[0];
  return `<h1>Cas pratique : la SA GVC</h1>
  <p class="lead">L'exercice d'entraînement, découpé en ${ALLQ.length} questions. Pour chacune : écris ta réponse, puis dévoile le corrigé <b>une étape à la fois</b> et compare.</p>
  <div class="card mt"><p class="eyebrow">Énoncé général</p><p>${CAS_INTRO}</p></div>
  <div class="side mt"><div class="menu">${CAS.map(s => { const d = s.qs.filter(q => (S.cas[q.id]||{}).lvl).length;
      return `<button class="${s.id===sec.id?'on':''}" data-a="openSec" data-s="${s.id}"><b>${s.id}</b> ${s.t}<small>${d}/${s.qs.length}</small></button>`; }).join('')}</div>
  <div><div class="card" style="background:var(--hl-soft)"><p class="eyebrow">Partie ${sec.id}</p><p>${sec.ctx}</p></div>
  ${sec.qs.map((q,n) => casQ(q, n+1)).join('')}
  <div class="row mt2 sp">${nextSec(sec)}</div></div></div>`;
}
function nextSec(sec){ const i = CAS.indexOf(sec), p = CAS[i-1], n = CAS[i+1];
  return (p?`<button class="btn" data-a="openSec" data-s="${p.id}">← Partie ${p.id}</button>`:'<span></span>') + (n?`<button class="btn pri" data-a="openSec" data-s="${n.id}">Partie ${n.id} →</button>`:''); }
function casQ(q, n){
  const st = S.cas[q.id] || {}, k = V.steps[q.id] || 0, all = k >= STEPS.length;
  return `<div class="card mt" id="q-${q.id}">
    <div class="row sp"><div class="row">${q.th.map(thTag).join('')}</div><span class="dot ${st.lvl?'l'+st.lvl:''}" title="${['Pas encore évaluée','À retravailler','Presque','Maîtrisée'][st.lvl||0]}"></span></div>
    <p class="mt" style="font-size:1.08rem"><span class="qn">${n}.</span>${q.q}</p>
    <textarea data-q="${q.id}" placeholder="Ta réponse : quelle règle ? comment s'applique-t-elle ici ? ta conclusion ?">${(st.txt||'').replace(/</g,'&lt;')}</textarea>
    ${STEPS.slice(0,k).map(([f,l],j) => `<div class="step ${f} ${j===k-1&&V.fresh===q.id?'new':''}"><h4>${l}</h4><div>${q[f]}</div></div>`).join('')}
    ${all && q.hc ? `<div class="hc"><b>Complément hors cours.</b> ${q.hc}</div>` : ''}
    <div class="row mt">${all ?
      `<span class="small mute">Ta réponse était…</span><button class="btn sm ko" data-a="casRate" data-q="${q.id}" data-l="1">à retravailler</button><button class="btn sm mid" data-a="casRate" data-q="${q.id}" data-l="2">presque</button><button class="btn sm ok" data-a="casRate" data-q="${q.id}" data-l="3">juste</button>
       <button class="btn sm" data-a="casHide" data-q="${q.id}">Masquer le corrigé</button>` :
      `<button class="btn pri" data-a="casStep" data-q="${q.id}">Dévoiler : ${STEPS[k][1].toLowerCase()}</button>${k===0?`<button class="btn sm" data-a="casAll" data-q="${q.id}">Tout le corrigé</button>`:''}`}</div></div>`;
}

/* ================= CHIFFRES ================= */
function vChiffres(){
  const groups = THEMES.filter(t => NUMS.some(n => n[0]===t.n) && (!V.th || V.th===t.n));
  return `<h1>Chiffres et délais</h1><p class="lead">Les seuils qu'on attend de toi dans une copie. Dis le chiffre à voix haute, puis clique sur la case pour vérifier.</p>
  ${chips(V.th,'setTh')}
  <div class="row"><button class="btn sm" data-a="numAll" data-on="0">Tout masquer</button><button class="btn sm" data-a="numAll" data-on="1">Tout afficher</button></div>
  ${groups.map(t => `<h3 class="mt2">${t.ic} ${t.t}</h3><div class="card">${NUMS.map((n,i)=>[n,i]).filter(x=>x[0][0]===t.n).map(([n,i]) =>
    `<div class="nrow"><span>${n[1]}</span><button class="cloze ${V.shown[i]?'on':''}" data-a="num" data-i="${i}" aria-label="Afficher la réponse">${n[2]}</button></div>`).join('')}</div>`).join('')}`;
}

/* ================= MÉTHODE ================= */
function vMethode(){
  return `<h1>La méthode du cas pratique</h1>
  <p class="lead">Une réponse juste mais non justifiée rapporte peu. Chaque question se traite en quatre temps — c'est le plan de tous les corrigés de cet outil.</p>
  <div class="card mt"><ol class="syl">
    <li><b>Qualifier les faits et poser le problème.</b> Traduis l'histoire en termes juridiques : « muter à Pessac » devient « changement de lieu de travail hors du secteur géographique ». Une phrase suffit.</li>
    <li><b>Énoncer la règle.</b> Le texte ou la jurisprudence, ses conditions, ses effets. Cite l'article si tu le connais ; sinon, énonce clairement le principe.</li>
    <li><b>Appliquer aux faits.</b> Reprends les éléments de l'énoncé un par un et confronte-les aux conditions. C'est là que se gagnent les points.</li>
    <li><b>Conclure.</b> Réponds à la question posée : oui, non, ou « oui à condition que ». Si un fait manque, envisage les deux hypothèses.</li>
  </ol></div>

  <h2 class="mt2">Un exemple rédigé</h2>
  <div class="card"><p><i>« M. Gédéon a offert une Bible à un collègue hospitalisé. Peut-on le licencier pour prosélytisme ? »</i></p>
    <div class="step"><h4>Problème</h4>Un acte à caractère religieux accompli hors de l'entreprise peut-il justifier un licenciement ?</div>
    <div class="step"><h4>Règle</h4>Les convictions religieuses figurent parmi les motifs de discrimination prohibés ; la mesure fondée sur un tel motif est nulle. L'entreprise ne peut restreindre leur manifestation que par une clause de neutralité du règlement intérieur, justifiée et proportionnée (L1321-2-1), qui ne vaut que dans l'entreprise.</div>
    <div class="step"><h4>Application</h4>En l'espèce, le geste a eu lieu à l'hôpital, hors du temps et du lieu de travail. Il est isolé et sans pression. Il relève de la vie personnelle du salarié et ne cause aucun trouble dans l'entreprise.</div>
    <div class="step c"><h4>Conclusion</h4>Le licenciement serait discriminatoire, donc nul. Il ne peut pas être prononcé.</div></div>

  <h2 class="mt2">Les réflexes : un mot de l'énoncé, une règle</h2>
  <div class="card tw"><table><tr><th>Si l'énoncé parle de…</th><th>Pense à…</th><th></th></tr>
    ${REFLEXES.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><button class="btn sm" data-a="openCours" data-t="${r[2]}">Fiche</button></td></tr>`).join('')}</table></div>

  <h2 class="mt2">Trois mécanismes qui reviennent partout</h2>
  <div class="grid g2">
    <div class="card"><h3>Preuve en trois temps</h3><p class="small">Discrimination, harcèlement, égalité de salaire : le salarié <b>laisse supposer</b>, l'employeur <b>justifie objectivement</b>, le juge tranche.</p></div>
    <div class="card"><h3>Justifié et proportionné</h3><p class="small">Tenue, expression, neutralité, surveillance : toute restriction d'une liberté doit être justifiée par la tâche et proportionnée au but.</p></div>
    <div class="card"><h3>Nullité</h3><p class="small">Atteinte à une liberté fondamentale, discrimination, harcèlement, maternité, accident du travail, grève : le licenciement est <b>nul</b>, pas seulement injustifié — réintégration possible.</p></div>
    <div class="card"><h3>Vie personnelle</h3><p class="small">Hors du travail, le salarié est libre. Sanction possible seulement si le fait <b>se rattache à la vie professionnelle</b> ou viole la loyauté.</p></div>
  </div>

  <h2 class="mt2">Erreurs fréquentes</h2>
  <div class="card"><ul>
    <li>Répondre « oui » ou « non » sans règle ni application.</li>
    <li>Réciter le cours sans jamais revenir aux faits de l'énoncé.</li>
    <li>Oublier de qualifier : accident du travail ou maladie ordinaire ? modification du contrat ou des conditions de travail ?</li>
    <li>Ignorer une sous-question : chaque point d'interrogation de l'énoncé appelle une réponse.</li>
    <li>Trancher alors qu'un fait manque : écris « si… alors… ; à défaut… ».</li>
  </ul></div>`;
}

/* ================= MOTEUR ================= */
const VIEWS = {home:vHome, cours:vCours, cartes:vCartes, quiz:vQuiz, cas:vCas, chiffres:vChiffres, methode:vMethode};
function render(top){
  navEl.innerHTML = TABS.map(([v,l]) => `<button class="${V.view===v?'on':''}" data-a="go" data-v="${v}">${l}</button>`).join('');
  main.innerHTML = VIEWS[V.view]();
  if (top) window.scrollTo(0,0);
}
const ACT = {
  go: e => { V.view = e.dataset.v; V.fc = null; V.qz = null; render(1); },
  dark: () => { const d = document.documentElement; S.dark = d.dataset.theme === 'dark' ? 0 : 1; d.dataset.theme = S.dark ? 'dark' : 'light'; save(); },
  setTh: e => { V.th = +e.dataset.t; render(); },
  openCours: e => { V.cours = +e.dataset.t; V.view = 'cours'; V.fc = null; V.qz = null; render(1); },
  lu: e => { const t = +e.dataset.t; S.lu[t] = S.lu[t] ? 0 : 1; save(); render(); },
  fcStart: e => { fcStart(e.dataset.m, +(e.dataset.t||0)); render(1); },
  fcShow: () => { V.fc.shown = true; render(); },
  fcRate: e => { fcRate(+e.dataset.r); render(); },
  fcQuit: () => { V.fc = null; render(1); },
  qzStart: e => { const n = e.dataset.n; qzStart(n==='err'?n:+n, +(e.dataset.t||0)); render(1); },
  qzPick: e => { qzPick(+e.dataset.o); render(); },
  qzNext: () => { const z = V.qz; z.pos++; z.pick = null; z.order = shuffle([0,1,2,3]); render(1); },
  qzQuit: () => { V.qz = null; render(1); },
  openSec: e => { V.sec = e.dataset.s; render(1); },
  casStep: e => { V.steps[e.dataset.q] = (V.steps[e.dataset.q]||0) + 1; V.fresh = e.dataset.q; render(); V.fresh = null; },
  casAll: e => { V.steps[e.dataset.q] = STEPS.length; render(); },
  casHide: e => { V.steps[e.dataset.q] = 0; render(); },
  casRate: e => { const q = e.dataset.q; S.cas[q] = Object.assign(S.cas[q]||{}, {lvl:+e.dataset.l}); save(); render(); },
  num: e => { const i = e.dataset.i; V.shown[i] = !V.shown[i]; e.classList.toggle('on'); },
  numAll: e => { NUMS.forEach((n,i) => V.shown[i] = e.dataset.on === '1'); render(); },
  reset: () => { if (confirm('Effacer toute ta progression (cartes, QCM, réponses au cas) ?')) { S = {cards:{}, quiz:{}, cas:{}, lu:{}, dark:S.dark}; save(); render(1); } }
};
document.addEventListener('click', ev => { const el = ev.target.closest('[data-a]'); if (el && !el.disabled && ACT[el.dataset.a]) ACT[el.dataset.a](el); });
document.addEventListener('input', ev => { const q = ev.target.dataset && ev.target.dataset.q; if (q && ev.target.tagName === 'TEXTAREA') { S.cas[q] = Object.assign(S.cas[q]||{}, {txt:ev.target.value}); save(); } });
document.addEventListener('keydown', ev => {
  if (/TEXTAREA|INPUT/.test(ev.target.tagName)) return;
  if (V.view === 'cartes' && V.fc && V.fc.queue.length) {
    if (!V.fc.shown && (ev.key === ' ' || ev.key === 'Enter')) { ev.preventDefault(); ACT.fcShow(); }
    else if (V.fc.shown && '123'.includes(ev.key)) { fcRate(+ev.key); render(); }
  } else if (V.view === 'quiz' && V.qz && V.qz.pick !== null && ev.key === 'Enter' && V.qz.pos < V.qz.list.length) { ev.preventDefault(); ACT.qzNext(); }
});
if (S.dark === 1 || (S.dark === null && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
render();
</script>
</body>
</html>
